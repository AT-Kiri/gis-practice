<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GIS-Practice Wiki</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1e293b;color:#e2e8f0;height:100vh;display:flex;overflow:hidden}
.sidebar{width:320px;background:#0f172a;border-right:1px solid #334155;display:flex;flex-direction:column;transition:width .2s}
.sidebar.collapsed{width:0;overflow:hidden}
.sidebar-header{padding:16px;border-bottom:1px solid #334155}
.sidebar-header-row{display:flex;align-items:center;justify-content:space-between}
.sidebar-header h1{font-size:18px;color:#f1f5f9;margin-bottom:4px}
.sidebar-header p{font-size:11px;color:#64748b}
.sidebar-toggle{background:none;border:1px solid #475569;color:#94a3b8;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px}
.sidebar-toggle:hover{background:#334155;color:#e2e8f0}
.search-box{padding:12px 16px;border-bottom:1px solid #334155;position:relative}
.search-box input{width:100%;padding:10px 12px 10px 36px;background:#1e293b;border:1px solid #475569;border-radius:8px;color:#e2e8f0;font-size:14px}
.search-box input:focus{outline:none;border-color:#3b82f6}
.search-results{position:absolute;top:100%;left:16px;right:16px;background:#1e293b;border:1px solid #334155;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.3);z-index:100;max-height:300px;overflow-y:auto;display:none}
.search-results.active{display:block}
.search-result-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #334155;display:flex;align-items:center;gap:10px}
.search-result-item:hover{background:#334155}
.search-result-item .dot{width:8px;height:8px;border-radius:50%}
.nav-tree{flex:1;overflow-y:auto;padding:8px 0}
.nav-group{margin-bottom:8px}
.nav-group-title{padding:8px 16px 4px;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
.nav-group-title:hover{color:#94a3b8}
.nav-group-arrow{font-size:8px;transition:transform .2s;display:inline-block}
.nav-group-title .count{color:#475569;font-weight:400}
.nav-item{padding:6px 16px 6px 24px;cursor:pointer;font-size:13px;color:#cbd5e1;border-left:3px solid transparent;transition:all .15s;display:flex;align-items:center;gap:8px}
.nav-item:hover{background:#334155;color:#f1f5f9}
.nav-item.active{background:#1e3a8a30;border-left-color:#3b82f6;color:#60a5fa}
.nav-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#0f172a;border-bottom:1px solid #334155}
.toolbar-btn{background:none;border:1px solid #475569;color:#94a3b8;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px}
.toolbar-btn:hover{background:#334155;color:#e2e8f0}
.toolbar-btn.active{background:#1e3a8a;border-color:#3b82f6;color:#60a5fa}
.toolbar-spacer{flex:1}
.sidebar-toggle-collapsed{position:fixed;top:12px;left:12px;z-index:100;width:36px;height:36px;border-radius:8px;background:rgba(30,41,59,.95);border:1px solid #334155;color:#94a3b8;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.sidebar-toggle-collapsed:hover{background:#334155;color:#e2e8f0}
.content{flex:1;overflow-y:auto;position:relative}
.page-view{padding:32px;max-width:900px;margin:0 auto}
.page-header{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid #334155}
.page-title{font-size:28px;font-weight:700;color:#f1f5f9;margin-bottom:12px}
.page-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta-tag{font-size:11px;padding:4px 10px;border-radius:12px;background:#334155;color:#94a3b8;font-weight:500}
.page-summary{color:#94a3b8;font-size:14px;margin-top:12px}
.markdown-body{line-height:1.8;color:#cbd5e1;font-size:15px}
.markdown-body h1{font-size:24px;color:#f1f5f9;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #334155}
.markdown-body h2{font-size:20px;color:#e2e8f0;margin:24px 0 12px}
.markdown-body h3{font-size:17px;color:#e2e8f0;margin:20px 0 10px}
.markdown-body p{margin:14px 0}
.markdown-body ul,.markdown-body ol{margin:14px 0;padding-left:24px}
.markdown-body li{margin:6px 0}
.markdown-body code{background:#1e293b;padding:3px 8px;border-radius:4px;font-size:13px;color:#f472b6;border:1px solid #334155}
.markdown-body pre{background:#0f172a;padding:20px;border-radius:8px;overflow-x:auto;margin:20px 0;border:1px solid #334155}
.markdown-body pre code{background:none;padding:0;color:#e2e8f0;border:none}
.markdown-body table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}
.markdown-body th,.markdown-body td{padding:10px 14px;border:1px solid #334155;text-align:left}
.markdown-body th{background:#1e293b;color:#f1f5f9;font-weight:600}
.markdown-body blockquote{border-left:3px solid #3b82f6;padding-left:16px;margin:20px 0;color:#94a3b8;font-style:italic}
.markdown-body a{color:#60a5fa;text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body hr{border:none;border-top:1px solid #334155;margin:28px 0}
.refs-panel{margin-top:32px;padding-top:20px;border-top:1px solid #334155}
.refs-panel h3{font-size:13px;color:#64748b;margin-bottom:12px}
.ref-link{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;margin:4px;background:#1e293b;border:1px solid #334155;border-radius:16px;font-size:12px;color:#60a5fa;cursor:pointer}
.ref-link:hover{background:#334155}
.ref-link .dot{width:6px;height:6px;border-radius:50%}
.graph-view{position:absolute;top:0;left:0;right:0;bottom:0;background:#0f172a;display:none;overflow:hidden}
.graph-view.active{display:block}
.graph-svg{width:100%;height:100%;display:block}
.graph-controls{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
.graph-control-btn{width:36px;height:36px;border-radius:8px;background:rgba(30,41,59,.9);border:1px solid #334155;color:#94a3b8;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.graph-control-btn:hover{background:#334155;color:#e2e8f0}
.graph-legend{position:absolute;bottom:16px;left:16px;background:rgba(15,23,42,.95);padding:14px 18px;border-radius:10px;font-size:12px;border:1px solid #334155;z-index:10}
.graph-legend h4{font-size:11px;color:#64748b;margin-bottom:8px}
.graph-legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;color:#94a3b8}
.graph-legend-color{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.graph-node{cursor:pointer}
.graph-node circle{stroke:#0f172a;stroke-width:2px}
.graph-node text{font-size:11px;fill:#e2e8f0;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.graph-link{stroke-opacity:.3}
style</head>

const pageData = {"pages/apis/agent-api":{"content":"\n# Agent 对话 API\n\n## 1. 概述\n\nAgent 对话 API，提供 SSE（Server-Sent Events）流式响应的对话接口，支持单 Agent 和多智能体两种模式。\n\n## 2. 接口列表\n\n### 2.1 单 Agent 对话（P0 fallback）\n\n\`\`\`\nPOST /api/agent/chat\n\`\`\`\n\n**请求体**：\n\n\`\`\`json\n{\n  \"message\": \"查询北京市附近的医院\",\n  \"session_id\": \"default\"\n}\n\`\`\`\n\n**SSE 事件**：\n\n| 事件 | 说明 |\n|------|------|\n| \`agent_start\` | Agent 开始执行 |\n| \`tool_start\` | 工具开始调用 |\n| \`tool_result\` | 工具执行完成 |\n| \`text\` | 流式文本 token |\n| \`agent_end\` | 全部完成 |\n| \`error\` | 出错 |\n\n### 2.2 多智能体对话（P1 推荐）\n\n\`\`\`\nPOST /api/agent/chat/multi\n\`\`\`\n\n**请求体**：\n\n\`\`\`json\n{\n  \"message\": \"查询北京市附近的医院\",\n  \"session_id\": \"default\"\n}\n\`\`\`\n\n**SSE 事件**：\n\n| 事件 | 说明 |\n|------|------|\n| \`agent_start\` | 协调者开始执行 |\n| \`intent_classified\` | 意图分类完成 |\n| \`plan_created\` | 任务规划完成 |\n| \`step_start\` | 某步开始 |\n| \`tool_start\` | 工具开始调用（来自子 Agent） |\n| \`tool_result\` | 工具执行完成（来自子 Agent） |\n| \`step_done\` | 某步完成 |\n| \`text\` | 流式文本 token（最终汇总报告） |\n| \`agent_end\` | 全部完成 |\n| \`error\` | 出错 |\n\n### 2.3 获取会话历史\n\n\`\`\`\nGET /api/agent/sessions/{session_id}/history\n\`\`\`\n\n### 2.4 清空会话历史\n\n\`\`\`\nDELETE /api/agent/sessions/{session_id}/history\n\`\`\`\n\n## 3. 请求模型\n\n\`\`\`python\nclass ChatRequest(BaseModel):\n    message: str\n    session_id: str = \"default\"\n\`\`\`\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Agent API | \`agent-backend/app/api/agent.py\` |\n| 前端调用 | \`frontend/src/utils/agent/sse.js\` |\n","fm":{"title":"Agent 对话 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["apis/rag-api.md","concepts/multi-agent.md"],"source":["agent-backend/app/api/agent.py"],"summary":"Agent 对话 API，提供 SSE 流式响应的对话接口"},"references":[],"related":["pages/apis/rag-api","pages/concepts/multi-agent"],"source":["agent-backend/app/api/agent.py"],"type":"api"},"pages/apis/coord-response":{"content":"\n# 协同叫应 API\n\n## 1. 概述\n\n协同叫应处置表 \`tb_coord_response\` 的 REST API，提供完整的 CRUD 操作。\n\n## 2. 基础路径\n\n\`\`\`\n/api/coord-response\n\`\`\`\n\n## 3. 接口列表\n\n### 3.1 获取列表\n\n\`\`\`\nGET /api/coord-response\n\`\`\`\n\n**响应**：\`R<List<CoordResponse>>\`\n\n### 3.2 获取单条\n\n\`\`\`\nGET /api/coord-response/{responseId}\n\`\`\`\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`responseId\` | \`String\` | 处置记录编号（路径参数） |\n\n**响应**：\`R<CoordResponse>\`\n\n### 3.3 新增\n\n\`\`\`\nPOST /api/coord-response\n\`\`\`\n\n**请求体**：\`CoordResponse\` JSON\n\n**响应**：\`R<Integer>\`（影响行数）\n\n### 3.4 更新\n\n\`\`\`\nPUT /api/coord-response/{responseId}\n\`\`\`\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`responseId\` | \`String\` | 处置记录编号（路径参数） |\n\n**请求体**：\`CoordResponse\` JSON\n\n**响应**：\`R<Integer>\`（影响行数）\n\n### 3.5 删除\n\n\`\`\`\nDELETE /api/coord-response/{responseId}\n\`\`\`\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`responseId\` | \`String\` | 处置记录编号（路径参数） |\n\n**响应**：\`R<Integer>\`（影响行数）\n\n## 4. 异常处理\n\n- \`IllegalArgumentException\` → 400 Bad Request\n- 其他未捕获异常 → 500 Internal Server Error\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/CoordResponseController.java\` |\n| Service | \`backend/src/main/java/com/gis/emergency/service/CoordResponseService.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/CoordResponseMapper.java\` |\n| 实体类 | \`backend/src/main/java/com/gis/emergency/entity/CoordResponse.java\` |\n","fm":{"title":"协同叫应 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/coord-response-view.md","pages/entities/coord-response.md"],"related":["pages/apis/warn-info.md","pages/apis/supply-dispatch.md","pages/apis/health.md"],"source":["backend/src/main/java/com/gis/emergency/controller/CoordResponseController.java","backend/src/main/java/com/gis/emergency/entity/CoordResponse.java"],"summary":"协同叫应处置表 REST API，提供 CRUD 操作"},"references":["pages/views/coord-response-view","pages/entities/coord-response"],"related":["pages/apis/warn-info","pages/apis/supply-dispatch","pages/apis/health"],"source":["backend/src/main/java/com/gis/emergency/controller/CoordResponseController.java","backend/src/main/java/com/gis/emergency/entity/CoordResponse.java"],"type":"api"},"pages/apis/health":{"content":"\n# 健康检查 API\n\n## 1. 概述\n\n简单的健康检查接口，返回后端服务运行状态。\n\n## 2. 接口\n\n\`\`\`\nGET /api/health\n\`\`\`\n\n**响应**：\n\`\`\`json\n{\n  \"code\": 200,\n  \"message\": \"success\",\n  \"data\": \"京津冀城市综合防灾应急管理系统后端运行正常\"\n}\n\`\`\`\n\n## 3. 用途\n\n- 前端启动时检测后端是否可用\n- 运维监控服务状态\n- 负载均衡健康检查\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/HealthController.java\` |\n","fm":{"title":"健康检查 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/apis/coord-response.md","pages/apis/warn-info.md","pages/apis/supply-dispatch.md"],"source":["backend/src/main/java/com/gis/emergency/controller/HealthController.java"],"summary":"健康检查接口，用于前端/运维确认后端服务是否正常运行"},"references":[],"related":["pages/apis/coord-response","pages/apis/warn-info","pages/apis/supply-dispatch"],"source":["backend/src/main/java/com/gis/emergency/controller/HealthController.java"],"type":"api"},"pages/apis/iserver-buffer":{"content":"\n# iServer 缓冲区分析 API\n\n## 1. 概述\n\nSuperMap iServer 的**几何缓冲区分析** REST API，对点/线/面几何对象按指定距离向外扩展生成缓冲区多边形。\n\n## 2. 接口\n\n\`\`\`\nPOST /iserver/services/spatialanalyst-sample/restjsr/spatialanalyst/geometry/buffer.json?returnContent=true\n\`\`\`\n\n## 3. 请求参数\n\n\`\`\`json\n{\n  \"sourceGeometry\": {\n    \"type\": \"POINT\",\n    \"points\": [{\"x\": 116.4, \"y\": 39.9}]\n  },\n  \"analystParameter\": {\n    \"endType\": \"ROUND\",\n    \"leftDistance\": {\"value\": 0.0045},\n    \"rightDistance\": {\"value\": 0.0045},\n    \"semicircleLineSegment\": 10\n  }\n}\n\`\`\`\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`sourceGeometry\` | \`Object\` | 源几何对象（POINT/LINE/REGION） |\n| \`analystParameter.endType\` | \`String\` | 端点类型：\`ROUND\`（圆头）/ \`FLAT\`（平头） |\n| \`analystParameter.leftDistance\` | \`Object\` | 左侧距离（度） |\n| \`analystParameter.rightDistance\` | \`Object\` | 右侧距离（度） |\n| \`analystParameter.semicircleLineSegment\` | \`Number\` | 圆弧线段数 |\n\n## 4. 距离单位转换\n\nAPI 使用**度**作为距离单位，需要将米转换为度：\n\n\`\`\`python\ndef meters_to_degrees(meters, lat=39.9):\n    return meters / (111320 * math.cos(math.radians(lat)))\n\`\`\`\n\n## 5. 响应格式\n\n\`\`\`json\n{\n  \"resultGeometry\": {\n    \"type\": \"REGION\",\n    \"points\": [{\"x\": 116.4045, \"y\": 39.9}, ...],\n    \"parts\": [65]\n  }\n}\n\`\`\`\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| iServer 客户端 | \`agent-backend/app/services/iserver_client.py\` |\n| 前端调用 | \`frontend/src/components/SpatialAnalysis.vue\` |\n","fm":{"title":"iServer 缓冲区分析 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/concepts/buffer-analysis.md","pages/flows/buffer-analysis.md","pages/components/spatial-analysis.md"],"related":["apis/iserver-feature-results.md","apis/iserver-network-analyst.md"],"source":["agent-backend/app/services/iserver_client.py","frontend/src/components/SpatialAnalysis.vue"],"summary":"SuperMap iServer 几何缓冲区分析 REST API"},"references":["pages/concepts/buffer-analysis","pages/flows/buffer-analysis","pages/components/spatial-analysis"],"related":["pages/apis/iserver-feature-results","pages/apis/iserver-network-analyst"],"source":["agent-backend/app/services/iserver_client.py","frontend/src/components/SpatialAnalysis.vue"],"type":"api"},"pages/apis/iserver-feature-results":{"content":"\n# iServer 空间查询 API\n\n## 1. 概述\n\nSuperMap iServer 的 **featureResults** REST API，提供空间数据查询能力，支持按几何范围查询要素。\n\n## 2. 接口列表\n\n### 2.1 京津冀数据源查询\n\n\`\`\`\nPOST /iserver/services/data-jingjin/rest/data/featureResults.json?returnContent=true\n\`\`\`\n\n**请求体**：\n\n\`\`\`json\n{\n  \"getFeatureMode\": \"SPATIAL\",\n  \"datasetNames\": [\"Jingjin:County_P\", \"Jingjin:Town_P\", ...],\n  \"geometry\": {\n    \"type\": \"REGION\",\n    \"points\": [{\"x\": lng, \"y\": lat}, ...],\n    \"parts\": [n]\n  },\n  \"spatialQueryMode\": \"INTERSECT\"\n}\n\`\`\`\n\n**响应**：\n\n\`\`\`json\n{\n  \"datasetInfos\": [\n    {\"datasetName\": \"Jingjin:County_P\", \"featureRange\": {\"start\": 0, \"end\": 5}}\n  ],\n  \"features\": [\n    {\n      \"fieldNames\": [\"SMID\", \"NAME\", ...],\n      \"fieldValues\": [\"1\", \"北京市\", ...],\n      \"geometry\": {\"type\": \"REGION\", \"points\": [...], \"parts\": [...]}\n    }\n  ]\n}\n\`\`\`\n\n### 2.2 长春数据源查询\n\n\`\`\`\nPOST /iserver/services/data-changchun/rest/data/featureResults.json?returnContent=true\n\`\`\`\n\n用于查询长春市路网等数据。\n\n### 2.3 获取数据集列表\n\n\`\`\`\nGET /iserver/services/data-jingjin/rest/data/datasources/Jingjin/datasets.json\n\`\`\`\n\n## 3. 数据集\n\n### 3.1 京津冀数据源（Jingjin）\n\n| 数据集 | 说明 |\n|--------|------|\n| \`County_P\` | 县级市 |\n| \`Town_P\` | 乡镇 |\n| \`Road_L\` | 道路 |\n| \`Railway_L\` | 铁路 |\n| \`River_L\` | 河流 |\n| \`Lake_R\` | 湖泊 |\n| \`Landuse_R\` | 土地利用 |\n| \`Geomor_R\` | 地貌 |\n| \`Coastline_L\` | 海岸线 |\n\n### 3.2 长春数据源（Changchun）\n\n| 数据集 | 说明 |\n|--------|------|\n| \`RoadNet\` | 道路网络 |\n| \`POI\` | 兴趣点 |\n\n## 4. 空间查询模式\n\n| 模式 | 说明 |\n|------|------|\n| \`INTERSECT\` | 相交（有公共部分即返回） |\n| \`CONTAIN\` | 完全包含 |\n| \`WITHIN\` | 被包含 |\n| \`DISJOINT\` | 相离 |\n| \`BUFFER\` | 缓冲区范围内 |\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| iServer 客户端 | \`agent-backend/app/services/iserver_client.py\` |\n| 前端调用 | \`frontend/src/components/SpatialQuery.vue\` |\n","fm":{"title":"iServer 空间查询 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/concepts/spatial-query.md","pages/flows/spatial-query.md","pages/components/spatial-query.md"],"related":["apis/iserver-buffer.md","apis/iserver-network-analyst.md","apis/iserver-map-tile.md"],"source":["agent-backend/app/services/iserver_client.py","frontend/src/components/SpatialQuery.vue"],"summary":"SuperMap iServer featureResults REST API，提供空间数据查询能力"},"references":["pages/concepts/spatial-query","pages/flows/spatial-query","pages/components/spatial-query"],"related":["pages/apis/iserver-buffer","pages/apis/iserver-network-analyst","pages/apis/iserver-map-tile"],"source":["agent-backend/app/services/iserver_client.py","frontend/src/components/SpatialQuery.vue"],"type":"api"},"pages/apis/iserver-map-tile":{"content":"\n# iServer 地图切片 API\n\n## 1. 概述\n\nSuperMap iServer 的**地图切片** REST API，提供瓦片地图和图片服务，用于地图底图渲染。\n\n## 2. 接口列表\n\n### 2.1 世界底图\n\n\`\`\`\nGET /iserver/services/map-world/rest/maps/World/tileImage.png?width=256&height=256&...\n\`\`\`\n\n### 2.2 京津冀专题图\n\n\`\`\`\nGET /iserver/services/map-jingjin/rest/maps/京津地区地图/tileImage.png?width=256&height=256&...\n\`\`\`\n\n### 2.3 长春市区图\n\n\`\`\`\nGET /iserver/services/map-changchun/rest/maps/长春市区图/tileImage.png?width=256&height=256&...\n\`\`\`\n\n### 2.4 长春底图（图片模式）\n\n\`\`\`\nGET /iserver/services/map-changchun/rest/maps/长春市区图/image.png?width=4096&height=...&viewBounds=...\n\`\`\`\n\n**参数**：\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`width\` | \`Number\` | 图片宽度（像素） |\n| \`height\` | \`Number\` | 图片高度（像素） |\n| \`viewBounds\` | \`String\` | 视图范围 JSON（URL 编码） |\n| \`transparent\` | \`Boolean\` | 是否透明 |\n| \`cacheEnabled\` | \`Boolean\` | 是否启用缓存 |\n\n## 3. 地图服务配置\n\n| 地图 | URL 前缀 | 用途 |\n|------|---------|------|\n| World | \`/iserver/services/map-world/rest/maps/World\` | 全球底图 |\n| 京津地区地图 | \`/iserver/services/map-jingjin/rest/maps/京津地区地图\` | 京津冀专题图 |\n| 长春市区图 | \`/iserver/services/map-changchun/rest/maps/长春市区图\` | 网络分析底图 |\n\n## 4. 前端使用\n\n### 4.1 瓦片地图（SmMapViewer）\n\n\`\`\`js\nsources: {\n  'world': {\n    type: 'raster',\n    tiles: [getTileUrl(\`\${ISERVER_URL}/iserver/services/map-world/rest/maps/World\`)],\n    tileSize: 256,\n  },\n  'jingjin': {\n    type: 'raster',\n    tiles: [getTileUrl(\`\${ISERVER_URL}/iserver/services/map-jingjin/rest/maps/京津地区地图\`)],\n    tileSize: 256,\n  },\n}\n\`\`\`\n\n### 4.2 图片底图（NetworkAnalysis）\n\n\`\`\`js\nconst url = \`\${ISERVER_URL}/iserver/services/map-changchun/rest/maps/长春市区图/image.png?width=4096&height=...&viewBounds=...\`\nmap.addSource('na-bg-image', { type: 'image', url, coordinates: [nw, ne, se, sw] })\n\`\`\`\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 前端地图组件 | \`frontend/src/components/SmMapViewer.vue\` |\n| 网络分析组件 | \`frontend/src/components/NetworkAnalysis.vue\` |\n| 工具函数 | \`frontend/src/utils/map.js\` |\n","fm":{"title":"iServer 地图切片 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/sm-map-viewer.md","pages/components/nav-sidebar.md","pages/components/map-toolbar.md","pages/components/map-overview.md","pages/components/map-measure.md","pages/components/feature-search.md","pages/components/spatial-analysis.md","pages/components/network-analysis.md","pages/components/spatial-query.md","pages/components/layer-manager.md"],"related":["apis/iserver-feature-results.md"],"source":["frontend/src/components/SmMapViewer.vue","frontend/src/components/NetworkAnalysis.vue","frontend/src/utils/map.js"],"summary":"SuperMap iServer 地图切片 REST API，提供瓦片地图和图片服务"},"references":["pages/components/sm-map-viewer","pages/components/nav-sidebar","pages/components/map-toolbar","pages/components/map-overview","pages/components/map-measure","pages/components/feature-search","pages/components/spatial-analysis","pages/components/network-analysis","pages/components/spatial-query","pages/components/layer-manager"],"related":["pages/apis/iserver-feature-results"],"source":["frontend/src/components/SmMapViewer.vue","frontend/src/components/NetworkAnalysis.vue","frontend/src/utils/map.js"],"type":"api"},"pages/apis/iserver-network-analyst":{"content":"\n# iServer 网络分析 API\n\n## 1. 概述\n\nSuperMap iServer 的**网络分析** REST API，提供最短路径分析和服务区分析能力。\n\n## 2. 路网数据\n\n| 参数 | 值 |\n|------|-----|\n| 服务地址 | \`/iserver/services/transportationanalyst-sample/rest/networkanalyst/RoadNet@Changchun\` |\n| 数据源 | \`RoadNet@Changchun\`（长春道路网络） |\n| 坐标系 | 长春平面坐标（需转换为 WGS84） |\n\n## 3. 接口列表\n\n### 3.1 最短路径分析\n\n\`\`\`\nGET /iserver/services/transportationanalyst-sample/rest/networkanalyst/RoadNet@Changchun/path.json\n\`\`\`\n\n**参数**：\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`nodes\` | \`String\` | 路径点 JSON \`[{\"x\":lng,\"y\":lat},...]\` |\n| \`parameter\` | \`String\` | 分析参数 JSON |\n| \`hasLeastEdgeCount\` | \`String\` | 是否最少边数 |\n\n**响应**：\n\n\`\`\`json\n{\n  \"pathList\": [{\n    \"pathGuideItems\": [...],\n    \"route\": {\"type\": \"LINEM\", \"points\": [...], \"parts\": [...]},\n    \"weight\": 1234.5\n  }]\n}\n\`\`\`\n\n### 3.2 服务区分析\n\n\`\`\`\nGET /iserver/services/transportationanalyst-sample/rest/networkanalyst/RoadNet@Changchun/serviceareas.json\n\`\`\`\n\n**参数**：\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`centers\` | \`String\` | 中心点 JSON \`[[x,y]]\` |\n| \`weights\` | \`String\` | 半径 JSON \`[500]\` |\n| \`parameter\` | \`String\` | 分析参数 JSON |\n| \`isAnalyzeById\` | \`String\` | 是否按 ID 分析 |\n\n**响应**：\n\n\`\`\`json\n{\n  \"serviceAreaList\": [{\n    \"edgeFeatures\": {\n      \"type\": \"FeatureCollection\",\n      \"features\": [...]\n    }\n  }]\n}\n\`\`\`\n\n## 4. 坐标转换\n\n网络分析使用**长春平面坐标**，需要转换：\n\n\`\`\`python\n# WGS84 → 长春平面\ndef wgs84_to_changchun(lng, lat):\n    x = (lng - 125.15) / (125.45 - 125.15) * (8958.0372 - 47.5066) + 47.5066\n    y = (lat - 43.74185) / (43.99815 - 43.74185) * (-54.7406 - (-7668.9829)) + (-7668.9829)\n    return x, y\n\n# 长春平面 → WGS84\ndef changchun_to_wgs84(x, y):\n    lng = (x - 47.5066) / (8958.0372 - 47.5066) * (125.45 - 125.15) + 125.15\n    lat = (y - (-7668.9829)) / (-54.7406 - (-7668.9829)) * (43.99815 - 43.74185) + 43.74185\n    return lng, lat\n\`\`\`\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| iServer 客户端 | \`agent-backend/app/services/iserver_client.py\` |\n| 前端调用 | \`frontend/src/components/NetworkAnalysis.vue\` |\n","fm":{"title":"iServer 网络分析 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/concepts/network-analysis.md","pages/flows/network-analysis.md","pages/components/network-analysis.md"],"related":["apis/iserver-feature-results.md","apis/iserver-buffer.md"],"source":["agent-backend/app/services/iserver_client.py","frontend/src/components/NetworkAnalysis.vue"],"summary":"SuperMap iServer 网络分析 REST API，提供最短路径和服务区分析"},"references":["pages/concepts/network-analysis","pages/flows/network-analysis","pages/components/network-analysis"],"related":["pages/apis/iserver-feature-results","pages/apis/iserver-buffer"],"source":["agent-backend/app/services/iserver_client.py","frontend/src/components/NetworkAnalysis.vue"],"type":"api"},"pages/apis/iserver-overlay":{"content":"\n# iServer 叠置分析 API\n\n## 1. 概述\n\nSuperMap iServer 的**数据集叠置分析** REST API，将两个数据集进行叠加分析（相交、合并、擦除等）。\n\n## 2. 接口\n\n\`\`\`\nPOST /iserver/services/spatialanalyst-sample/restjsr/spatialanalyst/datasets/{source_dataset}/overlay.json\n\`\`\`\n\n## 3. 请求参数\n\n\`\`\`json\n{\n  \"operateDataset\": \"Jingjin:Landuse_R\",\n  \"operation\": \"INTERSECT\",\n  \"tolerance\": 0,\n  \"resultSetting\": {\n    \"dataReturnMode\": \"DATASET_AND_RECORDSET\",\n    \"expectCount\": 1000\n  }\n}\n\`\`\`\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`operateDataset\` | \`String\` | 操作数据集名 |\n| \`operation\` | \`String\` | 操作类型：\`INTERSECT\`/\`UNION\`/\`ERASE\`/\`IDENTITY\` |\n| \`tolerance\` | \`Number\` | 容差（度） |\n| \`resultSetting.dataReturnMode\` | \`String\` | 返回模式 |\n| \`resultSetting.expectCount\` | \`Number\` | 期望返回数量 |\n\n## 4. 操作类型\n\n| 操作 | 说明 |\n|------|------|\n| \`INTERSECT\` | 相交（保留公共部分） |\n| \`UNION\` | 合并（所有区域） |\n| \`ERASE\` | 擦除（从源中擦除操作区） |\n| \`IDENTITY\` | 标识（用操作区边界切割源） |\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| iServer 客户端 | \`agent-backend/app/services/iserver_client.py\` |\n","fm":{"title":"iServer 叠置分析 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["concepts/overlay-analysis.md","components/spatial-analysis.md"],"related":["apis/iserver-feature-results.md","apis/iserver-buffer.md"],"source":["agent-backend/app/services/iserver_client.py"],"summary":"SuperMap iServer 数据集叠置分析 REST API"},"references":["pages/concepts/overlay-analysis","pages/components/spatial-analysis"],"related":["pages/apis/iserver-feature-results","pages/apis/iserver-buffer"],"source":["agent-backend/app/services/iserver_client.py"],"type":"api"},"pages/apis/iserver-sql-query":{"content":"\n# iServer SQL 查询 API\n\n## 1. 概述\n\nSuperMap iServer 的 **SQL 查询** REST API，用于查询矢量数据，如长春道路网络。\n\n## 2. 接口\n\n\`\`\`\nPOST /iserver/services/map-changchun/rest/maps/长春市区图/queryBySQL.json\n\`\`\`\n\n## 3. 请求参数\n\n\`\`\`json\n{\n  \"queryQueryParams\": [\n    {\n      \"name\": \"RoadNet@Changchun@@长春市区图\",\n      \"attributeFilter\": \"\"\n    }\n  ],\n  \"returnAttribute\": true,\n  \"returnGeometry\": true,\n  \"expectCount\": 2000\n}\n\`\`\`\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| \`queryQueryParams\` | \`Array\` | 查询参数列表 |\n| \`queryQueryParams[].name\` | \`String\` | 数据集名称 |\n| \`queryQueryParams[].attributeFilter\` | \`String\` | 属性过滤条件 |\n| \`returnAttribute\` | \`Boolean\` | 是否返回属性 |\n| \`returnGeometry\` | \`Boolean\` | 是否返回几何 |\n| \`expectCount\` | \`Number\` | 期望返回数量 |\n\n## 4. 响应格式\n\n\`\`\`json\n{\n  \"recordsets\": [\n    {\n      \"features\": {\n        \"type\": \"FeatureCollection\",\n        \"features\": [\n          {\n            \"type\": \"Feature\",\n            \"geometry\": {\"type\": \"LineString\", \"coordinates\": [[x, y], ...]},\n            \"properties\": {\"name\": \"...\"}\n          }\n        ]\n      }\n    }\n  ]\n}\n\`\`\`\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 前端调用 | \`frontend/src/components/NetworkAnalysis.vue\` |\n","fm":{"title":"iServer SQL 查询 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/network-analysis.md","pages/flows/network-analysis.md"],"related":["apis/iserver-feature-results.md"],"source":["frontend/src/components/NetworkAnalysis.vue"],"summary":"SuperMap iServer SQL 查询 REST API，用于查询矢量数据（如路网）"},"references":["pages/components/network-analysis","pages/flows/network-analysis"],"related":["pages/apis/iserver-feature-results"],"source":["frontend/src/components/NetworkAnalysis.vue"],"type":"api"},"pages/apis/rag-api":{"content":"\n# RAG 知识库 API\n\n## 1. 概述\n\nRAG（Retrieval-Augmented Generation）知识库 API，提供文档上传、向量检索和知识库管理能力。\n\n## 2. 接口列表\n\n### 2.1 上传文档\n\n\`\`\`\nPOST /api/rag/upload\n\`\`\`\n\n**请求**：\`multipart/form-data\`，支持 \`.md\` / \`.txt\` 文件\n\n**响应**：\n\n\`\`\`json\n{\n  \"success\": true,\n  \"message\": \"文档 xxx.md 已索引\",\n  \"char_count\": 1234\n}\n\`\`\`\n\n### 2.2 向量检索\n\n\`\`\`\nGET /api/rag/search?query=北京市医院&top_k=3\n\`\`\`\n\n**响应**：\n\n\`\`\`json\n{\n  \"success\": true,\n  \"query\": \"北京市医院\",\n  \"documents\": [{\"content\": \"...\", \"metadata\": {...}}],\n  \"count\": 3\n}\n\`\`\`\n\n### 2.3 获取已索引文档列表\n\n\`\`\`\nGET /api/rag/docs\n\`\`\`\n\n**响应**：\n\n\`\`\`json\n{\n  \"success\": true,\n  \"docs\": [\"doc1.md\", \"doc2.md\"],\n  \"ready\": true\n}\n\`\`\`\n\n## 3. 技术栈\n\n| 技术 | 用途 |\n|------|------|\n| FAISS | 向量存储 |\n| LangChain | RAG 框架 |\n| OpenAI Embedding | 向量化模型 |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| RAG API | \`agent-backend/app/api/rag.py\` |\n| RAG 服务 | \`agent-backend/app/services/rag_service.py\` |\n","fm":{"title":"RAG 知识库 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["apis/agent-api.md"],"source":["agent-backend/app/api/rag.py","agent-backend/app/services/rag_service.py"],"summary":"RAG 知识库 API，提供文档上传、向量检索和知识库管理"},"references":[],"related":["pages/apis/agent-api"],"source":["agent-backend/app/api/rag.py","agent-backend/app/services/rag_service.py"],"type":"api"},"pages/apis/supply-dispatch":{"content":"\n# 应急物资调度 API\n\n## 1. 概述\n\n应急物资调度总表 \`tb_supply_dispatch\` 的 REST API，提供完整的 CRUD 操作。\n\n## 2. 基础路径\n\n\`\`\`\n/api/supply-dispatch\n\`\`\`\n\n## 3. 接口列表\n\n| 方法 | 路径 | 说明 |\n|------|------|------|\n| GET | \`/api/supply-dispatch\` | 获取列表 |\n| GET | \`/api/supply-dispatch/{dispatchId}\` | 获取单条 |\n| POST | \`/api/supply-dispatch\` | 新增 |\n| PUT | \`/api/supply-dispatch/{dispatchId}\` | 更新 |\n| DELETE | \`/api/supply-dispatch/{dispatchId}\` | 删除 |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/SupplyDispatchController.java\` |\n| Service | \`backend/src/main/java/com/gis/emergency/service/SupplyDispatchService.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/SupplyDispatchMapper.java\` |\n| 实体类 | \`backend/src/main/java/com/gis/emergency/entity/SupplyDispatch.java\` |\n","fm":{"title":"应急物资调度 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/supply-dispatch-view.md","pages/entities/supply-dispatch.md"],"related":["pages/apis/coord-response.md","pages/apis/warn-info.md"],"source":["backend/src/main/java/com/gis/emergency/controller/SupplyDispatchController.java","backend/src/main/java/com/gis/emergency/entity/SupplyDispatch.java"],"summary":"应急物资调度总表 REST API，提供 CRUD 操作"},"references":["pages/views/supply-dispatch-view","pages/entities/supply-dispatch"],"related":["pages/apis/coord-response","pages/apis/warn-info"],"source":["backend/src/main/java/com/gis/emergency/controller/SupplyDispatchController.java","backend/src/main/java/com/gis/emergency/entity/SupplyDispatch.java"],"type":"api"},"pages/apis/warn-info":{"content":"\n# 气象灾害预警 API\n\n## 1. 概述\n\n气象灾害预警主表 \`tb_warn_info\` 的 REST API，提供完整的 CRUD 操作。\n\n## 2. 基础路径\n\n\`\`\`\n/api/warn-info\n\`\`\`\n\n## 3. 接口列表\n\n| 方法 | 路径 | 说明 |\n|------|------|------|\n| GET | \`/api/warn-info\` | 获取列表 |\n| GET | \`/api/warn-info/{warnId}\` | 获取单条 |\n| POST | \`/api/warn-info\` | 新增 |\n| PUT | \`/api/warn-info/{warnId}\` | 更新 |\n| DELETE | \`/api/warn-info/{warnId}\` | 删除 |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/WarnInfoController.java\` |\n| Service | \`backend/src/main/java/com/gis/emergency/service/WarnInfoService.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/WarnInfoMapper.java\` |\n| 实体类 | \`backend/src/main/java/com/gis/emergency/entity/WarnInfo.java\` |\n","fm":{"title":"气象灾害预警 API","type":"api","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/warn-info-view.md","pages/entities/warn-info.md"],"related":["pages/apis/coord-response.md","pages/apis/supply-dispatch.md"],"source":["backend/src/main/java/com/gis/emergency/controller/WarnInfoController.java","backend/src/main/java/com/gis/emergency/entity/WarnInfo.java"],"summary":"气象灾害预警主表 REST API，提供 CRUD 操作"},"references":["pages/views/warn-info-view","pages/entities/warn-info"],"related":["pages/apis/coord-response","pages/apis/supply-dispatch"],"source":["backend/src/main/java/com/gis/emergency/controller/WarnInfoController.java","backend/src/main/java/com/gis/emergency/entity/WarnInfo.java"],"type":"api"},"pages/components/agent-chat-message":{"content":"\n# 聊天消息 ChatMessage\n\n## 1. 组件概述\n\n单条对话消息组件，用户消息靠右（蓝色气泡），AI 消息靠左（灰色气泡）。AI 消息内可嵌入工具调用卡片，多智能体模式下按 step 分组展示。\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`message\` | \`Object\` | 消息对象 \`{id, role, content, toolCalls, isStreaming}\` |\n\n## 3. 功能\n\n- AI 头像 + 灰色气泡\n- 用户头像 + 蓝色气泡\n- AI 消息 Markdown 渲染\n- 流式文本光标\n- 工具调用卡片嵌入（按 step 分组）\n- 时间戳显示\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 聊天消息 | \`frontend/src/components/agent/ChatMessage.vue\` |\n","fm":{"title":"聊天消息 ChatMessage","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/agent-tool-call-card.md"],"related":["pages/components/agent-tool-call-card.md"],"source":["frontend/src/components/agent/ChatMessage.vue"],"summary":"单条对话消息组件，用户消息靠右蓝色气泡，AI 消息靠左灰色气泡"},"references":["pages/components/agent-tool-call-card"],"related":["pages/components/agent-tool-call-card"],"source":["frontend/src/components/agent/ChatMessage.vue"],"type":"component"},"pages/components/agent-chat-panel":{"content":"\n# Agent 聊天面板 AgentChatPanel\n\n## 1. 组件概述\n\nAI Agent 应急助手聊天面板，支持多智能体协同工作流，包括：\n- 悬浮按钮展开/收起\n- 多智能体进度条（意图 → 计划 → 步骤）\n- 消息列表（用户 + AI）\n- 工具调用卡片\n\n## 2. 功能\n\n### 2.1 多智能体工作流\n\n显示当前执行的步骤进度：\`第 N / M 步\`，每个步骤按子 Agent 类型着色。\n\n### 2.2 消息交互\n\n- 欢迎状态 + 快捷操作\n- 流式文本渲染\n- 工具调用卡片展示\n\n## 3. 事件\n\n| 事件 | 说明 |\n|------|------|\n| \`send\` | 发送消息 |\n| \`stop\` | 停止生成 |\n| \`clear\` | 清空对话 |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 聊天面板 | \`frontend/src/components/AgentChatPanel.vue\` |\n","fm":{"title":"Agent 聊天面板 AgentChatPanel","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/agent-chat-message.md","pages/components/agent-tool-call-card.md"],"related":["pages/components/sm-map-viewer.md"],"source":["frontend/src/components/AgentChatPanel.vue"],"summary":"AI Agent 应急助手聊天面板，支持多智能体协同工作流"},"references":["pages/components/agent-chat-message","pages/components/agent-tool-call-card"],"related":["pages/components/sm-map-viewer"],"source":["frontend/src/components/AgentChatPanel.vue"],"type":"component"},"pages/components/agent-coordinator":{"content":"\n# 多智能体协调器 Coordinator\n\n## 1. 模块定位\n\n**Agent 空间问答模块是系统的核心创新模块**，采用大语言模型与多智能体协同架构，通过自然语言交互替代传统 GIS 工具栏操作，实现\"一句话完成 GIS 应急分析\"。\n\n用户输入自然语言（如\"查询北京市朝阳区附近的医院\"），Coordinator 自动完成意图识别→任务规划→工具调用→结果汇总，生成结构化报告并标绘到地图。\n\n## 2. 三层架构\n\n### 2.1 语义理解层\n\n基于 DeepSeek LLM 实现：\n- **六类意图分类**：\`search\`（检索）、\`analysis\`（分析）、\`route\`（路径）、\`knowledge\`（知识）、\`mixed\`（综合）、\`chat\`（闲聊）\n- **实体抽取**：自动识别地名、灾害类型、半径、数据集等关键参数\n\n### 2.2 任务执行层\n\nReAct 循环驱动单 Agent 模式：\n- LLM 推理 → 选择工具 → 执行工具 → 观察结果 → 下一步推理\n- 适用于简单任务（单一检索或分析）\n\n### 2.3 协同调度层\n\nCoordinator 将复杂应急任务拆解为多步，分配专业化子 Agent 顺序执行：\n\n\`\`\`\n用户输入 → 意图分类 → 任务规划 → [SearchAgent, AnalysisAgent, RouteAgent, KnowledgeAgent] → 结果汇总\n\`\`\`\n\n## 3. 主流程\n\n\`\`\`python\nasync def stream_coordinator_events(user_message, session_id):\n    yield {\"event\": \"agent_start\", ...}\n    \n    # 阶段 1: 闲聊检测（首字延迟优化）\n    if _is_trivial_chat(user_message):\n        async for event in _chat_respond(...):\n            yield event\n        return\n    \n    # 阶段 2: 意图分类\n    intent_result = await classify_intent(user_message)\n    yield {\"event\": \"intent_classified\", ...}\n    \n    # 阶段 3: 闲聊直接回答\n    if intent_result.intent == \"chat\":\n        async for event in _chat_respond(...):\n            yield event\n        return\n    \n    # 阶段 4: 任务规划（考虑会话历史）\n    plan = await plan_tasks(user_message, intent_result, history)\n    yield {\"event\": \"plan_created\", ...}\n    \n    # 阶段 5: 逐步执行子 Agent（支持历史上下文传递）\n    for step in plan.tasks:\n        yield {\"event\": \"step_start\", ...}\n        result = await execute_sub_agent(step, history, session_id)\n        yield {\"event\": \"step_done\", ...}\n    \n    # 阶段 6: 结果汇总（流式输出）\n    async for event in astream_summarize_results(...):\n        yield event\n    \n    yield {\"event\": \"agent_end\", ...}\n\`\`\`\n\n## 4. SSE 事件类型\n\n| 事件 | 说明 |\n|------|------|\n| \`agent_start\` | 协调者开始执行 |\n| \`intent_classified\` | 意图分类完成（含实体） |\n| \`plan_created\` | 任务规划完成（步骤列表） |\n| \`step_start\` | 某步开始 |\n| \`tool_start\` | 工具开始调用 |\n| \`tool_result\` | 工具执行完成 |\n| \`step_done\` | 某步完成 |\n| \`text\` | 流式文本 token |\n| \`agent_end\` | 全部完成 |\n| \`error\` | 出错 |\n\n## 5. 工程创新\n\n### 5.1 双轨制调度策略\n\nCoordinator 不依赖 LangGraph StateGraph 编译，改用 async function 顺序调度：\n- **优势**：流式 SSE 输出更自然、调试更方便、错误隔离更清晰\n- **状态**：用本地变量维护，每个阶段 yield SSE 事件\n\n### 5.2 退化 Polygon 兜底机制\n\nLLM 生成的退化 Polygon（所有点坐标相同）会导致空间查询失效：\n- **问题根因**：DeepSeek-V3.2 即使在 prompt 强调下仍 ~75% 概率构造退化 Polygon\n- **解决方案**：工具层自动检测并替换为 inner Polygon（受灾圈），确保查询不失效\n\n### 5.3 灾害类型-半径映射表\n\n| 灾害类型 | 内圈半径 | 外圈半径 |\n|---------|---------|---------|\n| 地震 | 3000m | 8000m |\n| 火灾 | 1000m | 3000m |\n| 洪水 | 2000m | 5000m |\n\nLLM 漏传半径参数时自动兜底，确保应急分析准确。\n\n### 5.4 RAG 知识增强检索\n\n针对应急知识（救援方案、处置流程、预案内容），通过 RAG 检索增强 LLM 回答的专业性。\n\n### 5.5 Pareto 多目标资源优选\n\n当有 2 个以上资源点需要在距离和容量间权衡时，使用 Pareto 前沿算法求解最优解集，避免 LLM 不可靠的数学推理。\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 协调器 | \`agent-backend/app/agent/coordinator.py\` |\n| 意图分类节点 | \`agent-backend/app/agent/nodes/intent.py\` |\n| 任务规划节点 | \`agent-backend/app/agent/nodes/planner.py\` |\n| 结果汇总节点 | \`agent-backend/app/agent/nodes/summarize.py\` |\n| 子 Agent 定义 | \`agent-backend/app/agent/sub_agents/agents.py\` |\n| 状态定义 | \`agent-backend/app/agent/state.py\` |\n","fm":{"title":"多智能体协调器 Coordinator","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/agent-store","pages/components/agent-intent","pages/components/agent-planner","pages/components/agent-summarize"],"related":["components/fastapi-main.md","concepts/multi-agent.md","tools/gis-tools.md"],"source":["agent-backend/app/agent/coordinator.py","agent-backend/app/agent/nodes/intent.py","agent-backend/app/agent/nodes/planner.py","agent-backend/app/agent/nodes/summarize.py"],"summary":"Agent 空间问答核心，多智能体协同调度器，驱动意图分类→任务规划→子Agent执行→结果汇总全流程"},"references":["pages/components/agent-store","pages/components/agent-intent","pages/components/agent-planner","pages/components/agent-summarize"],"related":["pages/components/fastapi-main","pages/concepts/multi-agent"],"source":["agent-backend/app/agent/coordinator.py","agent-backend/app/agent/nodes/intent.py","agent-backend/app/agent/nodes/planner.py","agent-backend/app/agent/nodes/summarize.py"],"type":"component"},"pages/components/agent-graph":{"content":"\n# Agent 核心逻辑 graph\n\n## 1. 概述\n\nAgent 核心逻辑，单点封装 Agent 构造，隔离版本差异。P0 阶段：单 Agent + 多 Tool；P1 阶段升级为多智能体。\n\n## 2. 系统提示词\n\nAgent 的系统提示词定义了：\n- 职责：理解用户需求、选择 GIS 工具、反馈结果\n- 可用工具列表及使用规则\n- 回答风格：简洁专业、应急场景果断清晰\n\n## 3. 工具列表\n\n### 3.1 GIS 工具\n\n| 工具 | 说明 |\n|------|------|\n| \`feature_search\` | 专题检索 |\n| \`spatial_query\` | 空间查询 |\n| \`buffer_analysis\` | 缓冲区分析 |\n| \`dual_buffer_analysis\` | 双缓冲区分析 |\n| \`overlay_analysis\` | 叠置分析 |\n| \`shortest_path\` | 最短路径分析 |\n| \`service_area\` | 服务区分析 |\n| \`online_route_planning\` | 在线路径规划 |\n| \`mock_nearby_resources\` | 模拟周边资源点 |\n| \`fly_to_location\` | 地图定位 |\n\n### 3.2 RAG 工具\n\n| 工具 | 说明 |\n|------|------|\n| \`rag_retrieval\` | 知识检索 |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Agent 核心逻辑 | \`agent-backend/app/agent/graph.py\` |\n| 子 Agent 定义 | \`agent-backend/app/agent/sub_agents/agents.py\` |\n| GIS 工具 | \`agent-backend/app/tools/gis_tools.py\` |\n| RAG 工具 | \`agent-backend/app/tools/rag_tools.py\` |\n","fm":{"title":"Agent 核心逻辑 graph","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["components/agent-coordinator.md","components/agent-sub-agents.md"],"related":["apis/agent-api.md"],"source":["agent-backend/app/agent/graph.py"],"summary":"Agent 核心逻辑，单点封装 Agent 构造，隔离版本差异"},"references":["pages/components/agent-coordinator","pages/components/agent-sub-agents"],"related":["pages/apis/agent-api"],"source":["agent-backend/app/agent/graph.py"],"type":"component"},"pages/components/agent-intent":{"content":"\n# 意图分类节点 intent\n\n## 1. 定位\n\n语义理解层核心组件，基于 DeepSeek LLM 实现自然语言意图识别与实体抽取，是 Coordinator 调度流程的第二阶段。\n\n## 2. 意图类型（6 类）\n\n| 意图 | 说明 | 典型输入 |\n|------|------|---------|\n| \`search\` | 地理要素检索 | \"查找北京市朝阳区附近的医院\" |\n| \`analysis\` | 空间分析 | \"分析某区域洪水影响范围\" |\n| \`route\` | 路径规划 | \"从 A 到 B 怎么走\" |\n| \`knowledge\` | 应急知识查询 | \"地震救援流程是什么\" |\n| \`mixed\` | 综合任务 | \"查询周边医院并规划救援路线\" |\n| \`chat\` | 闲聊 | \"你好\" |\n\n## 3. 实体抽取\n\n自动从用户输入提取关键实体：\n\n| 实体 | 说明 | 示例 |\n|------|------|------|\n| \`location\` | 地名实体 | \"北京市朝阳区\"、\"南湖公园\" |\n| \`disaster\` | 灾害类型 | \"地震\"、\"洪水\"、\"火灾\" |\n| \`radius\` | 半径参数 | \"周边 500 米\"、\"3 公里内\" |\n| \`dataset\` | 数据集类型 | \"医院\"、\"道路\"、\"河流\" |\n| \`level\` | 行政级别 | \"省级\"、\"县级\"、\"乡镇\" |\n| \`region\` | 搜索区域 | \"jingjin\"、\"changchun\"、\"auto\" |\n\n## 4. Schema 校验\n\n使用 Pydantic 强约束 Schema，DeepSeek-V3.2 返回不合规时自动重试（最多 3 次）。\n\n\`\`\`python\nclass IntentResult(BaseModel):\n    intent: Literal[\"search\", \"analysis\", \"route\", \"knowledge\", \"mixed\", \"chat\"]\n    entities: dict\n    reasoning: str\n\`\`\`\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 意图分类节点 | \`agent-backend/app/agent/nodes/intent.py\` |\n","fm":{"title":"意图分类节点 intent","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["components/agent-coordinator.md","pages/components/agent-store"],"source":["agent-backend/app/agent/nodes/intent.py"],"summary":"语义理解层核心，基于 LLM 实现六类意图分类与实体抽取"},"references":["pages/components/agent-coordinator","pages/components/agent-store"],"related":[],"source":["agent-backend/app/agent/nodes/intent.py"],"type":"component"},"pages/components/agent-planner":{"content":"\n# 任务规划节点 planner\n\n## 1. 定位\n\n协同调度层核心组件，接收意图分类结果，将复杂应急任务拆解为可执行的子任务序列，分配给专业化子 Agent 顺序执行。\n\n## 2. 任务拆解策略\n\n### 2.1 单步任务（简单意图）\n\n单一工具即可完成，如：\n- \"查询北京市附近的医院\" → 1 步 SearchAgent\n\n### 2.2 多步任务（复合意图）\n\n需要多步协作完成，如：\n- \"查询北京市附近的医院并规划救援路线\" → 2 步 SearchAgent + RouteAgent\n- \"分析洪水影响范围并查询周边避难所\" → 3 步（定位 → 缓冲区分析 → 查询避难所）\n\n### 2.3 应急任务模板\n\n针对标准化应急流程，内置任务模板：\n- 双缓冲区应急流程：7 步（定位 → 缓冲区分析 → 查询受灾点资源 → 查询支援点资源 → 路径规划 → 资源优选 → 生成报告）\n\n## 3. Schema 校验\n\n\`\`\`python\nclass TaskStep(BaseModel):\n    step: int                              # 步骤序号\n    agent_type: Literal[\"search\", \"analysis\", \"route\", \"knowledge\"]  # 子 Agent 类型\n    description: str                       # 任务描述\n    tool_hint: str                         # 建议工具\n\nclass TaskPlan(BaseModel):\n    tasks: list[TaskStep]\n    summary: str\n\`\`\`\n\n## 4. 历史上下文\n\n- 支持多轮对话：后续任务可引用前序步骤结果\n- 自动传递坐标、缓冲区几何等中间产物\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 任务规划节点 | \`agent-backend/app/agent/nodes/planner.py\` |\n","fm":{"title":"任务规划节点 planner","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["components/agent-coordinator.md","pages/components/agent-store","components/agent-sub-agents.md"],"source":["agent-backend/app/agent/nodes/planner.py"],"summary":"协同调度层核心，将复杂任务拆解为可执行的子任务序列，分配专业化子 Agent"},"references":["pages/components/agent-coordinator","pages/components/agent-store","pages/components/agent-sub-agents"],"related":[],"source":["agent-backend/app/agent/nodes/planner.py"],"type":"component"},"pages/components/agent-store":{"content":"\n# Agent 状态管理 AgentStore\n\n## 1. 概述\n\nPinia Store，管理 AI Agent 的对话消息列表、加载状态、面板展开状态，以及多智能体协同的意图分类、任务规划、步骤执行状态。\n\n## 2. 状态定义\n\n### 2.1 对话状态\n\n| 状态 | 类型 | 说明 |\n|------|------|------|\n| \`messages\` | \`Ref<Array>\` | 对话消息列表 |\n| \`isLoading\` | \`Ref<boolean>\` | 是否正在等待 AI 回复 |\n| \`isPanelOpen\` | \`Ref<boolean>\` | Agent 面板是否展开 |\n\n### 2.2 多智能体工作流状态\n\n| 状态 | 类型 | 说明 |\n|------|------|------|\n| \`currentIntent\` | \`Ref<string>\` | 当前意图（search/analysis/route/knowledge/mixed/chat） |\n| \`currentEntities\` | \`Ref<Object>\` | 意图关联的实体 |\n| \`currentPlan\` | \`Ref<Object\\|null>\` | 任务计划 { tasks, summary, totalSteps } |\n| \`currentStep\` | \`Ref<number>\` | 当前执行步号（从 1 开始） |\n| \`totalSteps\` | \`Ref<number>\` | 总步数 |\n| \`steps\` | \`Ref<Array>\` | 各步状态 [{ step, agentType, description, status, summary }] |\n\n## 3. 枚举映射\n\n### 3.1 子 Agent 类型\n\n\`\`\`js\nexport const AGENT_TYPE_LABEL = {\n  search: '检索专家',\n  analysis: '分析专家',\n  route: '路径专家',\n  knowledge: '知识专家',\n}\n\`\`\`\n\n### 3.2 意图类型\n\n\`\`\`js\nexport const INTENT_LABEL = {\n  search: '专题检索',\n  analysis: '空间分析',\n  route: '路径规划',\n  knowledge: '知识检索',\n  mixed: '综合应急',\n  chat: '智能问答',\n}\n\`\`\`\n\n## 4. 方法\n\n### 4.1 对话方法\n\n| 方法 | 说明 |\n|------|------|\n| \`addMessage(partial)\` | 新增消息，返回消息 id |\n| \`updateMessage(id, patch)\` | 按 id 更新消息字段 |\n| \`clearMessages()\` | 清空全部消息 |\n| \`setLoading(status)\` | 设置加载状态 |\n| \`togglePanel()\` | 切换面板展开/收起 |\n| \`addToolCall(messageId, toolCall)\` | 添加工具调用记录 |\n| \`updateToolCall(messageId, index, patch)\` | 更新工具调用字段 |\n\n### 4.2 多智能体方法\n\n| 方法 | 说明 |\n|------|------|\n| \`setIntent(intent, entities)\` | 设置意图分类结果 |\n| \`setPlan(tasks, summary)\` | 设置任务计划 |\n| \`startStep(step, total, agentType, description)\` | 标记步骤开始 |\n| \`finishStep(step, success, summary)\` | 标记步骤完成 |\n| \`resetWorkflow()\` | 重置工作流（发送新消息前调用） |\n\n## 5. 使用方式\n\n\`\`\`js\nimport { useAgentStore, INTENT_LABEL } from '@/stores/agent'\n\nconst agentStore = useAgentStore()\n\n// 监听意图变化\nwatch(() => agentStore.currentIntent, (intent) => {\n  if (intent) {\n    console.log('当前意图:', INTENT_LABEL[intent])\n  }\n})\n\n// 监听步骤进度\nwatch(() => agentStore.currentStep, (step) => {\n  console.log(\`进度: \${step}/\${agentStore.totalSteps}\`)\n})\n\`\`\`\n\n## 6. 关联组件\n\n- \`AgentChatPanel\` - 主容器，调用 \`addMessage/setLoading\`\n- \`AgentChatMessage\` - 渲染消息列表\n- \`AgentToolCallCard\` - 渲染工具调用卡片\n- \`HomeView\` - SSE 事件驱动状态更新\n\n## 7. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Agent 状态 | \`frontend/src/stores/agent.js\` |\n","fm":{"title":"Agent 状态管理 AgentStore","type":"component","tech":"store","status":"stable","created":"2026-07-14","updated":"2026-07-14","tags":[],"references":["pages/components/agent-chat-panel.md","pages/components/agent-chat-message.md","pages/components/agent-tool-call-card.md","pages/views/home-view.md"],"related":["pages/components/agent-chat-panel.md","pages/concepts/multi-agent.md"],"source":["frontend/src/stores/agent.js"],"summary":"Pinia Agent 状态管理，管理对话消息、多智能体工作流状态（意图/计划/步骤）"},"references":["pages/components/agent-chat-panel","pages/components/agent-chat-message","pages/components/agent-tool-call-card","pages/views/home-view"],"related":["pages/components/agent-chat-panel","pages/concepts/multi-agent"],"source":["frontend/src/stores/agent.js"],"type":"component"},"pages/components/agent-sub-agents":{"content":"\n# 子 Agent 定义与执行\n\n## 1. 概述\n\n4 个专业子 Agent，每个用 \`create_react_agent\` 创建，有独立的工具集和系统提示词。\n\n## 2. 子 Agent 类型\n\n### 2.1 SearchAgent（检索专家）\n\n**职责**：地理要素检索和空间查询\n\n**可用工具**：\n- \`feature_search\`：按关键字搜索地理要素\n- \`spatial_query\`：在指定几何范围内查询地物\n- \`fly_to_location\`：按地名定位地图\n- \`mock_nearby_resources\`：生成模拟资源点\n\n### 2.2 AnalysisAgent（空间分析专家）\n\n**职责**：缓冲区分析和叠置分析\n\n**可用工具**：\n- \`buffer_analysis\`：对几何对象做缓冲区分析\n- \`dual_buffer_analysis\`：双层缓冲区分析（应急分级响应专用）\n- \`overlay_analysis\`：对两个数据集做叠置分析\n\n### 2.3 RouteAgent（路径专家）\n\n**职责**：最短路径、服务区分析和资源调度优化\n\n**可用工具**：\n- \`shortest_path\`：在长春路网中计算多点间最短路径\n- \`service_area\`：分析中心点可达范围\n- \`online_route_planning\`：在线路径规划（OSRM）\n- \`pareto_resource_optimize\`：Pareto 多目标资源优选\n- \`aco_multi_vehicle_route\`：ACO 蚁群多车路径分配\n\n### 2.4 KnowledgeAgent（知识专家）\n\n**职责**：回答 GIS 知识问题\n\n**可用工具**：\n- \`rag_retrieval\`：从应急救援知识库中检索\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 子 Agent 定义 | \`agent-backend/app/agent/sub_agents/agents.py\` |\n","fm":{"title":"子 Agent 定义与执行","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["components/agent-coordinator.md","tools/gis-tools.md"],"related":["apis/agent-api.md"],"source":["agent-backend/app/agent/sub_agents/agents.py"],"summary":"4 个专业子 Agent：SearchAgent / AnalysisAgent / RouteAgent / KnowledgeAgent"},"references":["pages/components/agent-coordinator"],"related":["pages/apis/agent-api"],"source":["agent-backend/app/agent/sub_agents/agents.py"],"type":"component"},"pages/components/agent-summarize":{"content":"\n# 结果汇总节点 summarize\n\n## 1. 定位\n\n结果汇总节点是 Coordinator 调度流程的最后一个阶段，接收所有子 Agent 执行结果，流式生成结构化应急报告并推送给前端。\n\n## 2. 汇总流程\n\n\`\`\`\n子 Agent 执行结果 → 结果分类（成功/失败）→ 生成报告摘要 → 流式推送\n\`\`\`\n\n### 2.1 流式输出\n\n\`\`\`python\nasync for event in astream_summarize_results(user_message, step_results, history):\n    yield event  # text 事件，逐 token 推送\n\`\`\`\n\n- 使用 \`astream_summarize_results\` 异步流式生成\n- 前端 SSE 实时显示，用户体验流畅\n\n### 2.2 报告结构\n\n- **成功要点总结**：关键操作结果（找到的要素数量、缓冲区面积、路径长度等）\n- **模拟数据标注**：明确告知哪些数据为模拟生成\n- **下一步建议**：基于当前结果推荐后续操作（如\"是否需要路径规划？\"）\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 结果汇总节点 | \`agent-backend/app/agent/nodes/summarize.py\` |\n","fm":{"title":"结果汇总节点 summarize","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["components/agent-coordinator.md","components/agent-sub-agents.md"],"source":["agent-backend/app/agent/nodes/summarize.py"],"summary":"流式汇总子 Agent 执行结果，生成结构化应急报告并推送给前端"},"references":["pages/components/agent-coordinator","pages/components/agent-sub-agents"],"related":[],"source":["agent-backend/app/agent/nodes/summarize.py"],"type":"component"},"pages/components/agent-tool-call-card":{"content":"\n# 工具调用卡片 ToolCallCard\n\n## 1. 组件概述\n\n工具调用卡片组件，在 AI 消息气泡内展示一次工具调用的状态与结果。\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`toolCall\` | \`Object\` | \`{toolName, status, input, result, error}\` |\n\n## 3. 功能\n\n- 状态图标：loading（旋转）/ done（绿色对勾）/ error（红色叉）\n- 工具名称 + 状态文本\n- 结果摘要 / 错误信息\n- 可展开的输入参数和执行详情\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 工具调用卡片 | \`frontend/src/components/agent/ToolCallCard.vue\` |\n","fm":{"title":"工具调用卡片 ToolCallCard","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/components/agent-chat-panel.md"],"source":["frontend/src/components/agent/ToolCallCard.vue"],"summary":"工具调用卡片组件，展示工具调用的状态、结果和参数"},"references":[],"related":["pages/components/agent-chat-panel"],"source":["frontend/src/components/agent/ToolCallCard.vue"],"type":"component"},"pages/components/coord-response-service":{"content":"\n# 协同叫应服务 CoordResponseService\n\n## 1. 定位\n\n协同叫应业务服务层，对接 \`tb_coord_response\` 数据表的基础 CRUD 操作，象征性表示系统已连接后端数据库。\n\n## 2. 功能\n\n- 协同叫应处置记录的增删改查\n- 基础数据校验（非空、格式合法性）\n- 状态流转（未接通 → 已应答 → 已处置）\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Service | \`backend/src/main/java/com/gis/emergency/service/CoordResponseService.java\` |\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/CoordResponseController.java\` |\n| Entity | \`backend/src/main/java/com/gis/emergency/entity/CoordResponse.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/CoordResponseMapper.java\` |\n","fm":{"title":"协同叫应服务 CoordResponseService","type":"component","tech":"java","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["apis/coord-response.md","entities/coord-response.md"],"source":["backend/src/main/java/com/gis/emergency/service/CoordResponseService.java"],"summary":"协同叫应业务服务层，对接 tb_coord_response 数据表的基础 CRUD 操作"},"references":["pages/apis/coord-response","pages/entities/coord-response"],"related":[],"source":["backend/src/main/java/com/gis/emergency/service/CoordResponseService.java"],"type":"component"},"pages/components/dashboard-buffer-analysis-modal":{"content":"\n# dashboard\\ Buffer Analysis Modal\n\n> 状态：draft — 待补充内容\n\n## 基本信息\n\n（待补充）\n\n## 关联\n\n（待补充）\n","fm":{"title":"dashboard\\ Buffer Analysis Modal","type":"component","status":"draft","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":[],"source":["frontend/src/components/dashboard/BufferAnalysisModal.vue"],"summary":"（待补充）"},"references":[],"related":[],"source":["frontend/src/components/dashboard/BufferAnalysisModal.vue"],"type":"component"},"pages/components/dashboard-dashboard-map":{"content":"\n# 仪表盘地图 DashboardMap\n\n## 1. 组件概述\n\n数据大屏分级地图交互组件，使用 \`COUNTY_COORDS\` 点标记 + 灾害等级着色，不依赖 iServer。\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`map\` | \`Object\` | MapboxGL 地图实例 |\n| \`disasterData\` | \`Object\` | 各县灾害数据 |\n\n## 3. 灾害等级颜色\n\n| 等级 | 颜色 |\n|------|------|\n| 1（特别重大） | #e53e3e 红 |\n| 2（重大） | #dd6b20 橙 |\n| 3（较大） | #d69e2e 黄 |\n| 4（一般） | #38a169 绿 |\n\n## 4. 事件\n\n| 事件 | 说明 |\n|------|------|\n| \`select-county\` | 选中县 |\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 仪表盘地图 | \`frontend/src/components/dashboard/DashboardMap.vue\` |\n| 模拟数据 | \`frontend/src/utils/mockData.js\` |\n","fm":{"title":"仪表盘地图 DashboardMap","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/data-dashboard-view.md"],"related":["pages/components/dashboard-buffer-analysis-modal.md","pages/components/dashboard-disaster-detail-panel.md"],"source":["frontend/src/components/dashboard/DashboardMap.vue","frontend/src/utils/mockData.js"],"summary":"数据大屏分级地图交互组件，渲染县级灾害等级点标记"},"references":["pages/views/data-dashboard-view"],"related":["pages/components/dashboard-buffer-analysis-modal","pages/components/dashboard-disaster-detail-panel"],"source":["frontend/src/components/dashboard/DashboardMap.vue","frontend/src/utils/mockData.js"],"type":"component"},"pages/components/dashboard-disaster-detail-panel":{"content":"\n# 灾害详情面板 DisasterDetailPanel\n\n## 1. 组件概述\n\n灾情评估详情面板，提供 8 项灾情指标录入和 DDI 综合评估，支持重新评估。\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`selectedCounty\` | \`String\` | 选中的县 |\n| \`disasterData\` | \`Object\` | 灾害数据 |\n| \`supportPoints\` | \`Array\` | 支援点数组 |\n| \`disasterCenter\` | \`Array\` | 受灾点坐标 |\n\n## 3. 功能\n\n### 3.1 灾情信息概览\n\n- 灾害类型、初始等级、初始 DDI\n\n### 3.2 8 项指标录入\n\n分组录入灾情指标，支持 \`a-input-number\` 输入。\n\n### 3.3 重新评估\n\n根据录入的指标重新计算 DDI 和灾害等级。\n\n## 4. 事件\n\n| 事件 | 说明 |\n|------|------|\n| \`reassess\` | 重新评估 |\n| \`start-rescue\` | 启动救援 |\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 灾害详情面板 | \`frontend/src/components/dashboard/DisasterDetailPanel.vue\` |\n","fm":{"title":"灾害详情面板 DisasterDetailPanel","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/data-dashboard-view.md","pages/components/dashboard-buffer-analysis-modal.md"],"related":["pages/components/dashboard-dashboard-map.md","pages/components/dashboard-weather-panel.md"],"source":["frontend/src/components/dashboard/DisasterDetailPanel.vue"],"summary":"灾情评估详情面板，提供 8 项灾情指标录入和 DDI 综合评估"},"references":["pages/views/data-dashboard-view","pages/components/dashboard-buffer-analysis-modal"],"related":["pages/components/dashboard-dashboard-map","pages/components/dashboard-weather-panel"],"source":["frontend/src/components/dashboard/DisasterDetailPanel.vue"],"type":"component"},"pages/components/dashboard-route-planning-modal":{"content":"\n# 路线规划弹窗 RoutePlanningModal\n\n## 1. 组件概述\n\n5 步救援调度弹窗，集成 \`RescueDispatchPanel\` 组件，实现地震救援的顺序调度流程。\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`visible\` | \`Boolean\` | 弹窗显隐 |\n| \`map\` | \`Object\` | MapboxGL 地图实例 |\n| \`disasterData\` | \`Object\` | 灾情数据 |\n| \`supportPoints\` | \`Array\` | 支援点数组 |\n| \`disasterCenter\` | \`Array\` | 受灾点坐标 |\n\n## 3. 功能\n\n- 弹窗打开时自动聚焦视角到受灾点（zoom=13）\n- 自动启动 5 步调度\n- 调度中按钮 disabled\n- 组件卸载时清理所有定时器\n\n## 4. 事件\n\n| 事件 | 说明 |\n|------|------|\n| \`update:visible\` | 弹窗显隐变化 |\n| \`dispatch-complete\` | 调度完成 |\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 路线规划弹窗 | \`frontend/src/components/dashboard/RoutePlanningModal.vue\` |\n| 救援调度面板 | \`frontend/src/components/earthquake/RescueDispatchPanel.vue\` |\n","fm":{"title":"路线规划弹窗 RoutePlanningModal","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/data-dashboard-view.md","pages/components/earthquake-rescue-dispatch-panel.md"],"related":["pages/components/dashboard-buffer-analysis-modal.md","pages/flows/buffer-analysis.md"],"source":["frontend/src/components/dashboard/RoutePlanningModal.vue"],"summary":"5 步救援调度弹窗，集成 RescueDispatchPanel 组件"},"references":["pages/views/data-dashboard-view","pages/components/earthquake-rescue-dispatch-panel"],"related":["pages/components/dashboard-buffer-analysis-modal","pages/flows/buffer-analysis"],"source":["frontend/src/components/dashboard/RoutePlanningModal.vue"],"type":"component"},"pages/components/dashboard-weather-panel":{"content":"\n# 天气面板 WeatherPanel\n\n## 1. 组件概述\n\n气象灾害监控面板，展示气象数据表格和风险等级，支持超阈值标红警示。\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`weatherData\` | \`Array\` | 气象数据数组 |\n\n## 3. 功能\n\n- 气象数据表格展示\n- 风险等级标签着色\n- 超阈值标红警示：\n  - 降雨量 > 100mm\n  - 风力 ≥ 10 级\n  - 地震烈度 ≥ 5\n- 天气预报展开查看\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 天气面板 | \`frontend/src/components/dashboard/WeatherPanel.vue\` |\n","fm":{"title":"天气面板 WeatherPanel","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/data-dashboard-view.md"],"related":["pages/components/dashboard-disaster-detail-panel.md"],"source":["frontend/src/components/dashboard/WeatherPanel.vue"],"summary":"气象灾害监控面板，展示气象数据表格和风险等级"},"references":["pages/views/data-dashboard-view"],"related":["pages/components/dashboard-disaster-detail-panel"],"source":["frontend/src/components/dashboard/WeatherPanel.vue"],"type":"component"},"pages/components/earthquake-buffer-zone-layer":{"content":"\n# 地震缓冲区图层 BufferZoneLayer\n\n## 1. 组件概述\n\n双缓冲区图层组件，在 MapboxGL 地图上渲染两个同心圆 Polygon：\n- **外圈**（橙色）：应急支援范围\n- **内圈**（红色）：灾害影响范围\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`map\` | \`Object\` | MapboxGL 地图实例 |\n| \`center\` | \`Array\` | 受灾点坐标 \`[lng, lat]\` |\n| \`bufferConfig\` | \`Object\` | \`{inner, outer, innerColor, outerColor, name}\` |\n\n## 3. 功能\n\n- 外圈 Polygon（先添加，下层）\n- 内圈 Polygon（后添加，上层）\n- 鼠标悬停 tooltip\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 缓冲区图层 | \`frontend/src/components/earthquake/BufferZoneLayer.vue\` |\n| 圆形多边形工具 | \`frontend/src/utils/circlePolygon.js\` |\n","fm":{"title":"地震缓冲区图层 BufferZoneLayer","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/dashboard-buffer-analysis-modal.md","pages/views/data-dashboard-view.md"],"related":["pages/components/earthquake-support-point-layer.md","pages/components/earthquake-rescue-dispatch-panel.md","pages/flows/buffer-analysis.md"],"source":["frontend/src/components/earthquake/BufferZoneLayer.vue","frontend/src/utils/circlePolygon.js"],"summary":"双缓冲区图层组件，渲染内/外两个同心圆 Polygon"},"references":["pages/components/dashboard-buffer-analysis-modal","pages/views/data-dashboard-view"],"related":["pages/components/earthquake-support-point-layer","pages/components/earthquake-rescue-dispatch-panel","pages/flows/buffer-analysis"],"source":["frontend/src/components/earthquake/BufferZoneLayer.vue","frontend/src/utils/circlePolygon.js"],"type":"component"},"pages/components/earthquake-rescue-dispatch-panel":{"content":"\n# 救援调度面板 RescueDispatchPanel\n\n## 1. 组件概述\n\n5 步救援调度面板，实现地震救援的顺序调度流程：\n\n| 步骤 | 操作 | 路径颜色 |\n|------|------|---------|\n| Step 1 | 应急指令下达 | 无路径 |\n| Step 2 | 消防搜救 | 红色 #e53e3e |\n| Step 3 | 医疗救治 | 粉色 #d53f8c |\n| Step 4 | 物资调拨 | 橙色 #dd6b20 |\n| Step 5 | 人员安置 | 绿色 #38a169 |\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`map\` | \`Object\` | MapboxGL 地图实例 |\n| \`disasterData\` | \`Object\` | 灾情数据 |\n| \`supportPoints\` | \`Array\` | 支援点数组 |\n| \`disasterCenter\` | \`Array\` | 受灾点坐标 |\n| \`visible\` | \`Boolean\` | 是否显示面板 |\n\n## 3. 功能\n\n- 4 路彩色路径并行显示\n- 每步间隔 3 秒\n- 单步失败降级处理\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 救援调度面板 | \`frontend/src/components/earthquake/RescueDispatchPanel.vue\` |\n| 最短路径 composable | \`frontend/src/composables/useShortestPath.js\` |\n","fm":{"title":"救援调度面板 RescueDispatchPanel","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/dashboard-buffer-analysis-modal.md","pages/views/data-dashboard-view.md"],"related":["pages/components/earthquake-buffer-zone-layer.md","pages/components/earthquake-support-point-layer.md","pages/flows/buffer-analysis.md"],"source":["frontend/src/components/earthquake/RescueDispatchPanel.vue","frontend/src/composables/useShortestPath.js"],"summary":"5 步救援调度面板，实现地震救援的顺序调度流程"},"references":["pages/components/dashboard-buffer-analysis-modal","pages/views/data-dashboard-view"],"related":["pages/components/earthquake-buffer-zone-layer","pages/components/earthquake-support-point-layer","pages/flows/buffer-analysis"],"source":["frontend/src/components/earthquake/RescueDispatchPanel.vue","frontend/src/composables/useShortestPath.js"],"type":"component"},"pages/components/earthquake-support-point-layer":{"content":"\n# 支撑点图层 SupportPointLayer\n\n## 1. 组件概述\n\n支援点/物资点/已损毁点图层组件，在 MapboxGL 地图上渲染 4 类要素：\n- **受灾点**（红色大圆）：z-order 最高\n- **支援点**（5 类图标）：消防/医院/物资库/避难场所/应急管理\n- **物资点**（4 类图标）：粮油店/超市/药店/加油站\n- **已损毁点**（灰显）：opacity=0.4，最下层\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`map\` | \`Object\` | MapboxGL 地图实例 |\n| \`supportPoints\` | \`Array\` | 支援点数组 |\n| \`supplyPoints\` | \`Array\` | 物资点数组 |\n| \`damagedPoints\` | \`Array\` | 已损毁点数组 |\n| \`disasterCenter\` | \`Array\` | 受灾点坐标 |\n\n## 3. 交互\n\n- 点击支援点/物资点 → popup 显示名称、类型、距离、物资列表\n- 鼠标悬停 → 光标切换为 pointer\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 支撑点图层 | \`frontend/src/components/earthquake/SupportPointLayer.vue\` |\n","fm":{"title":"支撑点图层 SupportPointLayer","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/dashboard-buffer-analysis-modal.md","pages/views/data-dashboard-view.md"],"related":["pages/components/earthquake-buffer-zone-layer.md","pages/components/earthquake-rescue-dispatch-panel.md","pages/flows/buffer-analysis.md"],"source":["frontend/src/components/earthquake/SupportPointLayer.vue"],"summary":"支援点/物资点/已损毁点图层组件，渲染 4 类要素"},"references":["pages/components/dashboard-buffer-analysis-modal","pages/views/data-dashboard-view"],"related":["pages/components/earthquake-buffer-zone-layer","pages/components/earthquake-rescue-dispatch-panel","pages/flows/buffer-analysis"],"source":["frontend/src/components/earthquake/SupportPointLayer.vue"],"type":"component"},"pages/components/fastapi-main":{"content":"\n# FastAPI 主入口 main\n\n## 1. 概述\n\nFastAPI 应用的主入口文件，负责：\n- 创建 FastAPI 应用实例\n- 配置 CORS 中间件\n- 注册路由\n- 应用生命周期管理（启动时初始化 RAG 知识库）\n\n## 2. 应用配置\n\n\`\`\`python\napp = FastAPI(title=\"GIS Agent Backend\", version=\"1.0.0\", lifespan=lifespan)\n\`\`\`\n\n## 3. CORS 配置\n\n\`\`\`python\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\"http://localhost:5173\", \"http://127.0.0.1:5173\"],\n    allow_credentials=True,\n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n)\n\`\`\`\n\n## 4. 路由注册\n\n| 路由 | 前缀 | 来源 |\n|------|------|------|\n| Agent 路由 | \`/api/agent\` | \`app.api.agent\` |\n| RAG 路由 | \`/api/rag\` | \`app.api.rag\` |\n\n## 5. 健康检查\n\n\`\`\`\nGET /api/health\n\`\`\`\n\n\`\`\`json\n{\"status\": \"ok\", \"service\": \"gis-agent-backend\"}\n\`\`\`\n\n## 6. 生命周期\n\n启动时异步初始化 RAG 知识库，失败不影响服务启动。\n\n## 7. 启动方式\n\n\`\`\`bash\n# 开发模式\npython -m app.main\n\n# 生产模式\nuvicorn app.main:app --host 0.0.0.0 --port 8001\n\`\`\`\n\n## 8. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 主入口 | \`agent-backend/app/main.py\` |\n| 配置管理 | \`agent-backend/app/config.py\` |\n| 依赖声明 | \`agent-backend/requirements.txt\` |\n","fm":{"title":"FastAPI 主入口 main","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["apis/agent-api.md","apis/rag-api.md"],"related":["components/llm.md","components/rag.md"],"source":["agent-backend/app/main.py","agent-backend/app/config.py"],"summary":"FastAPI 应用主入口，配置 CORS、路由注册和生命周期管理"},"references":["pages/apis/agent-api","pages/apis/rag-api"],"related":["pages/components/llm","pages/components/rag"],"source":["agent-backend/app/main.py","agent-backend/app/config.py"],"type":"component"},"pages/components/feature-search":{"content":"\n# 要素搜索 FeatureSearch\n\n## 1. 组件概述\n\n专题检索面板，支持关键字搜索京津冀地区地物，可按行政级别（省/县/乡）分级过滤。\n\n## 2. 功能\n\n- 关键字搜索地物\n- 行政级别过滤：全部/省级/县级/乡镇\n- 结果分页列表\n- 鼠标悬停高亮 + 点击聚焦\n\n## 3. 事件\n\n| 事件 | 说明 |\n|------|------|\n| \`close\` | 关闭面板 |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 要素搜索 | \`frontend/src/components/FeatureSearch.vue\` |\n","fm":{"title":"要素搜索 FeatureSearch","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/components/spatial-query.md","pages/components/spatial-analysis.md"],"source":["frontend/src/components/FeatureSearch.vue"],"summary":"专题检索面板，支持关键字搜索和行政级别分级检索"},"references":[],"related":["pages/components/spatial-query","pages/components/spatial-analysis"],"source":["frontend/src/components/FeatureSearch.vue"],"type":"component"},"pages/components/iserver-client":{"content":"\n# iServer 客户端服务\n\n## 1. 概述\n\niServer REST API 统一客户端封装，直接调用 SuperMap iServer REST API，不依赖 SuperMap Python SDK。\n\n## 2. 功能\n\n### 2.1 数据查询\n\n| 方法 | 说明 |\n|------|------|\n| \`post_feature_results(body)\` | 京津冀数据源查询 |\n| \`post_changchun_feature_results(body)\` | 长春数据源查询 |\n| \`get_datasets()\` | 获取数据集列表 |\n\n### 2.2 空间分析\n\n| 方法 | 说明 |\n|------|------|\n| \`geometry_buffer(geometry, distance)\` | 几何缓冲区分析 |\n| \`dataset_overlay(source, operate, operation)\` | 数据集叠置分析 |\n\n### 2.3 网络分析\n\n| 方法 | 说明 |\n|------|------|\n| \`find_path(nodes, weight_field)\` | 最短路径分析 |\n| \`find_service_areas(centers, weights, weight_field)\` | 服务区分析 |\n\n### 2.4 坐标转换\n\n| 函数 | 说明 |\n|------|------|\n| \`changchun_to_wgs84(x, y)\` | 长春平面坐标 → WGS84 |\n| \`wgs84_to_changchun(lng, lat)\` | WGS84 → 长春平面坐标 |\n| \`convert_changchun_geometry(geo)\` | 转换 GeoJSON 坐标 |\n\n## 3. 数据源配置\n\n| 数据源 | 用途 |\n|--------|------|\n| \`Jingjin\` | 京津冀数据（空间查询） |\n| \`Changchun\` | 长春数据（网络分析） |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| iServer 客户端 | \`agent-backend/app/services/iserver_client.py\` |\n| GIS 工具层 | \`agent-backend/app/tools/gis_tools.py\` |\n","fm":{"title":"iServer 客户端服务","type":"component","tech":"python","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["apis/iserver-feature-results.md","apis/iserver-buffer.md","apis/iserver-network-analyst.md","apis/iserver-overlay.md"],"related":["tools/gis-tools.md"],"source":["agent-backend/app/services/iserver_client.py"],"summary":"iServer REST API 统一客户端封装，提供数据查询、空间分析、网络分析等能力"},"references":["pages/apis/iserver-feature-results","pages/apis/iserver-buffer","pages/apis/iserver-network-analyst","pages/apis/iserver-overlay"],"related":[],"source":["agent-backend/app/services/iserver_client.py"],"type":"component"},"pages/components/layer-manager":{"content":"\n# 图层管理器 LayerManager\n\n## 1. 组件概述\n\n图层管理器，以抽屉面板形式展示，允许用户控制地图图层的可见性和透明度。\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`visible\` | \`Boolean\` | 面板是否显示 |\n\n## 3. 功能\n\n- 显示图层列表（底图 + 覆盖层）\n- 切换图层可见性（复选框）\n- 调整图层透明度（0-100% 滑条）\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 图层管理器 | \`frontend/src/components/LayerManager.vue\` |\n","fm":{"title":"图层管理器 LayerManager","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/components/nav-sidebar.md","pages/components/map-toolbar.md"],"source":["frontend/src/components/LayerManager.vue"],"summary":"图层管理器，控制地图图层的可见性和透明度"},"references":[],"related":["pages/components/nav-sidebar","pages/components/map-toolbar"],"source":["frontend/src/components/LayerManager.vue"],"type":"component"},"pages/components/llm":{"content":"\n# LLM 服务\n\n## 1. 概述\n\nLLM 服务封装，隔离底层 API 差异，业务代码不直接依赖具体构造器细节。\n\n## 2. 功能\n\n### 2.1 聊天模型\n\n\`\`\`python\nLLMService.get_chat_model(temperature=0.3)\n\`\`\`\n\n使用 DeepSeek 兼容 OpenAI 格式的 API：\n- 模型：\`deepseek-chat\`\n- API Key：从 \`.env\` 读取\n- Base URL：\`https://api.deepseek.com/v1\`\n\n### 2.2 Embedding 模型\n\n\`\`\`python\nLLMService.get_embedding_model()\n\`\`\`\n\n用于 RAG 向量检索，支持 OpenAI 兼容的 Embedding API。\n\n## 3. 配置项\n\n| 配置 | 说明 |\n|------|------|\n| \`deepseek_api_key\` | DeepSeek API Key |\n| \`deepseek_base_url\` | DeepSeek API Base URL |\n| \`deepseek_model\` | 模型名称 |\n| \`embedding_api_key\` | Embedding API Key |\n| \`embedding_base_url\` | Embedding API Base URL |\n| \`embedding_model\` | Embedding 模型名称 |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| LLM 服务 | \`agent-backend/app/services/llm_service.py\` |\n| 配置管理 | \`agent-backend/app/config.py\` |\n","fm":{"title":"LLM 服务","type":"component","tech":"python","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["components/agent-coordinator.md","components/agent-sub-agents.md"],"related":["components/rag.md"],"source":["agent-backend/app/services/llm_service.py"],"summary":"LLM 服务封装，统一 DeepSeek 和 Embedding 模型的创建接口"},"references":["pages/components/agent-coordinator","pages/components/agent-sub-agents"],"related":["pages/components/rag"],"source":["agent-backend/app/services/llm_service.py"],"type":"component"},"pages/components/map-measure":{"content":"\n# 地图量算 MapMeasure\n\n## 1. 组件概述\n\n地图量算工具，提供距离量算和面积量算功能，用户可在地图上采集点进行测量。\n\n## 2. 功能\n\n| 模式 | 说明 |\n|------|------|\n| 距离量算 | 采集点，显示累计距离 |\n| 面积量算 | 采集点，显示多边形面积 |\n| 清除 | 清除所有标注 |\n\n## 3. 图层命名\n\n- \`measure-main\`：测量结果图层（线/面）\n- \`measure-preview\`：鼠标跟随预览线\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 地图量算 | \`frontend/src/components/MapMeasure.vue\` |\n","fm":{"title":"地图量算 MapMeasure","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/components/map-toolbar.md","pages/components/spatial-query.md"],"source":["frontend/src/components/MapMeasure.vue"],"summary":"地图量算工具，提供距离和面积量算功能"},"references":[],"related":["pages/components/map-toolbar","pages/components/spatial-query"],"source":["frontend/src/components/MapMeasure.vue"],"type":"component"},"pages/components/map-overview":{"content":"\n# 鹰眼视图 MapOverview\n\n## 1. 组件概述\n\n鹰眼视图（小地图），显示主地图在全球范围内的位置矩形，帮助用户了解当前视图在全局的位置。\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`visible\` | \`Boolean\` | 是否显示鹰眼 |\n\n## 3. 功能\n\n- 显示世界底图\n- 同步主地图视图范围矩形\n- 支持拖拽矩形改变主地图视图\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 鹰眼视图 | \`frontend/src/components/MapOverview.vue\` |\n","fm":{"title":"鹰眼视图 MapOverview","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/components/map-toolbar.md","pages/components/nav-sidebar.md"],"source":["frontend/src/components/MapOverview.vue"],"summary":"鹰眼视图（小地图），显示主地图在全球范围内的位置矩形"},"references":[],"related":["pages/components/map-toolbar","pages/components/nav-sidebar"],"source":["frontend/src/components/MapOverview.vue"],"type":"component"},"pages/components/map-store":{"content":"\n# 地图状态管理 MapStore\n\n## 1. 概述\n\nPinia Store，管理 MapboxGL 地图实例的生命周期、加载状态、错误信息和图层列表。\n\n## 2. 状态定义\n\n| 状态 | 类型 | 说明 |\n|------|------|------|\n| \`mapInstance\` | \`Ref<Map\\|null>\` | MapboxGL 地图实例 |\n| \`isLoading\` | \`Ref<boolean>\` | 地图是否正在加载中 |\n| \`isError\` | \`Ref<boolean>\` | 地图是否加载出错 |\n| \`errorMessage\` | \`Ref<string>\` | 错误信息描述 |\n| \`layers\` | \`Ref<Array>\` | 图层列表（id、name、visible、opacity） |\n\n## 3. 方法\n\n| 方法 | 说明 |\n|------|------|\n| \`setMap(map)\` | 设置地图实例，标记加载完成 |\n| \`setLoading(status)\` | 手动设置加载状态 |\n| \`setError(message)\` | 设置错误状态和信息 |\n| \`clearError()\` | 清除错误状态 |\n| \`setLayers(list)\` | 设置完整图层列表 |\n| \`addLayer(layer)\` | 添加单个图层（去重） |\n| \`removeLayer(layerId)\` | 根据 ID 移除图层 |\n\n## 4. 使用方式\n\n\`\`\`js\nimport { useMapStore } from '@/stores/map'\n\nconst mapStore = useMapStore()\n\n// 监听地图加载\nwatch(() => mapStore.isLoading, (val) => {\n  if (!val && !mapStore.isError) {\n    console.log('地图加载完成')\n  }\n})\n\n// 添加图层\nmapStore.addLayer({ id: 'rainfall', name: '降雨量', visible: true, opacity: 1 })\n\`\`\`\n\n## 5. 关联组件\n\n几乎所有地图相关组件都依赖此 Store：\n- \`SmMapViewer\` - 创建地图后调用 \`setMap()\`\n- \`MapToolbar\` - 操作地图实例\n- \`MapMeasure\` - 量算时访问地图实例\n- \`LayerManager\` - 管理 \`layers\` 状态\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 地图状态 | \`frontend/src/stores/map.js\` |\n","fm":{"title":"地图状态管理 MapStore","type":"component","tech":"store","status":"stable","created":"2026-07-14","updated":"2026-07-14","tags":[],"references":[],"related":["pages/components/sm-map-viewer.md"],"source":["frontend/src/stores/map.js"],"summary":"Pinia 地图状态管理，管理地图实例、加载状态、错误信息和图层列表"},"references":[],"related":["pages/components/sm-map-viewer"],"source":["frontend/src/stores/map.js"],"type":"component"},"pages/components/map-toolbar":{"content":"\n# 地图工具栏 MapToolbar\n\n## 1. 组件概述\n\n悬浮在地图左上角的工具条，提供缩放和全幅显示功能。\n\n## 2. 功能\n\n| 按钮 | 操作 |\n|------|------|\n| 放大 | \`map.zoomIn()\` |\n| 缩小 | \`map.zoomOut()\` |\n| 全幅显示 | \`map.flyTo([116.4, 39.9], zoom: 8)\` |\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 地图工具栏 | \`frontend/src/components/MapToolbar.vue\` |\n","fm":{"title":"地图工具栏 MapToolbar","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/components/nav-sidebar.md","pages/components/map-overview.md"],"source":["frontend/src/components/MapToolbar.vue"],"summary":"地图操作工具条，提供缩放和全幅显示功能"},"references":[],"related":["pages/components/nav-sidebar","pages/components/map-overview"],"source":["frontend/src/components/MapToolbar.vue"],"type":"component"},"pages/components/nav-sidebar":{"content":"\n# 导航侧栏 NavSidebar\n\n## 1. 组件概述\n\n左侧导航侧栏，以图标按钮形式提供各功能模块的入口，包括：\n- GIS 功能模块（空间查询、量算、专题检索等）\n- 数据库表格模块（协同叫应、预警信息、物资调度）\n- 图层管理器入口\n\n## 2. Props\n\n| Prop | 类型 | 说明 |\n|------|------|------|\n| \`activeKey\` | \`String\` | 当前激活的菜单项 |\n| \`collapsed\` | \`Boolean\` | 侧栏是否收起 |\n\n## 3. 菜单项分组\n\n| 分组 | 菜单项 |\n|------|--------|\n| GIS 功能 | 空间查询、量算、专题检索、空间分析、网络分析、鹰眼 |\n| 数据库 | 协同叫应、预警信息、物资调度 |\n| 工具 | 图层管理器 |\n\n## 4. 事件\n\n| 事件 | 说明 |\n|------|------|\n| \`update:activeKey\` | 菜单项切换 |\n| \`toggleCollapse\` | 收起侧栏 |\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 导航侧栏 | \`frontend/src/components/NavSidebar.vue\` |\n","fm":{"title":"导航侧栏 NavSidebar","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/components/map-toolbar.md","pages/components/layer-manager.md"],"source":["frontend/src/components/NavSidebar.vue"],"summary":"左侧导航侧栏，提供各功能模块的入口"},"references":[],"related":["pages/components/map-toolbar","pages/components/layer-manager"],"source":["frontend/src/components/NavSidebar.vue"],"type":"component"},"pages/components/network-analysis":{"content":"\n# Network Analysis\n\n> 状态：draft — 待补充内容\n\n## 基本信息\n\n（待补充）\n\n## 关联\n\n（待补充）\n","fm":{"title":"Network Analysis","type":"component","status":"draft","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":[],"source":["frontend/src/components/NetworkAnalysis.vue"],"summary":"（待补充）"},"references":[],"related":[],"source":["frontend/src/components/NetworkAnalysis.vue"],"type":"component"},"pages/components/rag":{"content":"\n# RAG 知识库服务\n\n## 1. 概述\n\nRAG（Retrieval-Augmented Generation）知识库服务，使用 FAISS 向量库 + Embedding 模型实现文档索引与语义检索。\n\n## 2. 功能\n\n### 2.1 初始化\n\n启动时自动加载或创建向量库：\n1. 检查本地持久化文件是否存在\n2. 存在则直接加载\n3. 不存在则从 \`knowledge_dir\` 读取 \`.md\` 文件并索引\n\n### 2.2 文档索引\n\n\`\`\`python\nrag_service.add_text(content, metadata={\"source\": \"doc.md\"})\n\`\`\`\n\n### 2.3 向量检索\n\n\`\`\`python\nresults = rag_service.search(\"应急救援方案\", top_k=3)\n\`\`\`\n\n### 2.4 状态检查\n\n\`\`\`python\nrag_service.is_ready()  # 向量库是否已初始化\nrag_service.get_indexed_docs()  # 已索引文档列表\n\`\`\`\n\n## 3. 技术栈\n\n| 技术 | 用途 |\n|------|------|\n| FAISS | 向量存储和相似度检索 |\n| LangChain | RAG 框架和文本分割 |\n| OpenAI Embedding | 向量化模型 |\n\n## 4. 配置项\n\n| 配置 | 说明 |\n|------|------|\n| \`vector_store_path\` | 向量库存储路径 |\n| \`knowledge_dir\` | 知识库文档目录 |\n| \`embedding_model\` | Embedding 模型名称 |\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| RAG 服务 | \`agent-backend/app/services/rag_service.py\` |\n| RAG API | \`agent-backend/app/api/rag.py\` |\n| RAG 工具 | \`agent-backend/app/tools/rag_tools.py\` |\n","fm":{"title":"RAG 知识库服务","type":"component","tech":"python","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["apis/rag-api.md","components/llm.md"],"related":["components/agent-sub-agents.md"],"source":["agent-backend/app/services/rag_service.py"],"summary":"RAG 向量检索服务，使用 FAISS 向量库 + Embedding 模型实现文档索引与语义检索"},"references":["pages/apis/rag-api","pages/components/llm"],"related":["pages/components/agent-sub-agents"],"source":["agent-backend/app/services/rag_service.py"],"type":"component"},"pages/components/session-store":{"content":"\n# 会话存储\n\n## 1. 概述\n\n内存级会话存储，每个 \`session_id\` 维护一个消息列表（\`HumanMessage\` / \`AIMessage\`），重启后丢失。\n\n## 2. 功能\n\n| 方法 | 说明 |\n|------|------|\n| \`get_history(session_id)\` | 获取指定会话的历史消息列表 |\n| \`add_exchange(session_id, user_message, ai_response)\` | 追加一轮对话到会话历史 |\n| \`clear_session(session_id)\` | 清空指定会话历史 |\n\n## 3. 设计约束\n\n- 只存 \`HumanMessage\` 和最终 \`AIMessage\`（纯文本）\n- 不存 \`ToolMessage\` / 含 \`tool_calls\` 的 \`AIMessage\`，避免 Agent 重复执行工具\n- 每个会话最多保留 20 条消息（防止上下文膨胀）\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 会话存储 | \`agent-backend/app/services/session_store.py\` |\n","fm":{"title":"会话存储","type":"component","tech":"python","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/apis/agent-api.md","pages/components/agent-coordinator.md"],"source":["agent-backend/app/services/session_store.py"],"summary":"内存级会话存储，每个 session_id 维护一个消息列表"},"references":["pages/apis/agent-api","pages/components/agent-coordinator"],"related":[],"source":["agent-backend/app/services/session_store.py"],"type":"component"},"pages/components/sm-map-viewer":{"content":"\n# 地图查看器 SmMapViewer\n\n## 1. 组件概述\n\n应用的核心地图组件，负责：\n- 初始化 MapboxGL 地图实例（世界底图 + 京津冀专题图）\n- 管理地图状态（通过 \`useMapStore\`）\n- 协调各功能面板的渲染和切换\n\n## 2. Props\n\n无 props，通过 Pinia store 共享状态。\n\n## 3. 关键功能\n\n### 3.1 地图初始化\n\n\`\`\`js\nconst map = new mapboxgl.Map({\n  container: 'map',\n  style: {\n    version: 8,\n    sources: {\n      'world': { type: 'raster', tiles: [...], tileSize: 256 },\n      'jingjin': { type: 'raster', tiles: [...], tileSize: 256 },\n    },\n    layers: [\n      { id: 'world-layer', type: 'raster', source: 'world' },\n      { id: 'jingjin-layer', type: 'raster', source: 'jingjin' },\n    ],\n  },\n  center: [116.4, 39.9],\n  zoom: 8,\n})\n\`\`\`\n\n###
