 3.2 功能面板切换\n\n通过 \`activeKey\` 控制各功能面板的显示：\n\n| activeKey | 显示的面板 |\n|-----------|----------|\n| \`spatial-query\` | SpatialQuery |\n| \`measure\` | MapMeasure |\n| \`thematic-search\` | FeatureSearch |\n| \`spatial-analysis\` | SpatialAnalysis |\n| \`network-analysis\` | NetworkAnalysis |\n| \`overview\` | MapOverview |\n\n### 3.3 图层管理器\n\nLayerManager 通过 \`v-model:visible\` 控制，不占用 \`activeKey\`。\n\n### 3.4 路由跳转\n\n侧栏菜单的数据库表格模块（coord-response/warn-info/supply-dispatch）触发路由跳转，不占用 \`activeKey\`。\n\n## 4. 生命周期\n\n| 钩子 | 职责 |\n|------|------|\n| \`onMounted\` | 调用 \`loadMap()\` 初始化地图 |\n| \`onUnmounted\` | 清理 \`ResizeObserver\` |\n\n## 5. 错误处理\n\n- 地图加载失败：显示 \`map-error\` 状态，提供\"重新加载\"按钮\n- 地图服务连接失败：显示 \`a-result\` 警告\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 地图组件 | \`frontend/src/components/SmMapViewer.vue\` |\n| 地图状态 | \`frontend/src/stores/map.js\` |\n| 工具函数 | \`frontend/src/utils/map.js\` |\n","fm":{"title":"地图查看器 SmMapViewer","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/nav-sidebar.md","pages/components/map-toolbar.md","pages/components/map-overview.md","pages/components/map-measure.md","pages/components/feature-search.md","pages/components/spatial-analysis.md","pages/components/network-analysis.md","pages/components/spatial-query.md","pages/components/layer-manager.md"],"related":["pages/views/home-view.md","pages/components/map-toolbar.md","pages/components/layer-manager.md"],"source":["frontend/src/components/SmMapViewer.vue","frontend/src/stores/map.js"],"summary":"核心地图组件，初始化 MapboxGL 地图，协调各功能面板"},"references":["pages/components/nav-sidebar","pages/components/map-toolbar","pages/components/map-overview","pages/components/map-measure","pages/components/feature-search","pages/components/spatial-analysis","pages/components/network-analysis","pages/components/spatial-query","pages/components/layer-manager"],"related":["pages/views/home-view","pages/components/map-toolbar","pages/components/layer-manager"],"source":["frontend/src/components/SmMapViewer.vue","frontend/src/stores/map.js"],"type":"component"},"pages/components/spatial-analysis":{"content":"\n# 空间分析 SpatialAnalysis\n\n## 1. 组件概述\n\n空间分析面板，提供两种分析模式：\n- **缓冲区分析**：绘制点/线/面，设置半径生成缓冲区\n- **叠置分析**：图层叠加分析\n\n## 2. 功能\n\n### 2.1 缓冲区分析\n\n| 步骤 | 操作 |\n|------|------|\n| ① | 绘制分析对象（点/线/面） |\n| ② | 设置缓冲区半径（10-5000 米） |\n| ③ | 执行分析 |\n\n### 2.2 叠置分析\n\n图层叠加分析（土地利用叠置等）。\n\n## 3. 事件\n\n| 事件 | 说明 |\n|------|------|\n| \`close\` | 关闭面板 |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 空间分析 | \`frontend/src/components/SpatialAnalysis.vue\` |\n","fm":{"title":"空间分析 SpatialAnalysis","type":"component","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/components/spatial-query.md","pages/components/feature-search.md","pages/flows/buffer-analysis.md"],"source":["frontend/src/components/SpatialAnalysis.vue"],"summary":"空间分析面板，提供缓冲区分析和叠置分析功能"},"references":[],"related":["pages/components/spatial-query","pages/components/feature-search","pages/flows/buffer-analysis"],"source":["frontend/src/components/SpatialAnalysis.vue"],"type":"component"},"pages/components/spatial-query":{"content":"\n# Spatial Query\n\n> 状态：draft — 待补充内容\n\n## 基本信息\n\n（待补充）\n\n## 关联\n\n（待补充）\n","fm":{"title":"Spatial Query","type":"component","status":"draft","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":[],"source":["frontend/src/components/SpatialQuery.vue"],"summary":"（待补充）"},"references":[],"related":[],"source":["frontend/src/components/SpatialQuery.vue"],"type":"component"},"pages/components/supply-dispatch-service":{"content":"\n# 物资调度服务 SupplyDispatchService\n\n## 1. 定位\n\n应急物资调度业务服务层，对接 \`tb_supply_dispatch\` 数据表的基础 CRUD 操作。\n\n## 2. 功能\n\n- 应急物资调度记录录入与查询\n- 物资类型管理（排水/救生/医疗/食品）\n- 调度状态跟踪\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Service | \`backend/src/main/java/com/gis/emergency/service/SupplyDispatchService.java\` |\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/SupplyDispatchController.java\` |\n| Entity | \`backend/src/main/java/com/gis/emergency/entity/SupplyDispatch.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/SupplyDispatchMapper.java\` |\n","fm":{"title":"物资调度服务 SupplyDispatchService","type":"component","tech":"java","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["apis/supply-dispatch.md","entities/supply-dispatch.md"],"source":["backend/src/main/java/com/gis/emergency/service/SupplyDispatchService.java"],"summary":"应急物资调度业务服务层，对接 tb_supply_dispatch 数据表的基础 CRUD 操作"},"references":["pages/apis/supply-dispatch","pages/entities/supply-dispatch"],"related":[],"source":["backend/src/main/java/com/gis/emergency/service/SupplyDispatchService.java"],"type":"component"},"pages/components/warn-info-service":{"content":"\n# 预警信息服务 WarnInfoService\n\n## 1. 定位\n\n气象灾害预警业务服务层，对接 \`tb_warn_info\` 数据表的基础 CRUD 操作。\n\n## 2. 功能\n\n- 气象灾害预警信息录入与查询\n- 灾害类型校验（暴雨/大风/沙尘/强对流）\n- 预警等级校验（蓝/黄/橙/红）\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| Service | \`backend/src/main/java/com/gis/emergency/service/WarnInfoService.java\` |\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/WarnInfoController.java\` |\n| Entity | \`backend/src/main/java/com/gis/emergency/entity/WarnInfo.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/WarnInfoMapper.java\` |\n","fm":{"title":"预警信息服务 WarnInfoService","type":"component","tech":"java","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["apis/warn-info.md","entities/warn-info.md"],"source":["backend/src/main/java/com/gis/emergency/service/WarnInfoService.java"],"summary":"气象灾害预警业务服务层，对接 tb_warn_info 数据表的基础 CRUD 操作"},"references":["pages/apis/warn-info","pages/entities/warn-info"],"related":[],"source":["backend/src/main/java/com/gis/emergency/service/WarnInfoService.java"],"type":"component"},"pages/concepts/adr-001":{"content":"\n# 技术选型决策 ADR-001\n\n## 1. 状态\n\n**已接受**（Accepted）\n\n## 2. 背景\n\n项目需要构建一个城市综合防灾应急管理 GIS 系统，要求：\n- 地图可视化能力强\n- 组件化开发\n- 状态管理清晰\n- 构建工具高效\n\n## 3. 决策\n\n采用以下技术栈：\n\n| 技术 | 版本 | 选择理由 |\n|------|------|---------|\n| **Vue 3** | 3.x | Composition API 提供更灵活的代码组织 |\n| **Pinia** | 2.x | 官方推荐的状态管理，比 Vuex 更轻量 |\n| **MapboxGL** | 2.x | 高性能 WebGL 地图引擎，社区活跃 |\n| **Vite** | 4.x | 极快的构建速度和 HMR |\n| **Ant Design Vue** | 4.x | 企业级 UI 组件库，设计规范统一 |\n\n## 4. 后果\n\n### 4.1 正面\n\n- Composition API 便于逻辑复用\n- Pinia 的 TypeScript 支持更好\n- Vite 开发体验极佳\n- Ant Design Vue 组件丰富\n\n### 4.2 负面\n\n- MapboxGL 商业使用需授权（教育免费版可用）\n- Vite 与传统 CJS 模块兼容性需注意\n\n## 5. 替代方案\n\n| 技术 | 未选理由 |\n|------|---------|\n| React | Vue 3 学习成本更低，团队更熟悉 |\n| Vuex | Pinia 是官方推荐的继任者 |\n| OpenLayers | MapboxGL 性能更优，文档更完善 |\n| Webpack | Vite 构建速度更快 |\n\n## 6. 相关决策\n\n- [[pages/concepts/adr-002]] — SuperMap iServer 后端服务选型\n- [[pages/concepts/adr-003]] — AI Agent 多智能体架构选型\n","fm":{"title":"技术选型决策 ADR-001","type":"concept","status":"accepted","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":[],"source":["frontend/package.json"],"summary":"前端技术栈选型决策：Vue 3 + Pinia + MapboxGL"},"references":[],"related":[],"source":["frontend/package.json"],"type":"concept"},"pages/concepts/adr-002":{"content":"\n# SuperMap iServer 服务选型决策 ADR-002\n\n## 1. 状态\n\n**已接受**（Accepted）\n\n## 2. 背景\n\n项目需要 GIS 服务平台来发布地图服务、空间数据服务、网络分析服务，要求：\n- 支持 RESTful API\n- 支持 WMS/WMTS/WFS 标准\n- 支持空间查询和网络分析\n- 支持自定义数据源接入\n\n## 3. 决策\n\n采用 **SuperMap iServer 11i** 作为 GIS 服务平台。\n\n## 4. 服务配置\n\n| 服务 | URL 前缀 | 用途 |\n|------|---------|------|\n| 世界底图 | \`/iserver/services/map-world\` | 全球底图 |\n| 京津冀专题图 | \`/iserver/services/map-jingjin\` | 区域专题图 |\n| 长春市区图 | \`/iserver/services/map-changchun\` | 网络分析底图 |\n| 数据服务 | \`/iserver/services/data-jingjin\` | 空间数据查询 |\n| 网络分析 | \`/iserver/services/transportationanalyst-sample\` | 路径/服务区分析 |\n\n## 5. 前后端通信\n\n\`\`\`js\n// Vite proxy 配置\nproxy: {\n  '/iserver': {\n    target: 'http://localhost:8090',\n    changeOrigin: true,\n  },\n}\n\`\`\`\n\n## 6. 后果\n\n### 6.1 正面\n\n- 完整的 GIS 服务栈\n- REST API 设计规范\n- 与 SuperMap iDesktopX 数据无缝衔接\n\n### 6.2 负面\n\n- 商业软件，教育版限制\n- 部署和调优有一定学习成本\n\n## 7. 替代方案\n\n| 方案 | 未选理由 |\n|------|---------|\n| GeoServer | Java 生态但文档较少 |\n| ArcGIS Server | 商业授权费用高 |\n| 自建 GeoJSON 服务 | 缺乏空间分析能力 |\n\n## 8. 相关决策\n\n- [[pages/concepts/adr-001]] — 前端技术栈选型\n","fm":{"title":"SuperMap iServer 服务选型决策 ADR-002","type":"concept","status":"accepted","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/apis/coord-response.md","pages/apis/warn-info.md","pages/apis/supply-dispatch.md"],"related":["concepts/geojson.md"],"source":["backend/src/main/java/com/gis/emergency/controller/HealthController.java","frontend/src/utils/map.js"],"summary":"GIS 服务平台选型决策：SuperMap iServer 11i"},"references":["pages/apis/coord-response","pages/apis/warn-info","pages/apis/supply-dispatch"],"related":["pages/concepts/geojson"],"source":["backend/src/main/java/com/gis/emergency/controller/HealthController.java","frontend/src/utils/map.js"],"type":"concept"},"pages/concepts/adr-003":{"content":"\n# AI Agent 多智能体架构决策 ADR-003\n\n## 1. 状态\n\n**已接受**（Accepted）\n\n## 2. 背景\n\n项目需要一个 AI 应急助手，能够：\n- 理解用户的自然语言查询\n- 自动调用 GIS 工具完成任务\n- 返回结构化的结果和地图渲染\n\n## 3. 决策\n\n采用**多智能体协同**架构，通过 **SSE（Server-Sent Events）** 事件流实现前后端通信。\n\n## 4. 架构设计\n\n### 4.1 多智能体角色\n\n| 角色 | 职责 |\n|------|------|\n| **Coordinator（协调者）** | 意图分类、任务规划、步骤调度 |\n| **Search Agent（检索专家）** | 执行空间查询、要素搜索 |\n| **Analysis Agent（分析专家）** | 执行缓冲区分析、网络分析 |\n| **Route Agent（路径专家）** | 执行路径规划、路线分析 |\n| **Knowledge Agent（知识专家）** | 回答 GIS 知识问题 |\n\n### 4.2 SSE 事件流\n\n\`\`\`\n用户发送消息 → 建立 SSE 连接 → 接收事件流 → 更新 UI\n\`\`\`\n\n| 事件 | 说明 |\n|------|------|\n| \`onIntentClassified\` | 意图分类结果 |\n| \`onPlanCreated\` | 任务计划 |\n| \`onStepStart\` | 步骤开始 |\n| \`onStepDone\` | 步骤完成 |\n| \`onToolStart\` | 工具调用开始 |\n| \`onToolResult\` | 工具调用结果 |\n| \`onText\` | 流式文本 |\n| \`onAgentEnd\` | 全部完成 |\n| \`onError\` | 错误信息 |\n\n## 5. 后果\n\n### 5.1 正面\n\n- 任务分解清晰，职责单一\n- 流式响应用户体验好\n- 易于扩展新的 Agent 类型\n\n### 5.2 负面\n\n- 多智能体协调复杂度高\n- SSE 连接管理需要额外处理\n\n## 6. 替代方案\n\n| 方案 | 未选理由 |\n|------|---------|\n| 单 Agent | 任务复杂度高，难以维护 |\n| WebSocket | SSE 更轻量，单向通信足够 |\n| REST 轮询 | 实时性差，用户体验不好 |\n\n## 7. 相关决策\n\n- [[pages/concepts/adr-001]] — 前端技术栈选型\n","fm":{"title":"AI Agent 多智能体架构决策 ADR-003","type":"concept","status":"accepted","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/agent-chat-panel.md","pages/views/home-view.md","pages/components/map-store"],"related":["concepts/multi-agent.md"],"source":["frontend/src/utils/agent/sse.js","frontend/src/utils/agent/mapRenderer.js"],"summary":"AI Agent 架构选型决策：多智能体协同 + SSE 事件流"},"references":["pages/components/agent-chat-panel","pages/views/home-view","pages/components/map-store"],"related":["pages/concepts/multi-agent"],"source":["frontend/src/utils/agent/sse.js","frontend/src/utils/agent/mapRenderer.js"],"type":"concept"},"pages/concepts/app-config":{"content":"\n# 应用配置\n\n## 1. 概述\n\n应用配置管理，从 \`.env\` 文件读取配置，不硬编码任何密钥。\n\n## 2. 配置项\n\n### 2.1 DeepSeek LLM 配置\n\n| 配置 | 说明 |\n|------|------|\n| \`deepseek_api_key\` | DeepSeek API Key |\n| \`deepseek_base_url\` | DeepSeek API Base URL |\n| \`deepseek_model\` | 模型名称（默认 \`deepseek-chat\`） |\n\n### 2.2 iServer 配置\n\n| 配置 | 说明 |\n|------|------|\n| \`iserver_url\` | iServer 服务地址（默认 \`http://localhost:8090\`） |\n\n### 2.3 后端服务配置\n\n| 配置 | 说明 |\n|------|------|\n| \`host\` | 监听地址（默认 \`0.0.0.0\`） |\n| \`port\` | 监听端口（默认 \`8001\`） |\n\n### 2.4 RAG / Embedding 配置\n\n| 配置 | 说明 |\n|------|------|\n| \`embedding_api_key\` | Embedding API Key |\n| \`embedding_base_url\` | Embedding API Base URL |\n| \`embedding_model\` | Embedding 模型名称 |\n| \`vector_store_path\` | 向量库存储路径 |\n| \`knowledge_dir\` | 知识库文档目录 |\n\n## 3. 配置优先级\n\n\`\`\`\n构造参数 > .env 文件 > 进程环境变量 > 密钥文件\n\`\`\`\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 配置管理 | \`agent-backend/app/config.py\` |\n","fm":{"title":"应用配置","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["components/fastapi-main.md"],"related":["components/llm.md"],"source":["agent-backend/app/config.py"],"summary":"应用配置管理，从 .env 文件读取配置，不硬编码任何密钥"},"references":["pages/components/fastapi-main"],"related":["pages/components/llm"],"source":["agent-backend/app/config.py"],"type":"concept"},"pages/concepts/buffer-analysis":{"content":"\n# 缓冲区分析\n\n## 1. 定义\n\n缓冲区分析（Buffer Analysis）是 GIS 中最基础的空间分析功能，以**点/线/面**为输入要素，按**指定半径**向外扩展生成**多边形区域**。\n\n## 2. 数学原理\n\n### 2.1 点缓冲区\n\n以点 \`(cx, cy)\` 为圆心，半径 \`r\` 生成圆形多边形：\n\n\`\`\`\n对于角度 θ ∈ [0, 2π]，步长 2π/n（n=64 边）：\n  x = cx + r * cos(θ) / (111320 * cos(cy * π/180))\n  y = cy + r * sin(θ) / 111320\n\`\`\`\n\n其中 \`111320\` 是每度对应的米数（赤道处），\`cos(cy * π/180)\` 修正经度方向的纬度缩放。\n\n### 2.2 线缓冲区\n\n沿线的每个节点生成半圆，两侧生成平行线，合并形成缓冲区多边形。\n\n### 2.3 面缓冲区\n\n面向外扩展，外角处生成圆弧，内角处生成尖角。\n\n## 3. 项目中的应用\n\n### 3.1 双缓冲区（地震应急）\n\n项目中使用**内/外双圈缓冲区**：\n- **内圈**（红色 \`rgba(229,62,62,0.25)\`）：灾害影响范围\n- **外圈**（橙色 \`rgba(221,107,32,0.15)\`）：应急支援范围\n\n\`\`\`js\n// circlePolygon.js\nfunction createCirclePolygon(center, radiusMeters, segments = 64) {\n  const [cx, cy] = center\n  const points = []\n  for (let i = 0; i <= segments; i++) {\n    const angle = (i / segments) * 2 * Math.PI\n    const lng = cx + dLng * Math.cos(angle)\n    const lat = cy + dLat * Math.sin(angle)\n    points.push([lng, lat])\n  }\n  return { type: 'Polygon', coordinates: [points] }\n}\n\`\`\`\n\n### 3.2 点选缓冲区（空间查询）\n\n用户点击地图时，以点击位置为中心生成 **500m 缓冲区**（32 边近似圆），作为空间查询的范围。\n\n## 4. 关键参数\n\n| 参数 | 说明 | 项目取值 |\n|------|------|---------|\n| \`segments\` | 近似圆边数 | 32 或 64 |\n| \`radiusMeters\` | 缓冲区半径（米） | 内圈/外圈动态计算 |\n| \`innerColor\` | 内圈填充色 | \`rgba(229,62,62,0.25)\` |\n| \`outerColor\` | 外圈填充色 | \`rgba(221,107,32,0.15)\` |\n\n## 5. 相关概念\n\n- [[pages/concepts/spatial-query]] — 空间查询\n- [[pages/concepts/overlay-analysis]] — 叠置分析\n- [[pages/concepts/network-analysis]] — 网络分析\n","fm":{"title":"缓冲区分析","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/flows/buffer-analysis.md","pages/components/spatial-analysis.md","pages/components/earthquake-buffer-zone-layer.md"],"related":["concepts/spatial-query.md","concepts/overlay-analysis.md"],"source":["frontend/src/utils/circlePolygon.js","frontend/src/components/earthquake/BufferZoneLayer.vue"],"summary":"缓冲区分析是 GIS 中最基础的空间分析功能，以点/线/面为输入，按指定半径生成多边形区域"},"references":["pages/flows/buffer-analysis","pages/components/spatial-analysis","pages/components/earthquake-buffer-zone-layer"],"related":["pages/concepts/spatial-query","pages/concepts/overlay-analysis"],"source":["frontend/src/utils/circlePolygon.js","frontend/src/components/earthquake/BufferZoneLayer.vue"],"type":"concept"},"pages/concepts/ddi":{"content":"\n# DDI 综合灾害指数\n\n## 1. 定义\n\nDDI（Disaster Damage Index）综合灾害指数，是基于 **AHP 熵权法**的多指标综合评估模型，用于量化地震灾害的严重程度。\n\n## 2. 评估指标体系\n\n项目使用 **8 项指标**进行综合评估：\n\n| 指标 | 代码 | 说明 |\n|------|------|------|\n| 震级 | \`magnitude\` | 地震释放能量 |\n| 震源深度 | \`depth\` | 震源到地表的距离 |\n| 受灾人口 | \`affected_people\` | 受影响人口数量 |\n| 房屋倒塌 | \`house_collapse\` | 倒塌房屋数量 |\n| 道路损毁 | \`road_damage\` | 损毁道路长度 |\n| 通信中断 | \`communication_outage\` | 中断基站数量 |\n| 电力中断 | \`power_outage\` | 停电用户数量 |\n| 救援难度 | \`rescue_difficulty\` | 地形、交通等综合评估 |\n\n## 3. 灾害等级划分\n\n| 等级 | DDI 范围 | 颜色 | 说明 |\n|------|---------|------|------|\n| 1 级（特别重大） | DDI ≥ 8.0 | 🔴 红色 | 需国家级响应 |\n| 2 级（重大） | 6.0 ≤ DDI < 8.0 | 🟠 橙色 | 需省级响应 |\n| 3 级（较大） | 4.0 ≤ DDI < 6.0 | 🟡 黄色 | 需市级响应 |\n| 4 级（一般） | DDI < 4.0 | 🟢 绿色 | 需县级响应 |\n\n## 4. 缓冲区配置\n\nDDI 等级决定缓冲区半径：\n\n| 等级 | 内圈半径 | 外圈半径 |\n|------|---------|---------|\n| 1 级 | 5 km | 10 km |\n| 2 级 | 3 km | 6 km |\n| 3 级 | 2 km | 4 km |\n| 4 级 | 1 km | 2 km |\n\n## 5. 相关概念\n\n- [[pages/concepts/buffer-analysis]] — 缓冲区分析\n","fm":{"title":"DDI 综合灾害指数","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/flows/buffer-analysis.md","pages/components/dashboard-disaster-detail-panel.md","pages/views/data-dashboard-view.md"],"related":["concepts/buffer-analysis.md"],"source":["frontend/src/utils/earthquakeAhp.js","frontend/src/components/dashboard/DisasterDetailPanel.vue"],"summary":"DDI（Disaster Damage Index）综合灾害指数，基于 AHP 熵权法的多指标综合评估模型"},"references":["pages/flows/buffer-analysis","pages/components/dashboard-disaster-detail-panel","pages/views/data-dashboard-view"],"related":["pages/concepts/buffer-analysis"],"source":["frontend/src/utils/earthquakeAhp.js","frontend/src/components/dashboard/DisasterDetailPanel.vue"],"type":"concept"},"pages/concepts/geojson":{"content":"\n# GeoJSON 数据格式\n\n## 1. 定义\n\nGeoJSON 是一种轻量级的**地理数据交换格式**，基于 JSON 表示地理要素信息。\n\n## 2. 几何类型\n\n| 类型 | 说明 | 示例 |\n|------|------|------|\n| \`Point\` | 点 | \`{ type: \"Point\", coordinates: [lng, lat] }\` |\n| \`LineString\` | 线 | \`{ type: \"LineString\", coordinates: [[lng, lat], ...] }\` |\n| \`Polygon\` | 面 | \`{ type: \"Polygon\", coordinates: [[[lng, lat], ...]] }\` |\n| \`MultiPoint\` | 多点 | 多个点坐标 |\n| \`MultiLineString\` | 多线 | 多条线坐标 |\n| \`MultiPolygon\` | 多面 | 多个面坐标 |\n\n## 3. Feature 和 FeatureCollection\n\n### 3.1 Feature（单个要素）\n\n\`\`\`json\n{\n  \"type\": \"Feature\",\n  \"geometry\": {\n    \"type\": \"Point\",\n    \"coordinates\": [116.4, 39.9]\n  },\n  \"properties\": {\n    \"name\": \"北京市\",\n    \"population\": 2154\n  }\n}\n\`\`\`\n\n### 3.2 FeatureCollection（要素集合）\n\n\`\`\`json\n{\n  \"type\": \"FeatureCollection\",\n  \"features\": [\n    { \"type\": \"Feature\", \"geometry\": {...}, \"properties\": {...} },\n    { \"type\": \"Feature\", \"geometry\": {...}, \"properties\": {...} }\n  ]\n}\n\`\`\`\n\n## 4. 项目中的应用\n\n### 4.1 数据源格式\n\n- 地图 \`addSource\` 接受 GeoJSON：\`map.addSource('id', { type: 'geojson', data: geojson })\`\n- 空间分析结果统一以 GeoJSON 格式返回\n- Agent 工具返回的 GeoJSON 直接渲染到地图\n\n### 4.2 与 iServer 格式互转\n\n\`\`\`js\n// GeoJSON → iServer Server JSON\nfunction geoToServerJson(geometry) { ... }\n\n// iServer Server JSON → GeoJSON\nfunction serverGeoToGeoJSON(geometry) { ... }\n\`\`\`\n\n## 5. 坐标约定\n\nGeoJSON 使用 **WGS84 坐标系**（EPSG:4326），经度在前、纬度在后。\n\n## 6. 相关概念\n\n- [[pages/concepts/buffer-analysis]] — 缓冲区分析\n- [[pages/concepts/spatial-query]] — 空间查询\n","fm":{"title":"GeoJSON 数据格式","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["flows/buffer-analysis.md","flows/spatial-query.md","flows/network-analysis.md"],"related":["concepts/buffer-analysis.md","concepts/spatial-query.md"],"source":["frontend/src/utils/map.js"],"summary":"GeoJSON 是一种轻量级的地理数据交换格式，基于 JSON 表示地理要素信息"},"references":["pages/flows/buffer-analysis","pages/flows/spatial-query","pages/flows/network-analysis"],"related":["pages/concepts/buffer-analysis","pages/concepts/spatial-query"],"source":["frontend/src/utils/map.js"],"type":"concept"},"pages/concepts/multi-agent":{"content":"\n# 多智能体协同\n\n## 1. 定义\n\n多智能体协同（Multi-Agent Collaboration）是将**复杂任务分解**为多个子任务，由不同的**专业 Agent** 协同完成。\n\n## 2. 架构\n\n\`\`\`\n用户输入 → Coordinator（协调者）\n              ↓\n         意图分类 + 任务规划\n              ↓\n    ┌─────────┼─────────┐\n    ↓         ↓         ↓\nSearch    Analysis   Route   Knowledge\nAgent     Agent     Agent   Agent\n    ↓         ↓         ↓         ↓\n    └─────────┼─────────┘\n              ↓\n         结果汇总 → 输出给用户\n\`\`\`\n\n## 3. 项目中的实现\n\n### 3.1 协调者（Coordinator）\n\n- **意图分类**：识别用户意图（检索/分析/路径/知识/综合）\n- **任务规划**：将复杂任务分解为可执行的子任务\n- **步骤调度**：按顺序或并行调度子 Agent\n\n### 3.2 子 Agent\n\n| Agent | 职责 | 工具 |\n|-------|------|------|\n| **Search Agent** | 执行空间查询、要素搜索 | \`spatial_query\`, \`feature_search\` |\n| **Analysis Agent** | 执行缓冲区分析、网络分析 | \`buffer_analysis\`, \`shortest_path\` |\n| **Route Agent** | 执行路径规划、路线分析 | \`shortest_path\`, \`service_area\` |\n| **Knowledge Agent** | 回答 GIS 知识问题 | \`knowledge_base\` |\n\n### 3.3 通信机制\n\n通过 **SSE（Server-Sent Events）** 实现前后端实时通信：\n\n\`\`\`js\n// 建立 SSE 连接\nconst eventSource = new EventSource('/chat/multi')\n\n// 接收事件\neventSource.addEventListener('onStepDone', (e) => {\n  const data = JSON.parse(e.data)\n  // 更新 UI\n})\n\`\`\`\n\n## 4. 相关概念\n\n- [[pages/concepts/buffer-analysis]] — 缓冲区分析\n- [[pages/concepts/spatial-query]] — 空间查询\n- [[pages/concepts/network-analysis]] — 网络分析\n","fm":{"title":"多智能体协同","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/agent-chat-panel.md","pages/views/home-view.md"],"related":[],"source":["frontend/src/stores/agent.js","frontend/src/utils/agent/sse.js"],"summary":"多智能体协同是将复杂任务分解为多个子任务，由不同的专业 Agent 协同完成"},"references":["pages/components/agent-chat-panel","pages/views/home-view"],"related":[],"source":["frontend/src/stores/agent.js","frontend/src/utils/agent/sse.js"],"type":"concept"},"pages/concepts/network-analysis":{"content":"\n# 网络分析\n\n## 1. 定义\n\n网络分析（Network Analysis）是 GIS 的重要功能，基于**道路网络**计算最短路径和服务区范围。\n\n## 2. 网络分析类型\n\n### 2.1 最短路径分析\n\n给定起点和终点，计算经过道路网络的最短路径。\n\n**算法**：Dijkstra 算法（SuperMap SDK 内置）\n\n**项目应用**：\n- 用户标记 ≥2 个途径点\n- 计算经过道路网络的最短路径\n- 结果以蓝色线渲染\n\n### 2.2 服务区分析\n\n给定中心点和半径，计算道路网络覆盖范围。\n\n**项目应用**：\n- 用户设置中心点和半径（100-3000 米）\n- 计算道路网络覆盖范围\n- 结果以紫色面渲染\n\n## 3. 路网数据\n\n项目使用长春市路网数据：\n\n| 参数 | 值 |\n|------|-----|\n| 数据源 | \`RoadNet@Changchun\` |\n| 服务地址 | \`/iserver/services/transportationanalyst-sample/rest/networkanalyst/RoadNet@Changchun\` |\n| 坐标系 | 长春平面坐标（需转换为 WGS84） |\n\n## 4. 坐标转换\n\n### 4.1 WGS84 → 长春平面\n\n\`\`\`js\nfunction wgs84ToChangchun(lng, lat) {\n  // 使用 proj4 或自定义转换\n  return { x, y }\n}\n\`\`\`\n\n### 4.2 长春平面 → WGS84\n\n\`\`\`js\nfunction changchunToWgs84(x, y) {\n  return [lng, lat]\n}\n\`\`\`\n\n## 5. 相关概念\n\n- [[pages/concepts/buffer-analysis]] — 缓冲区分析\n- [[pages/concepts/spatial-query]] — 空间查询\n","fm":{"title":"网络分析","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/flows/network-analysis.md","pages/components/network-analysis.md"],"related":["concepts/buffer-analysis.md","concepts/spatial-query.md"],"source":["frontend/src/components/NetworkAnalysis.vue","frontend/src/composables/useShortestPath.js"],"summary":"网络分析是 GIS 的重要功能，基于道路网络计算最短路径和服务区范围"},"references":["pages/flows/network-analysis","pages/components/network-analysis"],"related":["pages/concepts/buffer-analysis","pages/concepts/spatial-query"],"source":["frontend/src/components/NetworkAnalysis.vue","frontend/src/composables/useShortestPath.js"],"type":"concept"},"pages/concepts/overlay-analysis":{"content":"\n# 叠置分析\n\n## 1. 定义\n\n叠置分析（Overlay Analysis）是将**多个空间数据层**进行叠加，分析其空间关系和属性关系。\n\n## 2. 叠置类型\n\n| 类型 | 说明 |\n|------|------|\n| **Intersect（相交）** | 保留两个图层的公共部分 |\n| **Union（合并）** | 合并两个图层的所有区域 |\n| **Erase（擦除）** | 从目标图层中擦除源图层区域 |\n| **Identity（标识）** | 用源图层边界切割目标图层 |\n\n## 3. 项目中的应用\n\n项目中的叠置分析主要用于**土地利用叠置**：\n- 将不同年份的土地利用数据叠加\n- 分析土地利用变化情况\n- 结果以专题图形式展示\n\n## 4. 相关概念\n\n- [[pages/concepts/buffer-analysis]] — 缓冲区分析\n- [[pages/concepts/spatial-query]] — 空间查询\n","fm":{"title":"叠置分析","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/spatial-analysis.md"],"related":["concepts/buffer-analysis.md","concepts/spatial-query.md"],"source":["frontend/src/components/SpatialAnalysis.vue"],"summary":"叠置分析是将多个空间数据层进行叠加，分析其空间关系和属性关系"},"references":["pages/components/spatial-analysis"],"related":["pages/concepts/buffer-analysis","pages/concepts/spatial-query"],"source":["frontend/src/components/SpatialAnalysis.vue"],"type":"concept"},"pages/concepts/spatial-query":{"content":"\n# 空间查询\n\n## 1. 定义\n\n空间查询（Spatial Query）是 GIS 的核心功能，根据**空间位置关系**（相交、包含、相邻等）检索地理要素。\n\n## 2. 空间关系\n\n| 关系 | 说明 |\n|------|------|\n| **INTERSECT（相交）** | 两个几何对象有公共部分 |\n| **CONTAIN（包含）** | 一个几何对象完全包含另一个 |\n| **WITHIN（被包含）** | 一个几何对象完全在另一个内部 |\n| **DISJOINT（相离）** | 两个几何对象无公共部分 |\n| **BUFFER（缓冲）** | 在指定距离范围内 |\n\n## 3. 项目中的实现\n\n### 3.1 查询模式\n\n项目支持三种绘制模式：\n\n| 模式 | 说明 |\n|------|------|\n| **点选** | 点击位置 500m 缓冲区查询 |\n| **矩形框选** | 拖拽绘制矩形范围 |\n| **圆形框选** | 两次点击确定圆心和半径 |\n\n### 3.2 查询流程\n\n\`\`\`\n用户绘制范围 → GeoJSON Polygon → iServer REGION 转换 → REST API 查询 → GeoJSON 渲染\n\`\`\`\n\n### 3.3 数据集\n\n项目查询 9 个数据集：\n\n| 数据集 | 说明 |\n|--------|------|\n| \`County_P\` | 县级市 |\n| \`Town_P\` | 乡镇 |\n| \`Road_L\` | 道路 |\n| \`Railway_L\` | 铁路 |\n| \`River_L\` | 河流 |\n| \`Lake_R\` | 湖泊 |\n| \`Landuse_R\` | 土地利用 |\n| \`Geomor_R\` | 地貌 |\n| \`Coastline_L\` | 海岸线 |\n\n## 4. 坐标转换\n\n### 4.1 GeoJSON → iServer REGION\n\n\`\`\`js\nfunction geoToServerJson(geometry) {\n  if (geometry.type === 'Polygon') {\n    const outerRing = geometry.coordinates[0]\n    const points = outerRing.map(([lng, lat]) => ({ x: lng, y: lat }))\n    return { type: 'REGION', points, parts: [outerRing.length] }\n  }\n}\n\`\`\`\n\n### 4.2 iServer 几何 → GeoJSON\n\n\`\`\`js\nfunction serverGeoToGeoJSON(geometry) {\n  if (geometry.type === 'POINT') {\n    return { type: 'Point', coordinates: geometry.points[0] }\n  }\n  if (geometry.type === 'LINE') {\n    return { type: 'LineString', coordinates: geometry.points }\n  }\n  if (geometry.type === 'REGION') {\n    return { type: 'Polygon', coordinates: [geometry.points] }\n  }\n}\n\`\`\`\n\n## 5. 相关概念\n\n- [[pages/concepts/buffer-analysis]] — 缓冲区分析\n- [[pages/concepts/overlay-analysis]] — 叠置分析\n","fm":{"title":"空间查询","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/flows/spatial-query.md","pages/components/spatial-query.md"],"related":["concepts/buffer-analysis.md","concepts/overlay-analysis.md"],"source":["frontend/src/components/SpatialQuery.vue","frontend/src/utils/map.js"],"summary":"空间查询是 GIS 的核心功能，根据空间位置关系（相交、包含、相邻等）检索地理要素"},"references":["pages/flows/spatial-query","pages/components/spatial-query"],"related":["pages/concepts/buffer-analysis","pages/concepts/overlay-analysis"],"source":["frontend/src/components/SpatialQuery.vue","frontend/src/utils/map.js"],"type":"concept"},"pages/entities/agent-state":{"content":"\n# Agent 状态定义\n\n## 1. 概述\n\n多智能体状态定义与 Schema，所有结构化输出都通过 JSON Schema 校验。\n\n## 2. 状态结构\n\n\`\`\`python\nclass AgentState(TypedDict):\n    user_input: str               # 用户原始输入\n    session_id: str               # 会话 ID\n    intent: str                   # 识别出的意图\n    entities: dict                # 提取的实体\n    task_plan: list[dict]         # 拆解后的任务计划\n    current_step: int             # 当前执行到第几步\n    step_results: list[dict]      # 每步的执行结果\n    tool_events: list[dict]       # 工具执行事件\n    final_answer: str             # 最终回答\n\`\`\`\n\n## 3. Schema 定义\n\n### 3.1 意图分类结果\n\n\`\`\`python\nclass IntentResult(BaseModel):\n    intent: Literal[\"search\", \"analysis\", \"route\", \"knowledge\", \"mixed\", \"chat\"]\n    entities: dict\n    reasoning: str\n\`\`\`\n\n### 3.2 任务规划\n\n\`\`\`python\nclass TaskStep(BaseModel):\n    step: int\n    agent_type: Literal[\"search\", \"analysis\", \"route\", \"knowledge\"]\n    description: str\n    tool_hint: str\n\nclass TaskPlan(BaseModel):\n    tasks: list[TaskStep]\n    summary: str\n\`\`\`\n\n### 3.3 子 Agent 结果\n\n\`\`\`python\nclass SubAgentResult(BaseModel):\n    agent_type: str\n    success: bool\n    summary: str\n    geojson: dict | None\n    data: dict\n\`\`\`\n\n## 4. 常量\n\n| 常量 | 值 | 说明 |\n|------|-----|------|\n| \`MAX_STEPS\` | 8 | 最大执行步数（双缓冲区应急流程 7 步 +1 冗余） |\n| \`MAX_RETRY\` | 3 | JSON Schema 校验失败最大重试次数 |\n\n## 5. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 状态定义 | \`agent-backend/app/agent/state.py\` |\n| 协调器 | \`agent-backend/app/agent/coordinator.py\` |\n","fm":{"title":"Agent 状态定义","type":"entity","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["components/agent-coordinator.md","components/agent-sub-agents.md"],"source":["agent-backend/app/agent/state.py"],"summary":"多智能体状态定义与 Schema，所有结构化输出都通过 JSON Schema 校验"},"references":["pages/components/agent-coordinator","pages/components/agent-sub-agents"],"related":[],"source":["agent-backend/app/agent/state.py"],"type":"entity"},"pages/entities/coord-response":{"content":"\n# 协同叫应处置实体 CoordResponse\n\n## 1. 实体概述\n\n协同叫应处置表 \`tb_coord_response\` 的 Java 实体类，用于记录基层责任人对预警信息的响应和处置情况。\n\n## 2. 字段定义\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| \`responseId\` | \`String\` | 处置记录编号（主键） |\n| \`warnId\` | \`String\` | 外键，关联预警表 \`tb_warn_info.warn_id\` |\n| \`unionArea\` | \`String\` | 联动区域 |\n| \`dutyUser\` | \`String\` | 基层责任人 |\n| \`contactPhone\` | \`String\` | 叫应联系电话 |\n| \`callMode\` | \`Integer\` | 叫应方式：1短信 2电话 3平台消息 |\n| \`responseState\` | \`Integer\` | 应答状态：0未接通 1已应答 2已处置 |\n| \`disposeTask\` | \`String\` | 协同处置任务 |\n| \`jointCmd\` | \`String\` | 跨区域联动指令 |\n| \`feedbackTime\` | \`String\` | 反馈时间，格式 \`yyyy-MM-dd HH:mm:ss\` |\n\n## 3. 枚举映射\n\n### callMode（叫应方式）\n\n| 值 | 含义 |\n|----|------|\n| 1 | 短信 |\n| 2 | 电话 |\n| 3 | 平台消息 |\n\n### responseState（应答状态）\n\n| 值 | 含义 |\n|----|------|\n| 0 | 未接通 |\n| 1 | 已应答 |\n| 2 | 已处置 |\n\n## 4. 数据库表\n\n\`\`\`sql\nCREATE TABLE tb_coord_response (\n  response_id    VARCHAR(64) PRIMARY KEY,\n  warn_id        VARCHAR(64),\n  union_area     VARCHAR(255),\n  duty_user      VARCHAR(64),\n  contact_phone  VARCHAR(32),\n  call_mode      INT,\n  response_state INT,\n  dispose_task   TEXT,\n  joint_cmd      TEXT,\n  feedback_time  DATETIME\n);\n\`\`\`\n\n## 5. 关联关系\n\n\`\`\`\ntb_warn_info (1) ──── (N) tb_coord_response\n    warn_id ─────────── warn_id (FK)\n\`\`\`\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 实体类 | \`backend/src/main/java/com/gis/emergency/entity/CoordResponse.java\` |\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/CoordResponseController.java\` |\n| Service | \`backend/src/main/java/com/gis/emergency/service/CoordResponseService.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/CoordResponseMapper.java\` |\n","fm":{"title":"协同叫应处置实体 CoordResponse","type":"entity","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/apis/coord-response.md","pages/views/coord-response-view.md"],"related":["pages/entities/warn-info.md","pages/entities/response-wrapper.md"],"source":["backend/src/main/java/com/gis/emergency/entity/CoordResponse.java","backend/src/main/java/com/gis/emergency/controller/CoordResponseController.java"],"summary":"协同叫应处置表（tb_coord_response）对应的 Java 实体"},"references":["pages/apis/coord-response","pages/views/coord-response-view"],"related":["pages/entities/warn-info","pages/entities/response-wrapper"],"source":["backend/src/main/java/com/gis/emergency/entity/CoordResponse.java","backend/src/main/java/com/gis/emergency/controller/CoordResponseController.java"],"type":"entity"},"pages/entities/response-wrapper":{"content":"\n# 统一响应包装 R<T>\n\n## 1. 实体概述\n\n所有后端 Controller 返回值的统一包装格式，保证前后端接口一致性。\n\n\`\`\`json\n{\n  \"code\": 200,\n  \"message\": \"success\",\n  \"data\": { ... }\n}\n\`\`\`\n\n## 2. 字段定义\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| \`code\` | \`int\` | 状态码：200 成功，非 200 业务异常 |\n| \`message\` | \`String\` | 提示信息 |\n| \`data\` | \`T\` | 返回数据泛型 |\n\n## 3. 静态工厂方法\n\n| 方法 | 入参 | 返回 | 用途 |\n|------|------|------|------|\n| \`ok(T data)\` | 数据对象 | \`R<T>\` code=200, message=\"success\" | 标准成功响应 |\n| \`ok()\` | 无 | \`R<T>\` data=null | 无需返回数据的成功 |\n| \`error(int code, String msg)\` | 状态码 + 消息 | \`R<T>\` 自定义错误 | 业务异常 |\n| \`error(String msg)\` | 错误消息 | \`R<T>\` code=500 | 默认 500 错误 |\n\n## 4. 前端使用方式\n\n\`\`\`js\nimport request from '@/utils/request'\n\nconst res = await request.get('/api/warn-info')\n// res 即 R<T> 结构\nif (res.code === 200) {\n  const list = res.data  // List<WarnInfo>\n} else {\n  console.error(res.message)\n}\n\`\`\`\n\n## 5. 错误处理\n\n- Controller 抛出 \`IllegalArgumentException\` → \`GlobalExceptionHandler\` → \`R.error(400, msg)\`\n- 其他未捕获异常 → \`R.error(500, \"服务器内部错误\")\`\n- 前端 \`utils/request.js\` 拦截非 200 code，弹出 \`message\` 通知\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 统一响应体 | \`backend/src/main/java/com/gis/emergency/common/R.java\` |\n| 全局异常处理 | \`backend/src/main/java/com/gis/emergency/config/GlobalExceptionHandler.java\` |\n| 前端请求封装 | \`frontend/src/utils/request.js\` |\n","fm":{"title":"统一响应包装 R<T>","type":"entity","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/apis/health.md","pages/apis/coord-response.md","pages/apis/warn-info.md","pages/apis/supply-dispatch.md"],"related":["pages/entities/coord-response.md","pages/entities/warn-info.md","pages/entities/supply-dispatch.md"],"source":["backend/src/main/java/com/gis/emergency/common/R.java","backend/src/main/java/com/gis/emergency/config/GlobalExceptionHandler.java"],"summary":"前后端统一响应体，所有 Controller 返回值的包装格式"},"references":["pages/apis/health","pages/apis/coord-response","pages/apis/warn-info","pages/apis/supply-dispatch"],"related":["pages/entities/coord-response","pages/entities/warn-info","pages/entities/supply-dispatch"],"source":["backend/src/main/java/com/gis/emergency/common/R.java","backend/src/main/java/com/gis/emergency/config/GlobalExceptionHandler.java"],"type":"entity"},"pages/entities/supply-dispatch":{"content":"\n# 应急物资调度实体 SupplyDispatch\n\n## 1. 实体概述\n\n应急物资调度总表 \`tb_supply_dispatch\` 的 Java 实体类，用于管理应急物资的调拨和配送。\n\n## 2. 字段定义\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| \`dispatchId\` | \`String\` | 调度单号（主键） |\n| \`warnId\` | \`String\` | 外键，关联预警表 \`tb_warn_info.warn_id\` |\n| \`storageAddr\` | \`String\` | 物资储备库位置 |\n| \`supplyType\` | \`String\` | 物资类型 |\n| \`supplyNum\` | \`Integer\` | 调拨数量 |\n| \`demandArea\` | \`String\` | 需求受灾区域 |\n| \`transportRoute\` | \`String\` | 最优配送路径 |\n| \`distance\` | \`Float\` | 运输里程（公里） |\n| \`departTime\` | \`String\` | 出库时间，格式 \`yyyy-MM-dd HH:mm:ss\` |\n| \`planArrive\` | \`String\` | 预计送达时间，格式 \`yyyy-MM-dd HH:mm:ss\` |\n| \`transportTeam\` | \`String\` | 运输救援队伍 |\n| \`dispatchState\` | \`Integer\` | 调度状态：0待出库 1运输中 2已送达 |\n\n## 3. 枚举映射\n\n### dispatchState（调度状态）\n\n| 值 | 含义 |\n|----|------|\n| 0 | 待出库 |\n| 1 | 运输中 |\n| 2 | 已送达 |\n\n## 4. 数据库表\n\n\`\`\`sql\nCREATE TABLE tb_supply_dispatch (\n  dispatch_id     VARCHAR(64) PRIMARY KEY,\n  warn_id         VARCHAR(64),\n  storage_addr    VARCHAR(255),\n  supply_type     VARCHAR(64),\n  supply_num      INT,\n  demand_area     VARCHAR(255),\n  transport_route TEXT,\n  distance        FLOAT,\n  depart_time     DATETIME,\n  plan_arrive     DATETIME,\n  transport_team  VARCHAR(128),\n  dispatch_state  INT\n);\n\`\`\`\n\n## 5. 关联关系\n\n\`\`\`\ntb_warn_info (1) ──── (N) tb_supply_dispatch\n    warn_id ─────────── warn_id (FK)\n\`\`\`\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 实体类 | \`backend/src/main/java/com/gis/emergency/entity/SupplyDispatch.java\` |\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/SupplyDispatchController.java\` |\n| Service | \`backend/src/main/java/com/gis/emergency/service/SupplyDispatchService.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/SupplyDispatchMapper.java\` |\n","fm":{"title":"应急物资调度实体 SupplyDispatch","type":"entity","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/apis/supply-dispatch.md","pages/views/supply-dispatch-view.md"],"related":["pages/entities/warn-info.md","pages/entities/coord-response.md","pages/entities/response-wrapper.md"],"source":["backend/src/main/java/com/gis/emergency/entity/SupplyDispatch.java","backend/src/main/java/com/gis/emergency/controller/SupplyDispatchController.java"],"summary":"应急物资调度总表（tb_supply_dispatch）对应的 Java 实体"},"references":["pages/apis/supply-dispatch","pages/views/supply-dispatch-view"],"related":["pages/entities/warn-info","pages/entities/coord-response","pages/entities/response-wrapper"],"source":["backend/src/main/java/com/gis/emergency/entity/SupplyDispatch.java","backend/src/main/java/com/gis/emergency/controller/SupplyDispatchController.java"],"type":"entity"},"pages/entities/tool-result":{"content":"\n# 工具结果 schema\n\n## 1. 概述\n\n工具执行结果的统一格式定义，所有 GIS 工具和 RAG 工具的输出必须符合此契约。\n\n## 2. 数据结构\n\n\`\`\`python\nclass ToolResult(BaseModel):\n    success: bool              # 是否成功\n    data: dict = {}            # 返回数据\n    geojson: Optional[dict] = None  # GeoJSON 结果（可选）\n    message: str = \"\"          # 提示信息\n    error: Optional[str] = None     # 错误信息\n\`\`\`\n\n## 3. GeoJSON 缓存机制\n\n工具返回时把完整 geojson 存到线程级缓存（\`threading.local\`），避免 token 暴涨。\n\n\`\`\`python\n# 存储\n_set_pending_geojson(geojson)\n\n# 取出\npop_pending_geojson()\n\`\`\`\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 工具结果 schema | \`agent-backend/app/schemas/tool_result.py\` |\n","fm":{"title":"工具结果 schema","type":"entity","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["tools/gis-tools.md","tools/algo-tools.md","tools/rag-tools.md"],"related":["components/agent-graph.md"],"source":["agent-backend/app/schemas/tool_result.py"],"summary":"工具执行结果的统一格式定义，所有 GIS 工具和 RAG 工具的输出必须符合此契约"},"references":[],"related":["pages/components/agent-graph"],"source":["agent-backend/app/schemas/tool_result.py"],"type":"entity"},"pages/entities/warn-info":{"content":"\n# 气象灾害预警实体 WarnInfo\n\n## 1. 实体概述\n\n气象灾害预警主表 \`tb_warn_info\` 的 Java 实体类，用于存储京津冀地区的气象灾害预警信息。\n\n## 2. 字段定义\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| \`warnId\` | \`String\` | 预警唯一编号（主键） |\n| \`districtCode\` | \`String\` | 所属京津冀区域编码 |\n| \`disasterType\` | \`Integer\` | 灾害类型：1暴雨 2大风 3沙尘 4强对流 |\n| \`warnLevel\` | \`Integer\` | 预警等级：1蓝 2黄 3橙 4红 |\n| \`realMeteorData\` | \`String\` | 实时气象数据 |\n| \`riskScore\` | \`Float\` | AHP熵权综合风险分值 |\n| \`releaseTime\` | \`String\` | 预警发布时间，格式 \`yyyy-MM-dd HH:mm:ss\` |\n| \`validEndTime\` | \`String\` | 预警失效时间，格式 \`yyyy-MM-dd HH:mm:ss\` |\n| \`warnContent\` | \`String\` | 预警研判内容 |\n| \`pushStatus\` | \`Integer\` | 推送状态：0未推送 1已推送 |\n| \`createUser\` | \`String\` | 发布责任人ID |\n\n## 3. 枚举映射\n\n### disasterType（灾害类型）\n\n| 值 | 含义 |\n|----|------|\n| 1 | 暴雨 |\n| 2 | 大风 |\n| 3 | 沙尘 |\n| 4 | 强对流 |\n\n### warnLevel（预警等级）\n\n| 值 | 含义 | 颜色 |\n|----|------|------|\n| 1 | 蓝色预警 | #1890ff |\n| 2 | 黄色预警 | #faad14 |\n| 3 | 橙色预警 | #fa8c16 |\n| 4 | 红色预警 | #f5222d |\n\n### pushStatus（推送状态）\n\n| 值 | 含义 |\n|----|------|\n| 0 | 未推送 |\n| 1 | 已推送 |\n\n## 4. 数据库表\n\n\`\`\`sql\nCREATE TABLE tb_warn_info (\n  warn_id         VARCHAR(64) PRIMARY KEY,\n  district_code   VARCHAR(32),\n  disaster_type   INT,\n  warn_level      INT,\n  real_meteor_data TEXT,\n  risk_score      FLOAT,\n  release_time    DATETIME,\n  valid_end_time  DATETIME,\n  warn_content    TEXT,\n  push_status     INT,\n  create_user     VARCHAR(64)\n);\n\`\`\`\n\n## 5. 关联关系\n\n\`\`\`\ntb_warn_info (1) ──── (N) tb_coord_response\n    warn_id ─────────── warn_id (FK)\n\ntb_warn_info (1) ──── (N) tb_supply_dispatch\n    warn_id ─────────── warn_id (FK)\n\`\`\`\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 实体类 | \`backend/src/main/java/com/gis/emergency/entity/WarnInfo.java\` |\n| Controller | \`backend/src/main/java/com/gis/emergency/controller/WarnInfoController.java\` |\n| Service | \`backend/src/main/java/com/gis/emergency/service/WarnInfoService.java\` |\n| Mapper | \`backend/src/main/java/com/gis/emergency/mapper/WarnInfoMapper.java\` |\n","fm":{"title":"气象灾害预警实体 WarnInfo","type":"entity","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/apis/warn-info.md","pages/views/warn-info-view.md"],"related":["pages/entities/coord-response.md","pages/entities/supply-dispatch.md","pages/entities/response-wrapper.md"],"source":["backend/src/main/java/com/gis/emergency/entity/WarnInfo.java","backend/src/main/java/com/gis/emergency/controller/WarnInfoController.java"],"summary":"气象灾害预警主表（tb_warn_info）对应的 Java 实体"},"references":["pages/apis/warn-info","pages/views/warn-info-view"],"related":["pages/entities/coord-response","pages/entities/supply-dispatch","pages/entities/response-wrapper"],"source":["backend/src/main/java/com/gis/emergency/entity/WarnInfo.java","backend/src/main/java/com/gis/emergency/controller/WarnInfoController.java"],"type":"entity"},"pages/flows/agent-emergency":{"content":"\n# Agent 应急分析流程\n\n## 1. 业务背景\n\n**核心创新模块**：通过自然语言交互替代传统 GIS 工具栏操作，实现\"一句话完成 GIS 应急分析\"。\n\n用户输入自然语言（如\"查询北京市朝阳区附近的医院并规划救援路线\"），Coordinator 自动完成意图识别 → 任务规划 → 工具调用 → 结果汇总，生成结构化报告并标绘到地图。\n\n## 2. 角色与触发\n\n| 角色 | 职责 |\n|------|------|\n| 用户 | 在 AgentChatPanel 输入自然语言 |\n| AgentChatPanel | 前端聊天面板，SSE 连接管理 |\n| Coordinator | 核心调度器，驱动全流程 |\n| Intent | 六类意图分类 + 实体抽取 |\n| Planner | 任务拆解为子任务序列 |\n| Sub Agents | SearchAgent / AnalysisAgent / RouteAgent / KnowledgeAgent |\n| Summarize | 流式汇总结果生成报告 |\n\n## 3. 流程时序图\n\n\`\`\`mermaid\nsequenceDiagram\n  participant U as 用户\n  participant ACP as AgentChatPanel\n  participant C as Coordinator\n  participant Intent as Intent\n  participant P as Planner\n  participant SA as Sub Agents\n  participant S as Summarize\n  participant Map as SmMapViewer\n\n  U->>ACP: 输入\"查询周边医院并规划救援路线\"\n  ACP->>ACP: 创建 SSE 连接 → /api/agent/chat/multi\n  ACP->>C: POST { message, session_id }\n  \n  C->>C: 闲聊检测 → 非闲聊，继续\n  C->>Intent: classify_intent(message)\n  Intent-->>C: { intent: \"mixed\", entities: {location, disaster, radius} }\n  C->>C: yield intent_classified 事件\n  \n  C->>P: plan_tasks(message, intent_result, history)\n  P-->>C: { tasks: [SearchAgent, RouteAgent], summary }\n  C->>C: yield plan_created 事件\n  \n  loop 每个任务步骤\n    C->>SA: execute_sub_agent(step, history)\n    SA->>C: GIS 工具执行结果\n    C->>C: yield step_done 事件\n  end\n  \n  C->>S: astream_summarize_results(step_results)\n  S-->>C: 流式文本 token\n  C->>ACP: text 事件（逐 token）\n  \n  ACP->>U: 流式显示结果报告\n  ACP->>Map: 自动标绘 GeoJSON 结果\n\`\`\`\n\n## 4. 三层架构\n\n### 4.1 语义理解层\n\n| 步骤 | 输入 | 处理 | 输出 |\n|------|------|------|------|\n| 意图分类 | 用户自然语言 | DeepSeek LLM 推理 | 6 类意图 + 实体 |\n| 实体抽取 | 用户输入 | NER 提取 | location/disaster/radius/dataset |\n\n### 4.2 任务执行层\n\n| 任务类型 | 可用工具 | 适用场景 |\n|---------|---------|---------|\n| Search | feature_search, spatial_query, fly_to_location, mock_nearby_resources | 地理要素检索 |\n| Analysis | buffer_analysis, dual_buffer_analysis, overlay_analysis | 空间分析 |\n| Route | shortest_path, service_area, online_route_planning, pareto_resource_optimize, aco_multi_vehicle_route | 路径规划 |\n| Knowledge | rag_retrieval | 应急知识查询 |\n\n### 4.3 协同调度层\n\n| 策略 | 实现 |\n|------|------|\n| 双轨制调度 | async function 替代 LangGraph StateGraph |\n| 退化 Polygon 兜底 | 自动检测并替换 inner Polygon |\n| 灾害半径映射 | 地震 3000/8000、火灾 1000/3000、洪水 2000/5000 |\n| RAG 知识增强 | FAISS 向量检索应急知识 |\n| Pareto 资源优选 | 多目标优化求解最优解集 |\n\n## 5. 关键数据转换\n\n| 步骤 | 输入 | 处理 | 输出 |\n|------|------|------|------|\n| 用户输入 | \"查询周边医院\" | Coordinator 调度 | 意图 + 实体 |\n| 工具调用 | feature_search(keyword=\"医院\") | iServer SQL 查询 | GeoJSON FeatureCollection |\n| 结果渲染 | GeoJSON | map.addSource + addLayer | 地图标绘 |\n| 报告生成 | step_results | LLM 流式汇总 | 结构化文本报告 |\n\n## 6. 异常分支\n\n| 错误场景 | 处理 |\n|---------|------|\n| SSE 连接失败 | 降级到单 Agent 模式 |\n| 意图分类失败 | LLM 重试（最多 3 次） |\n| GIS 工具执行失败 | 跳过该步骤，继续后续步骤 |\n| 知识库未初始化 | 跳过 RAG 检索，纯 LLM 回答 |\n\n## 7. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| API 入口 | \`agent-backend/app/api/agent.py\` |\n| 协调器 | \`agent-backend/app/agent/coordinator.py\` |\n| 子 Agent | \`agent-backend/app/agent/sub_agents/agents.py\` |\n| 前端 SSE | \`frontend/src/utils/agent/sse.js\` |\n\n## 8. 关联页面\n\n- 前端：\`[[pages/components/agent-chat-panel]]\`\n- 后端：\`[[pages/components/agent-coordinator]]\` \`[[pages/components/agent-sub-agents]]\`\n- 概念：\`[[pages/concepts/multi-agent]]\`\n- API：\`[[pages/apis/agent-api]]\`\n","fm":{"title":"Agent 应急分析流程","type":"flow","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/agent-chat-panel.md","pages/components/agent-coordinator.md","pages/components/agent-intent.md","pages/components/agent-planner.md","pages/components/agent-summarize.md","pages/components/agent-sub-agents.md"],"related":["pages/views/home-view.md","concepts/multi-agent.md","apis/agent-api.md"],"source":["agent-backend/app/agent/coordinator.py","agent-backend/app/agent/nodes/intent.py","agent-backend/app/agent/nodes/planner.py","agent-backend/app/agent/nodes/summarize.py","agent-backend/app/agent/sub_agents/agents.py"],"summary":"自然语言输入 → 意图分类 → 任务规划 → 多 Agent 执行 → 结果汇总 → 地图标绘"},"references":["pages/components/agent-chat-panel","pages/components/agent-coordinator","pages/components/agent-intent","pages/components/agent-planner","pages/components/agent-summarize","pages/components/agent-sub-agents"],"related":["pages/views/home-view","pages/concepts/multi-agent","pages/apis/agent-api"],"source":["agent-backend/app/agent/coordinator.py","agent-backend/app/agent/nodes/intent.py","agent-backend/app/agent/nodes/planner.py","agent-backend/app/agent/nodes/summarize.py","agent-backend/app/agent/sub_agents/agents.py"],"type":"flow"},"pages/flows/buffer-analysis":{"content":"\n# 缓冲区分析业务流程\n\n## 1. 业务背景\n\n地震应急场景下，需要以受灾点为中心生成内/外双圈缓冲区：\n- **内圈**（红色）：灾害影响范围，表示直接破坏区域\n- **外圈**（橙色）：应急支援范围，表示可调动的救援力量覆盖区域\n\n在缓冲区范围内叠加支援点（消防/医院/物资库/避难场所）和物资点，最终触发 5 步救援调度。\n\n## 2. 角色与触发\n\n| 角色 | 职责 |\n|------|------|\n| 用户 | 在地图上点击受灾点，触发缓冲区分析 |\n| DataDashboardView | 页面容器，协调各子组件 |\n| BufferZoneLayer | 渲染双圈缓冲区 Polygon |\n| SupportPointLayer | 渲染支援点/物资点/已损毁点 |\n| BufferAnalysisModal | 展示评估摘要 + 启动调度按钮 |\n| RescueDispatchPanel | 5 步救援调度执行面板 |\n\n## 3. 流程时序图\n\n\`\`\`mermaid\nsequenceDiagram\n  participant U as 用户\n  participant DD as DataDashboardView\n  participant BZM as BufferAnalysisModal\n  participant BZL as BufferZoneLayer\n  participant SPL as SupportPointLayer\n  participant RDP as RescueDispatchPanel\n  participant Map as SmMapViewer\n\n  U->>DD: 点击地图上的受灾点\n  DD->>DD: 计算 DDI 综合指数 + 灾情等级\n  DD->>DD: 生成 bufferConfig { inner, outer, innerColor, outerColor }\n  DD->>BZM: 传入 assessment + bufferConfig + disasterCenter\n  DD->>BZL: 传入 map + center + bufferConfig\n  DD->>SPL: 传入 map + supportPoints + supplyPoints + damagedPoints\n\n  BZL->>Map: createCirclePolygon(center, outer, 64)\n  BZL->>Map: addSource('earthquake-buffer-outer-source')\n  BZL->>Map: addLayer('earthquake-buffer-outer')\n  BZL->>Map: createCirclePolygon(center, inner, 64)\n  BZL->>Map: addSource('earthquake-buffer-inner-source')\n  BZL->>Map: addLayer('earthquake-buffer-inner')\n\n  SPL->>Map: 渲染支援点（5 类图标）\n  SPL->>Map: 渲染物资点（4 类图标）\n  SPL->>Map: 渲染已损毁点（灰显）\n\n  BZM->>U: 展示评估摘要（DDI、等级、缓冲区配置、支援点数量）\n  U->>BZM: 点击\"🆘 启动 5 步救援调度\"\n  BZM->>DD: emit('start-rescue')\n  DD->>RDP: 激活救援调度面板\n\`\`\`\n\n## 4. 关键数据转换\n\n| 步骤 | 输入（entity） | 处理逻辑 | 输出（entity） |\n|------|--------------|---------|--------------|\n| 1. 定位受灾点 | 地图点击坐标 \`[lng, lat]\` | 提取坐标 + 计算 DDI 指数 | \`assessment { ddi, level, bufferConfig }\` |\n| 2. 生成缓冲区 | \`bufferConfig { inner, outer }\` | \`createCirclePolygon(center, radius, 64)\` → GeoJSON Polygon | 外圈 Polygon + 内圈 Polygon |\n| 3. 渲染缓冲区 | 外圈/内圈 Polygon | \`map.addSource()\` + \`map.addLayer()\` | 地图上的双圈填充图层 |\n| 4. 叠加支援点 | \`supportPoints[]\` | \`toFeature()\` → GeoJSON FeatureCollection | 地图上的点标记图层 |\n| 5. 启动调度 | 用户点击按钮 | 校验 4 类支援点齐全 → emit 事件 | RescueDispatchPanel 激活 |\n\n## 5. 异常分支\n\n| 错误场景 | 错误码/条件 | 提示信息 | 处理方式 |\n|---------|-----------|---------|---------|\n| 地图实例未就绪 | \`map\` 为 null | 静默失败，不渲染 | 等待地图加载完成后重试 |\n| 缓冲区配置缺失 | \`bufferConfig\` 为 null | 弹窗不显示 | 检查上游 assessment 计算 |\n| 支援点不齐全 | 缺少消防/医院/物资库/避难场所任一类型 | 按钮禁用 + 提示文案 | 等待数据加载或调整缓冲区半径 |\n| 已损毁点存在 | \`damagedPoints.length > 0\` | 红色高亮显示 | 在调度中自动跳过已损毁点 |\n\n## 6. 代码定位\n\n| 代码位置 | 职责 |\n|---------|------|\n| \`DataDashboardView.vue:top-layer\` | 协调 BufferZoneLayer + SupportPointLayer + BufferAnalysisModal |\n| \`BufferZoneLayer.vue:render()\` | 双圈缓冲区 Polygon 生成与渲染 |\n| \`SupportPointLayer.vue:toFeature()\` | 支援点/物资点 GeoJSON 转换 |\n| \`BufferAnalysisModal.vue:canStartRescue\` | 4 类支援点齐全校验 |\n| \`circlePolygon.js:createCirclePolygon()\` | haversine 距离 + 64 边近似圆算法 |\n\n## 7. 关联页面\n\n- 相关组件：\`[[pages/components/dashboard-buffer-analysis-modal]]\` \`[[pages/components/earthquake-buffer-zone-layer]]\` \`[[pages/components/earthquake-rescue-dispatch-panel]]\`\n- 相关页面：\`[[pages/views/data-dashboard-view]]\`\n- 相关概念：\`[[pages/concepts/buffer-analysis]]\`\n","fm":{"title":"缓冲区分析业务流程","type":"flow","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/dashboard-buffer-analysis-modal.md","pages/components/earthquake-buffer-zone-layer.md","pages/components/earthquake-rescue-dispatch-panel.md","pages/views/data-dashboard-view.md"],"related":["pages/components/spatial-query.md","pages/components/network-analysis.md","concepts/buffer-analysis.md"],"source":["frontend/src/components/dashboard/BufferAnalysisModal.vue","frontend/src/components/earthquake/BufferZoneLayer.vue","frontend/src/components/earthquake/SupportPointLayer.vue","frontend/src/components/earthquake/RescueDispatchPanel.vue","frontend/src/utils/circlePolygon.js"],"summary":"受灾点定位 → 双缓冲区渲染 → 支援点/物资点叠加 → 启动救援调度"},"references":["pages/components/dashboard-buffer-analysis-modal","pages/components/earthquake-buffer-zone-layer","pages/components/earthquake-rescue-dispatch-panel","pages/views/data-dashboard-view"],"related":["pages/components/spatial-query","pages/components/network-analysis","pages/concepts/buffer-analysis"],"source":["frontend/src/components/dashboard/BufferAnalysisModal.vue","frontend/src/components/earthquake/BufferZoneLayer.vue","frontend/src/components/earthquake/SupportPointLayer.vue","frontend/src/components/earthquake/RescueDispatchPanel.vue","frontend/src/utils/circlePolygon.js"],"type":"flow"},"pages/flows/coordinated-response":{"content":"\n# 协同叫应流程\n\n## 1. 业务背景\n\n气象灾害预警触发后的区域联动处置流程：\n- 气象预警信息生成 → 区域联动叫应 → 协同处置反馈 → 物资调度\n\n## 2. 角色与触发\n\n| 角色 | 职责 |\n|------|------|\n| 用户 | 在 DataDashboardView 查看预警信息 |\n| WeatherPanel | 展示气象预警实时信息 |\n| WarnInfoView | 气象灾害预警查询与展示 |\n| CoordResponseView | 协同叫应处置记录 |\n| SupplyDispatchView | 应急物资调度管理 |\n\n## 3. 流程时序图\n\n\`\`\`mermaid\nsequenceDiagram\n  participant U as 用户\n  participant DD as DataDashboardView\n  participant WP as WeatherPanel\n  participant WI as WarnInfoView\n  participant CR as CoordResponseView\n  participant SD as SupplyDispatchView\n  participant API as SpringBoot API\n\n  U->>DD: 打开监测-预警-联动页面\n  DD->>WP: 加载气象预警数据\n  WP->>API: GET /api/warn-info\n  API-->>WP: 预警数据列表\n  WP->>U: 展示预警信息（卡片列表）\n\n  U->>WI: 查看预警详情\n  WI->>API: GET /api/warn-info/{id}\n  API-->>WI: 预警详情数据\n  WI->>U: 展示预警详情（类型/等级/区域/时间）\n\n  U->>CR: 发起协同叫应\n  CR->>API: POST /api/coord-response\n  API-->>CR: 叫应记录创建成功\n  CR->>U: 更新叫应列表\n\n  U->>SD: 发起物资调度\n  SD->>API: POST /api/supply-dispatch\n  API-->>SD: 调度记录创建成功\n  SD->>U: 更新调度列表\n\`\`\`\n\n## 4. 关键数据转换\n\n| 步骤 | 输入 | 处理 | 输出 |\n|------|------|------|------|\n| 预警生成 | 气象数据 | 灾害类型 + 预警等级校验 | WarnInfo 记录 |\n| 叫应触发 | 预警 ID + 区域 | 创建叫应记录 | CoordResponse 记录 |\n| 物资调度 | 物资类型 + 数量 + 目的地 | 创建调度记录 | SupplyDispatch 记录 |\n\n## 5. 异常分支\n\n| 错误场景 | 处理 |\n|---------|------|\n| API 请求失败 | 显示错误提示，可重试 |\n| 数据校验失败 | 返回具体字段错误 |\n| 网络超时 | 自动重试 1 次 |\n\n## 6. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| WarnInfoService | \`backend/src/main/java/com/gis/emergency/service/WarnInfoService.java\` |\n| CoordResponseService | \`backend/src/main/java/com/gis/emergency/service/CoordResponseService.java\` |\n| SupplyDispatchService | \`backend/src/main/java/com/gis/emergency/service/SupplyDispatchService.java\` |\n| WeatherPanel | \`frontend/src/components/dashboard/WeatherPanel.vue\` |\n\n## 7. 关联页面\n\n- 页面：\`[[pages/views/data-dashboard-view]]\` \`[[pages/views/warn-info-view]]\` \`[[pages/views/coord-response-view]]\` \`[[pages/views/supply-dispatch-view]]\`\n- 实体：\`[[pages/entities/coord-response]]\` \`[[pages/entities/warn-info]]\` \`[[pages/entities/supply-dispatch]]\`\n","fm":{"title":"协同叫应流程","type":"flow","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/warn-info-view.md","pages/views/coord-response-view.md","pages/views/supply-dispatch-view.md","pages/views/data-dashboard-view.md","pages/components/dashboard-weather-panel.md"],"related":["concepts/network-analysis.md","entities/coord-response.md","entities/warn-info.md"],"source":["backend/src/main/java/com/gis/emergency/service/CoordResponseService.java","backend/src/main/java/com/gis/emergency/service/WarnInfoService.java","backend/src/main/java/com/gis/emergency/service/SupplyDispatchService.java","frontend/src/components/dashboard/WeatherPanel.vue"],"summary":"气象预警 → 区域联动 → 协同叫应 → 物资调度"},"references":["pages/views/warn-info-view","pages/views/coord-response-view","pages/views/supply-dispatch-view","pages/views/data-dashboard-view","pages/components/dashboard-weather-panel"],"related":["pages/concepts/network-analysis","pages/entities/coord-response","pages/entities/warn-info"],"source":["backend/src/main/java/com/gis/emergency/service/CoordResponseService.java","backend/src/main/java/com/gis/emergency/service/WarnInfoService.java","backend/src/main/java/com/gis/emergency/service/SupplyDispatchService.java","frontend/src/components/dashboard/WeatherPanel.vue"],"type":"flow"},"pages/flows/dual-buffer-emergency":{"content":"\n# 双缓冲区应急流程\n\n## 1. 业务背景\n\n地震、洪水、火灾应急场景下，以受灾点为中心生成内/外双圈缓冲区：\n\n- **内圈**（红色）：灾害影响范围，表示直接破坏区域\n- **外圈**（橙色）：应急支援范围，表示可调动的救援力量覆盖范围\n\n在缓冲区范围内叠加支援点（消防/医院/物资库/避难场所）和物资点，最终触发救援调度。\n\n## 2. 灾害类型-半径映射\n\n| 灾害类型 | 内圈半径 | 外圈半径 |\n|---------|---------|---------|\n| 地震 | 3000m | 8000m |\n| 火灾 | 1000m | 3000m |\n| 洪水 | 2000m | 5000m |\n\nLLM 漏传半径参数时自动兜底，确保应急分析准确。\n\n## 3. 角色与触发\n\n| 角色 | 职责 |\n|------|------|\n| 用户 | 在地图上点击受灾点，触发缓冲区分析 |\n| EarthquakeCommandView | 页面容器，协调各子组件 |\n| DisasterDetailPanel | 展示评估摘要（DDI、等级、缓冲区配置） |\n| BufferZoneLayer | 渲染双圈缓冲区 Polygon |\n| SupportPointLayer | 渲染支援点/物资点/已损毁点 |\n| RescueDispatchPanel | 5 步救援调度执行面板 |\n\n## 4. 流程时序图\n\n\`\`\`mermaid\nsequenceDiagram\n  participant U as 用户\n  participant EQ as EarthquakeCommandView\n  participant DDP as DisasterDetailPanel\n  participant BZL as BufferZoneLayer\n  participant SPL as SupportPointLayer\n  participant RDP as RescueDispatchPanel\n  participant Map as SmMapViewer\n\n  U->>EQ: 点击地图上的受灾点\n  EQ->>EQ: 计算 DDI 综合指数 + 灾情等级\n  EQ->>DDP: 传入 assessment + bufferConfig + disasterCenter\n  EQ->>BZL: 传入 map + center + bufferConfig\n  EQ->>SPL: 传入 map + supportPoints + supplyPoints + damagedPoints\n\n  BZL->>Map: createCirclePolygon(center, outer, 64)\n  BZL->>Map: addSource('earthquake-buffer-outer-source')\n  BZL->>Map: addLayer('earthquake-buffer-outer')\n  BZL->>Map: createCirclePolygon(center, inner, 64)\n  BZL->>Map: addSource('earthquake-buffer-inner-source')\n  BZL->>Map: addLayer('earthquake-buffer-inner')\n\n  SPL->>Map: 渲染支援点（5 类图标）\n  SPL->>Map: 渲染物资点（4 类图标）\n  SPL->>Map: 渲染已损毁点（灰显）\n\n  DDP->>U: 展示评估摘要（DDI、等级、缓冲区配置、支援点数量）\n  U->>DDP: 点击\"🆘 启动救援调度\"\n  DDP->>EQ: emit('start-rescue')\n  EQ->>RDP: 激活救援调度面板\n\`\`\`\n\n## 5. 关键数据转换\n\n| 步骤 | 输入 | 处理 | 输出 |\n|------|------|------|------|\n| 定位受灾点 | 地图点击坐标 [lng, lat] | 提取坐标 + 计算 DDI 指数 | assessment { ddi, level, bufferConfig } |\n| 生成缓冲区 | bufferConfig { inner, outer } | createCirclePolygon(center, radius, 64) → GeoJSON Polygon | 外圈 Polygon + 内圈 Polygon |\n| 渲染缓冲区 | 外圈/内圈 Polygon | map.addSource + map.addLayer | 地图上的双圈填充图层 |\n| 叠加支援点 | supportPoints[] | toFeature → GeoJSON FeatureCollection | 地图上的点标记图层 |\n| 启动调度 | 用户点击按钮 | 校验 4 类支援点齐全 → emit 事件 | RescueDispatchPanel 激活 |\n\n## 6. 异常分支\n\n| 错误场景 | 处理 |\n|---------|------|\n| 地图实例未就绪 | 静默失败，不渲染 |\n| 缓冲区配置缺失 | 弹窗不显示 |\n| 支援点不齐全 | 按钮禁用 + 提示文案 |\n| 已损毁点存在 | 红色高亮显示 |\n\n## 7. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| BufferZoneLayer | \`frontend/src/components/earthquake/BufferZoneLayer.vue\` |\n| SupportPointLayer | \`frontend/src/components/earthquake/SupportPointLayer.vue\` |\n| RescueDispatchPanel | \`frontend/src/components/earthquake/RescueDispatchPanel.vue\` |\n| DisasterDetailPanel | \`frontend/src/components/dashboard/DisasterDetailPanel.vue\` |\n\n## 8. 关联页面\n\n- 页面：\`[[pages/views/earthquake-command-view]]\`\n- 组件：BufferZoneLayer, SupportPointLayer, RescueDispatchPanel, DisasterDetailPanel\n- 概念：\`[[pages/concepts/buffer-analysis]]\`\n","fm":{"title":"双缓冲区应急流程","type":"flow","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/views/earthquake-command-view.md","pages/components/dashboard-disaster-detail-panel.md","pages/components/dashboard-buffer-analysis-modal.md","pages/components/earthquake-buffer-zone-layer.md","pages/components/earthquake-rescue-dispatch-panel.md","pages/components/earthquake-support-point-layer.md"],"related":["concepts/buffer-analysis.md","flows/agent-emergency.md"],"source":["frontend/src/components/earthquake/BufferZoneLayer.vue","frontend/src/components/earthquake/RescueDispatchPanel.vue","frontend/src/components/earthquake/SupportPointLayer.vue","frontend/src/components/dashboard/DisasterDetailPanel.vue"],"summary":"灾害定位 → 内外圈生成 → 受灾/支援范围叠加 → 救援调度"},"references":["pages/views/earthquake-command-view","pages/components/dashboard-disaster-detail-panel","pages/components/dashboard-buffer-analysis-modal","pages/components/earthquake-buffer-zone-layer","pages/components/earthquake-rescue-dispatch-panel","pages/components/earthquake-support-point-layer"],"related":["pages/concepts/buffer-analysis","pages/flows/agent-emergency"],"source":["frontend/src/components/earthquake/BufferZoneLayer.vue","frontend/src/components/earthquake/RescueDispatchPanel.vue","frontend/src/components/earthquake/SupportPointLayer.vue","frontend/src/components/dashboard/DisasterDetailPanel.vue"],"type":"flow"},"pages/flows/network-analysis":{"content":"\n# 网络分析业务流程\n\n## 1. 业务背景\n\n基于长春市路网数据，提供两种网络分析能力：\n- **最短路径分析**：用户标记 ≥2 个途径点，计算经过道路网络的最短路径\n- **服务区分析**：用户设置中心点和半径，计算道路网络覆盖范围\n\n分析使用 SuperMap iServer 的 transportationanalyst 服务，路网数据为 \`RoadNet@Changchun\`。\n\n## 2. 角色与触发\n\n| 角色 | 职责 |\n|------|------|\n| 用户 | 选择分析模式，标记路径点/中心点，设置半径 |\n| NetworkAnalysis | 主组件：管理分析状态、调用 SDK、渲染结果 |\n| SmMapViewer | 地图实例，支持点击标记和图层操作 |\n| useMapStore | Pinia store，共享地图实例和图层管理 |\n| SuperMap SDK | \`NetworkAnalystService\` / \`QueryService\` |\n\n## 3. 流程时序图\n\n\`\`\`mermaid\nsequenceDiagram\n  participant U as 用户\n  participant NA as NetworkAnalysis\n  participant Store as useMapStore\n  participant Map as SmMapViewer\n  participant SDK as SuperMap SDK\n  participant API as iServer REST\n\n  U->>NA: 打开网络分析面板\n  NA->>NA: onMounted → switchToChangchun()\n  NA->>Map: 隐藏 world-layer / jingjin-layer\n  NA->>Map: flyTo([125.3, 43.8], zoom:10)\n  NA->>Map: moveend → loadChangchunTile() + loadRoadNetwork()\n\n  rect rgb(230, 245, 255)\n    Note over NA,Map: 长春底图加载\n    NA->>API: GET image.png?width=4096&height=...&viewBounds=...\n    API-->>NA: PNG 图片\n    NA->>Map: addSource('na-bg-image', {type:'image'})\n    NA->>Map: addLayer('na-bg-image')\n  end\n\n  rect rgb(255, 245, 230)\n    Note over NA,Map: 矢量路网加载\n    NA->>SDK: queryBySQL('RoadNet@Changchun')\n    SDK-->>NA: {recordsets: [{features}]}\n    NA->>NA: changchunToWgs84() 坐标转换\n    NA->>Map: addSource('na-road', GeoJSON)\n    NA->>Map: addLayer('na-road-line')\n  end\n\n  NA->>Map: setupClickHandler() 注册点击事件\n\n  alt 最短路径模式\n    U->>Map: 点击标记途径点（≥2个）\n    NA->>NA: points.push({x:lng, y:lat})\n    NA->>Map: 更新 na-draw Source（红色圆点）\n    U->>NA: 点击\"执行最短路径分析\"\n    NA->>NA: wgs84ToChangchun() 坐标转换\n    NA->>API: GET /path.json?nodes=[{x,y},...]&parameter=...\n    API-->>NA: {pathList: [{pathGuideItems, route, weight}]}\n    NA->>NA: 提取路径坐标 → changchunToWgs84()\n    NA->>Map: addSource('na-path', LineString)\n    NA->>Map: addLayer('na-path-line') + fitBounds\n  else 服务区分析模式\n    U->>Map: 点击设置中心点\n    NA->>NA: centerPoint = {x:lng, y:lat}\n    U->>NA: 设置半径（100-3000米）\n    U->>NA: 点击\"执行服务区分析\"\n    NA->>SDK: findServiceAreas(centers, weights, parameter)\n    SDK-->>NA: {serviceAreaList: [{edgeFeatures}]}\n    NA->>NA: 提取边 → changchunToWgs84()\n    NA->>Map: addSource('na-area', LineString[])\n    NA->>Map: addLayer('na-area-fill') + fitBounds\n  end\n\n  U->>NA: 关闭面板\n  NA->>NA: onUnmounted → restoreMap()\n  NA->>Map: 移除长春图层，恢复 world-layer/jingjin-layer\n  NA->>Map: flyTo(savedState.center, savedState.zoom)\n\`\`\`\n\n## 4. 关键数据转换\n\n| 步骤 | 输入（entity） | 处理逻辑 | 输出（entity） |\n|------|--------------|---------|--------------|\n| 1. 地图切换 | 当前地图视图 | 隐藏京津冀图层 → 飞往长春 → 加载底图 | 长春市区图可见 |\n| 2. 路网加载 | \`recordsets[].features\` | \`changchunToWgs84()\` 坐标转换 | GeoJSON LineString 数组 |\n| 3. 标记路径点 | 地图点击 \`[lng, lat]\` | 直接存入 \`points[]\` | \`{x: lng, y: lat}\` |\n| 4. 坐标转长春平面 | WGS84 坐标 | \`wgs84ToChangchun(lng, lat)\` | 平面坐标 \`{x, y}\` |\n| 5. 路径分析请求 | 平面坐标点数组 | 拼接 URL 参数 \`nodes=[{x,y}]\` | GET 请求 URL |\n| 6. 路径结果解析 | \`{pathList: [{pathGuideItems, route}]}\` | 提取坐标 → \`changchunToWgs84()\` | WGS84 LineString 坐标 |\n| 7. 服务区结果解析 | \`{serviceAreaList: [{edgeFeatures}]}\` | 提取边 → \`changchunToWgs84()\` | WGS84 LineString 数组 |\n\n## 5. 异常分支\n\n| 错误场景 | 错误码/条件 | 提示信息 | 处理方式 |\n|---------|-----------|---------|---------|\n| 长春底图加载失败 | iServer 返回错误 | 控制台警告 | 路网仍可加载，分析功能正常 |\n| 路网加载失败 | \`queryBySQL\` 异常 | \`console.warn('[路网] 加载失败')\` | 分析功能不可用，提示用户 |\n| 路径点不足 | \`points.length < 2\` | 按钮禁用 | 等待用户添加更多点 |\n| 未设置中心点 | \`centerPoint\` 为 null | 按钮禁用 | 等待用户点击地图 |\n| 路径分析失败 | API 返回错误 | \`resultInfo = '请求失败: ...'\` | 显示错误信息，不清空标记 |\n| 服务区分析失败 | SDK 回调 \`processFailed\` | \`resultInfo = '请求失败: ...'\` | 显示错误信息 |\n| 未找到路径 | \`data.pathList\` 为空 | \`resultInfo = '未找到路径'\` | 提示用户调整路径点 |\n\n## 6. 代码定位\n\n| 代码位置 | 职责 |\n|---------|------|\n| \`NetworkAnalysis.vue:switchToChangchun()\` | 切换长春视图：隐藏京津冀 → 飞往长春 → 加载底图路网 |\n| \`NetworkAnalysis.vue:loadChangchunTile()\` | 加载长春 tileImage 底图（PNG + viewBounds） |\n| \`NetworkAnalysis.vue:loadRoadNetwork()\` | 加载 RoadNet 矢量路网（queryBySQL + 坐标转换） |\n| \`NetworkAnalysis.vue:findPathAsync()\` | 最短路径 GET 请求封装 |\n| \`NetworkAnalysis.vue:findServiceAreasAsync()\` | 服务区分析 SDK Promise 封装 |\n| \`NetworkAnalysis.vue:displayPathResult()\` | 路径结果解析 + 渲染 |\n| \`NetworkAnalysis.vue:displayAreaResult()\` | 服务区结果解析 + 渲染 |\n| \`map.js:changchunToWgs84()\` / \`wgs84ToChangchun()\` | 长春平面坐标 ↔ WGS84 坐标转换 |\n\n## 7. 关联页面\n\n- 相关组件：\`[[pages/components/network-analysis]]\`\n- 相关页面：\`[[pages/views/home-view]]\`\n- 相关 API：\`[[pages/apis/iserver-network-analyst]]\`（iServer transportationanalyst REST API）\n","fm":{"title":"网络分析业务流程","type":"flow","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/network-analysis.md","pages/views/home-view.md"],"related":["pages/components/spatial-query.md","pages/components/buffer-analysis.md"],"source":["frontend/src/components/NetworkAnalysis.vue","frontend/src/utils/map.js","frontend/src/composables/useShortestPath.js"],"summary":"切换长春视图 → 加载路网 → 标记路径点/中心点 → 最短路径/服务区分析 → 结果渲染"},"references":["pages/components/network-analysis","pages/views/home-view"],"related":["pages/components/spatial-query"],"source":["frontend/src/components/NetworkAnalysis.vue","frontend/src/utils/map.js","frontend/src/composables/useShortestPath.js"],"type":"flow"},"pages/flows/spatial-query":{"content":"\n# 空间查询业务流程\n\n## 1. 业务背景\n\n用户绘制点/矩形/圆形范围，查询京津冀地区 9 个数据集（县级市、乡镇、道路、铁路、河流、湖泊、土地利用、地貌、海岸线）的空间要素，结果按点/线/面分类渲染，支持点击要素查看详情。\n\n## 2. 角色与触发\n\n| 角色 | 职责 |\n|------|------|\n| 用户 | 选择绘制模式，在地图上绘制范围 |\n| SpatialQuery | 主组件：管理绘制状态、调用查询、渲染结果 |\n| SmMapViewer | 地图实例，接收绘制事件和图层操作 |\n| useMapStore | Pinia store，共享地图实例 |\n\n## 3. 流程时序图\n\n\`\`\`mermaid\nsequenceDiagram\n  participant U as 用户\n  participant SQ as SpatialQuery\n  participant Store as useMapStore\n  participant Map as SmMapViewer\n  participant API as iServer REST\n  participant GeoJSON as serverGeoToGeoJSON\n\n  U->>SQ: 点击工具栏选择模式（点/矩形/圆形）\n  SQ->>Map: 注册地图事件监听（mousedown/mousemove/mouseup/click）\n  SQ->>Map: 禁用 dragPan，设置 crosshair 光标\n\n  alt 点选模式\n    U->>Map: 单击地图\n    SQ->>SQ: buildBufferCircle(lngLat, 500) → 32 边 Polygon\n    SQ->>Map: 渲染选择范围（sq-selection-fill）\n  else 矩形模式\n    U->>Map: 按下 → 拖拽 → 释放\n    SQ->>SQ: 计算对角坐标 → Polygon\n    SQ->>Map: 实时预览矩形，释放后确定\n  else 圆形模式\n    U->>Map: 第一次点击设圆心\n    U->>Map: 第二次点击确定半径\n    SQ->>SQ: 实时计算半径（米），实时预览\n  end\n\n  SQ->>SQ: geoToServerJson(geometry) → {type:\"REGION\", points, parts}\n  SQ->>API: POST /iserver/services/data-jingjin/rest/data/featureResults.json\n  API-->>SQ: { datasetInfos, features: [{fieldNames, fieldValues, geometry}] }\n  SQ->>SQ: 解析 datasetInfos 确定每个 feature 的数据集归属\n  SQ->>SQ: 合并 fieldNames + fieldValues → properties\n  SQ->>GeoJSON: serverGeoToGeoJSON(geometry) → 标准 GeoJSON\n  SQ->>Map: 按点/线/面分类 addSource + addLayer\n  SQ->>U: 结果面板显示（总数、各数据集计数、分页列表）\n\n  U->>SQ: 点击结果要素\n  SQ->>Map: flyTo 聚焦 + showPopup(properties)\n\`\`\`\n\n## 4. 关键数据转换\n\n| 步骤 | 输入（entity） | 处理逻辑 | 输出（entity） |\n|------|--------------|---------|--------------|\n| 1. 绘制范围 | 地图点击/拖拽坐标 | \`buildBufferCircle\` / 矩形坐标计算 | GeoJSON Polygon |\n| 2. 坐标转 iServer | GeoJSON Polygon \`{type:\"Polygon\", coordinates}\` | \`geoToServerJson()\` | iServer REGION \`{type:\"REGION\", points:[{x,y}], parts:[n]}\` |\n| 3. 构建请求体 | REGION + 9 个数据集名 | 拼接 datasetNames + spatialQueryMode | POST body \`{getFeatureMode:\"SPATIAL\", datasetNames, geometry, spatialQueryMode:\"INTERSECT\"}\` |\n| 4. 解析响应 | \`{datasetInfos, features}\` | 按 featureRange 确定数据集归属 | \`{dataset, datasetName, geometry, properties, displayName}[]\` |\n| 5. 坐标标准化 | iServer 几何 \`{type:\"POINT/LINE/REGION\", points/parts}\` | \`serverGeoToGeoJSON()\` | 标准 GeoJSON \`{type:\"Point/LineString/Polygon\"}\` |\n| 6. 分类渲染 | GeoJSON features | 按 geometry.type 点/线/面分 3 个 Source | 地图上的 3 个结果图层 |\n\n## 5. 异常分支\n\n| 错误场景 | 错误码/条件 | 提示信息 | 处理方式 |\n|---------|-----------|---------|---------|\n| iServer 请求失败 | \`res.ok === false\` | 显示错误信息（截取前 200 字符） | 展示错误面板，不清空已有结果 |\n| 查询结果为空 | \`allFeatures.length === 0\` | 显示\"未查询到要素\" | 保留结果面板，显示空提示 |\n| 地图实例未就绪 | \`store.mapInstance\` 为 null | 静默退出 | 等待地图加载 |\n| 事件未清理 | 组件卸载时 | — | \`onUnmounted\` → \`clearAll()\` 清除图层和事件 |\n\n## 6. 代码定位\n\n| 代码位置 | 职责 |\n|---------|------|\n| \`SpatialQuery.vue:toggleMode()\` | 模式切换：激活/停用绘制 |\n| \`SpatialQuery.vue:activateDrawMode()\` | 注册地图事件 + 禁用平移 |\n| \`SpatialQuery.vue:buildBufferCircle()\` | 32 边近似圆生成（haversine 距离） |\n| \`SpatialQuery.vue:geoToServerJson()\` | GeoJSON → iServer Server JSON 格式转换 |\n| \`SpatialQuery.vue:doQuery()\` | 执行 fetch 请求 + 结果解析 |\n| \`SpatialQuery.vue:displayResults()\` | 按点/线/面分类渲染到地图 |\n| \`map.js:serverGeoToGeoJSON()\` | iServer 几何 → 标准 GeoJSON |\n\n## 7. 关联页面\n\n- 相关组件：\`[[pages/components/spatial-query]]\` \`[[pages/components/feature-search]]\`\n- 相关页面：\`[[pages/views/home-view]]\`\n- 相关 API：\`[[pages/apis/iserver-feature-results]]\`（iServer featureResults REST API）\n","fm":{"title":"空间查询业务流程","type":"flow","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/spatial-query.md","pages/components/feature-search.md","pages/views/home-view.md"],"related":["pages/components/buffer-analysis.md","pages/components/spatial-analysis.md"],"source":["frontend/src/components/SpatialQuery.vue","frontend/src/components/FeatureSearch.vue","frontend/src/utils/map.js"],"summary":"用户绘制范围 → 转 iServer REGION → REST API 查询 → GeoJSON 渲染 → 要素详情弹窗"},"references":["pages/components/spatial-query","pages/components/feature-search","pages/views/home-view"],"related":["pages/components/spatial-analysis"],"source":["frontend/src/components/SpatialQuery.vue","frontend/src/components/FeatureSearch.vue","frontend/src/utils/map.js"],"type":"flow"},"pages/flows/_template":{"content":"\n# {业务名称} 业务流程\n\n## 1. 业务背景\n\n一句话交代什么场景、解决什么问题。\n\n## 2. 角色与触发\n\n列出参与角色（用户、组件、外部服务）和触发条件。\n\n## 3. 流程时序图\n\n\`\`\`mermaid\nsequenceDiagram\n  participant U as 用户\n  participant V as {组件名}\n  participant M as SmMapViewer\n  participant S as iServer REST\n\n  U->>V: {触发动作}\n  V->>M: {调用地图方法}\n  M-->>V: {返回数据}\n  V->>V: {数据处理/转换}\n  V->>S: {调用接口}\n  S-->>V: {返回结果}\n  V->>M: {渲染图层}\n\`\`\`\n\n## 4. 关键数据转换\n\n每一步\"输入字段 → 变换 → 输出字段\"，对应到 entities/ 页面。\n\n| 步骤 | 输入（entity） | 处理逻辑 | 输出（entity） |\n|------|--------------|---------|--------------|\n| 1. {步骤名} | {输入 entity} | {处理逻辑} | {输出 entity} |\n| 2. {步骤名} | {输入 entity} | {处理逻辑} | {输出 entity} |\n\n## 5. 异常分支\n\n列出常见错误码、对应的 entity 字段、页面上的提示。\n\n| 错误场景 | 错误码/条件 | 提示信息 | 处理方式 |\n|---------|-----------|---------|---------|\n| {场景} | {错误码} | {提示} | {处理} |\n\n## 6. 代码定位\n\n按数据流向倒序，方便排查问题。\n\n| 代码位置 | 职责 |\n|---------|------|\n| {组件路径}:{行号} | {职责描述} |\n| {工具函数路径} | {职责描述} |\n\n## 7. 关联页面\n\n- 相关组件：\`[[{组件页}]]\`\n- 相关实体：\`[[{实体页}]]\`\n- 相关接口：\`[[{接口页}]]\`\n","fm":{"title":"业务流程图模板","type":"flow","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":[],"source":[],"summary":"业务流程图的标准模板，复制后修改"},"references":[],"related":[],"source":[],"type":"flow"},"pages/home":{"content":"\n# 京津冀城市综合防灾应急管理 GIS 项目\n\n## 技术栈\n\n| 层级 | 技术 |\n|------|------|\n| **前端** | Vue 3 + Pinia + MapboxGL + Ant Design Vue |\n| **后端** | SpringBoot + MyBatis + SuperMap iServer 11i |\n| **AI Agent** | FastAPI + LangChain + DeepSeek LLM + FAISS |\n| **数据** | SuperMap iDesktopX 2025 + PostgreSQL |\n| **通信** | SSE (Server-Sent Events) + RESTful API |\n\n## 业务模块\n\n\`\`\`\n京津冀城市综合防灾应急管理 GIS 系统\n│\n├─ 数字大屏\n│   └─ NewBigScreenView\n│\n├─ 二维地图（核心操作区）\n│   ├─ 地图基础操作\n│   │   ├─ SmMapViewer      （地图渲染引擎）\n│   ├─ 基础空间操作\n│   │   ├─ 空间查询：SpatialQuery + FeatureSearch\n│   │   ├─ 空间分析：SpatialAnalysis + BufferAnalysisModal\n│   │   └─ 网络分析：NetworkAnalysis + RoutePlanningModal\n│   │\n│   └─ Agent 应急助手（核心创新）\n│       └─ AgentChatPanel + 全部 FastAPI 后端\n│\n├─ 三维洪水模拟\n│\n├─ 监测-预警-联动\n│   ├─ 气象预警 → 物资调度 → 协同叫应\n│\n└─ 地震指挥\n    ├─ 缓冲区分析 → 救援调度\n\`\`\`\n\n## 核心业务流程\n\n| 流程 | 说明 |\n|------|------|\n| Agent 应急分析 | 自然语言输入 → 意图分类 → 多 Agent 执行 → 结果汇总 |\n| 双缓冲区应急 | 灾害定位 → 内外圈生成 → 救援调度 |\n| 缓冲区分析 | 受灾点定位 → 缓冲区渲染 → 救援调度 |\n| 空间查询 | 绘制范围 → 要素查询 → 结果渲染 |\n| 网络分析 | 标记途径点 → 路径分析 → 结果渲染 |\n| 协同叫应 | 气象预警 → 区域联动 → 物资调度 |\n\n## 项目统计\n\n- **总页面数**：82\n- **节点类型**：6 种\n- **子分类（tech）**：5 种（vue, store, python, fastapi, java）\n","fm":{"title":"项目总览","type":"concept","status":"stable","created":"2026-07-10","updated":"2026-07-14","tags":[],"summary":"京津冀城市综合防灾应急管理 GIS 项目总览"},"references":[],"related":[],"source":[],"type":"concept"},"pages/views/coord-response-view":{"content":"\n# 协同叫应视图 CoordResponseView\n\n## 1. 页面概述\n\n协同叫应处置录入页面，提供表单录入和列表展示，对应 \`tb_coord_response\` 表。\n\n## 2. 功能\n\n- 表单录入：处置记录编号、预警编号、联动区域、责任人、联系电话、叫应方式、应答状态等\n- 列表展示：已有处置记录\n- 提交保存：调用后端 API\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 协同叫应视图 | \`frontend/src/views/CoordResponseView.vue\` |\n","fm":{"title":"协同叫应视图 CoordResponseView","type":"view","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/entities/coord-response.md","pages/apis/coord-response.md"],"related":["pages/views/warn-info-view.md","pages/views/supply-dispatch-view.md"],"source":["frontend/src/views/CoordResponseView.vue"],"summary":"协同叫应处置录入页面，提供表单录入和列表展示"},"references":["pages/entities/coord-response","pages/apis/coord-response"],"related":["pages/views/warn-info-view","pages/views/supply-dispatch-view"],"source":["frontend/src/views/CoordResponseView.vue"],"type":"view"},"pages/views/data-dashboard-view":{"content":"\n# 数据仪表盘\n\n## 1. 定位\n\n监测-预警-联动模块的主页容器，整合了：\n- **气象预警**：实时预警信息 WeatherPanel 卡片\n- **协同叫应**：叫应处置记录 CoordResponseView 区块\n- **物资调度**：应急物资调度 SupplyDispatchView 区块\n- **数据看板**：可视化统计 DashboardDashboardMap 卡片\n\n## 2. 页面布局\n\n\`\`\`\n┌──────────────────────────────────────────────┐\n│  顶部栏：时间 | 预警数量 | 系统状态           │\n├──────────────────────────────────────────────┤\n│  预警信息卡片 │ 预警列表 │ 叫应处置          │\n├──────────────────────────────────────────────┤\n│  数据看板地图 │ 物资调度 │ 区域统计          │\n└──────────────────────────────────────────────┘\n\`\`\`\n\n## 3. 交互流程\n\n- 加载时自动获取最新预警列表\n- 预警卡片按灾害类型/等级颜色编码\n- 点击预警卡片可查看详情并跳转至 warn-info-view\n- 物资调度支持按状态筛选\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 页面 | \`frontend/src/views/DataDashboardView.vue\` |\n| 地图组件 | \`frontend/src/components/dashboard/DashboardDashboardMap.vue\` |\n| 天气面板 | \`frontend/src/components/dashboard/WeatherPanel.vue\` |\n","fm":{"title":"数据仪表盘","type":"view","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/dashboard-dashboard-map.md","pages/components/dashboard-weather-panel.md","pages/views/warn-info-view.md","pages/views/coord-response-view.md","pages/views/supply-dispatch-view.md","pages/components/dashboard-disaster-detail-panel.md","pages/components/dashboard-buffer-analysis-modal.md","pages/components/dashboard-route-planning-modal.md"],"source":["frontend/src/views/DataDashboardView.vue"],"summary":"监测-预警-联动主页，包含气象预警、协同叫应、物资调度、数据看板四大板块"},"references":["pages/components/dashboard-dashboard-map","pages/components/dashboard-weather-panel","pages/views/warn-info-view","pages/views/coord-response-view","pages/views/supply-dispatch-view","pages/components/dashboard-disaster-detail-panel","pages/components/dashboard-buffer-analysis-modal","pages/components/dashboard-route-planning-modal"],"related":[],"source":["frontend/src/views/DataDashboardView.vue"],"type":"view"},"pages/views/earthquake-command-view":{"content":"\n# 地震指挥视图 EarthquakeCommandView\n\n## 1. 页面概述\n\n地震指挥视图，展示震情信息、组织层级和跨区域联动。\n\n## 2. 功能\n\n- 震情信息展示：区域、震级、时间、位置、应急等级\n- 视图切换：多视图切换\n- 滚动预警信息：盲区预警、未应答、物资缺口、道路阻断\n- 三地联合会商按钮\n- 组织层级树\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 地震指挥视图 | \`frontend/src/views/EarthquakeCommandView.vue\` |\n","fm":{"title":"地震指挥视图 EarthquakeCommandView","type":"view","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/views/data-dashboard-view.md","pages/flows/buffer-analysis.md"],"source":["frontend/src/views/EarthquakeCommandView.vue"],"summary":"地震指挥视图，展示震情信息、组织层级和跨区域联动"},"references":[],"related":["pages/views/data-dashboard-view","pages/flows/buffer-analysis"],"source":["frontend/src/views/EarthquakeCommandView.vue"],"type":"view"},"pages/views/flood-simulation-view":{"content":"\n# 洪涝模拟视图 FloodSimulationView\n\n## 1. 页面概述\n\n三维洪水模拟页面，基于 Cesium 实现积石山地区洪水淹没模拟。\n\n## 2. 功能\n\n- 3D 场景展示（Cesium）\n- 洪水淹没模拟：\n  - 淹没高度调节（10-500m）\n  - 速度调节（1-100m/s）\n  - 开始/暂停/重置\n- 实时统计：\n  - 模拟时间\n  - 当前水位\n  - 淹没房屋/道路数量\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 洪涝模拟视图 | \`frontend/src/views/FloodSimulationView.vue\` |\n","fm":{"title":"洪涝模拟视图 FloodSimulationView","type":"view","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/views/home-view.md","pages/views/new-big-screen-view.md"],"source":["frontend/src/views/FloodSimulationView.vue"],"summary":"三维洪水模拟页面，基于 Cesium 实现积石山地区洪水淹没模拟"},"references":[],"related":["pages/views/home-view","pages/views/new-big-screen-view"],"source":["frontend/src/views/FloodSimulationView.vue"],"type":"view"},"pages/views/home-view":{"content":"\n# 首页 HomeView\n\n## 1. 页面概述\n\n应用的默认首页，由两大区域组成：\n- **主地图区域**：SmMapViewer 组件\n- **Agent 应急助手面板**：AgentChatPanel 组件\n\n处理用户与 AI Agent 的交互，包括 SSE 事件流的接收和地图渲染。\n\n## 2. 关键功能\n\n### 2.1 Agent SSE 事件流\n\n通过 \`sendAgentMessage()\` 建立 SSE 连接，处理以下事件：\n\n| 事件 | 处理逻辑 |\n|------|---------|\n| \`onIntentClassified\` | 存储用户意图和实体到 agentStore |\n| \`onPlanCreated\` | 存储执行计划（任务列表 + 摘要） |\n| \`onStepStart\` | 标记步骤开始 |\n| \`onStepDone\` | 标记步骤完成 |\n| \`onToolStart\` | 添加工具调用卡片（loading 状态） |\n| \`onToolResult\` | 更新工具调用卡片（done/error），渲染 GeoJSON 到地图 |\n| \`onText\` | 流式文本追加到 AI 消息 |\n| \`onAgentEnd\` | 标记消息完成，关闭 loading |\n| \`onError\` | 显示错误信息 |\n\n### 2.2 地图渲染\n\nAgent 工具返回的 GeoJSON 通过 \`renderAgentResult()\` 渲染到地图：\n- \`fly_to_location\`：飞行到指定位置\n- 其他 GeoJSON：添加为临时图层\n\n### 2.3 多智能体模式\n\n默认走多智能体 Coordinator（\`useMulti: true\`），保留单 Agent 作为 fallback。\n\n## 3. 生命周期\n\n| 操作 | 职责 |\n|------|------|\n| 发送消息 | 重置工作流 → 添加用户消息 → 创建 AI 占位 → 建立 SSE |\n| 停止生成 | AbortController.abort() → 标记消息完成 |\n| 清空对话 | clearAllAgentResults() + agentStore.resetWorkflow() |\n\n## 4. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 首页视图 | \`frontend/src/views/HomeView.vue\` |\n| Agent 聊天面板 | \`frontend/src/components/AgentChatPanel.vue\` |\n| Agent 状态 | \`frontend/src/stores/agent.js\` |\n| SSE 工具 | \`frontend/src/utils/agent/sse.js\` |\n| 地图渲染 | \`frontend/src/utils/agent/mapRenderer.js\` |\n","fm":{"title":"首页 HomeView","type":"view","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/components/sm-map-viewer.md","pages/components/agent-chat-panel.md","pages/components/agent-chat-message.md"],"related":["pages/views/data-dashboard-view.md","pages/components/spatial-query.md","pages/components/network-analysis.md"],"source":["frontend/src/views/HomeView.vue","frontend/src/components/AgentChatPanel.vue","frontend/src/utils/agent/sse.js","frontend/src/utils/agent/mapRenderer.js"],"summary":"应用首页，集成地图组件和 Agent 应急助手面板，处理 SSE 事件流"},"references":["pages/components/sm-map-viewer","pages/components/agent-chat-panel","pages/components/agent-chat-message"],"related":["pages/views/data-dashboard-view","pages/components/spatial-query","pages/components/network-analysis"],"source":["frontend/src/views/HomeView.vue","frontend/src/components/AgentChatPanel.vue","frontend/src/utils/agent/sse.js","frontend/src/utils/agent/mapRenderer.js"],"type":"view"},"pages/views/new-big-screen-view":{"content":"\n# 大屏视图 NewBigScreenView\n\n## 1. 页面概述\n\n气象灾害监测大屏，展示 KPI 卡片和实时数据。\n\n## 2. 功能\n\n- KPI 卡片展示：\n  - 大风强度（级）\n  - 降雨深度（mm）\n  - 地震强度（级）\n  - 受灾类型\n  - 综合风险等级\n- 实时时钟\n- 趋势警示\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 大屏视图 | \`frontend/src/views/NewBigScreenView.vue\` |\n","fm":{"title":"大屏视图 NewBigScreenView","type":"view","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":[],"related":["pages/views/data-dashboard-view.md","pages/views/flood-simulation-view.md"],"source":["frontend/src/views/NewBigScreenView.vue"],"summary":"气象灾害监测大屏，展示 KPI 卡片和实时数据"},"references":[],"related":["pages/views/data-dashboard-view","pages/views/flood-simulation-view"],"source":["frontend/src/views/NewBigScreenView.vue"],"type":"view"},"pages/views/supply-dispatch-view":{"content":"\n# 物资调度视图 SupplyDispatchView\n\n## 1. 页面概述\n\n应急物资调度录入页面，提供表单录入和列表展示，对应 \`tb_supply_dispatch\` 表。\n\n## 2. 功能\n\n- 表单录入：调度单号、预警编号、储备库位置、物资类型、数量、需求区域等\n- 列表展示：已有调度记录\n- 提交保存：调用后端 API\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 物资调度视图 | \`frontend/src/views/SupplyDispatchView.vue\` |\n","fm":{"title":"物资调度视图 SupplyDispatchView","type":"view","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/entities/supply-dispatch.md","pages/apis/supply-dispatch.md"],"related":["pages/views/coord-response-view.md","pages/views/warn-info-view.md"],"source":["frontend/src/views/SupplyDispatchView.vue"],"summary":"应急物资调度录入页面，提供表单录入和列表展示"},"references":["pages/entities/supply-dispatch","pages/apis/supply-dispatch"],"related":["pages/views/coord-response-view","pages/views/warn-info-view"],"source":["frontend/src/views/SupplyDispatchView.vue"],"type":"view"},"pages/views/warn-info-view":{"content":"\n# 预警信息视图 WarnInfoView\n\n## 1. 页面概述\n\n气象灾害预警信息录入页面，提供表单录入和列表展示，对应 \`tb_warn_info\` 表。\n\n## 2. 功能\n\n- 表单录入：预警编号、区域编码、灾害类型、预警等级、实时气象、风险分值等\n- 列表展示：已有预警记录\n- 提交保存：调用后端 API\n\n## 3. 代码位置\n\n| 文件 | 路径 |\n|------|------|\n| 预警信息视图 | \`frontend/src/views/WarnInfoView.vue\` |\n","fm":{"title":"预警信息视图 WarnInfoView","type":"view","status":"stable","created":"2026-07-10","updated":"2026-07-10","tags":[],"references":["pages/entities/warn-info.md","pages/apis/warn-info.md"],"related":["pages/views/coord-response-view.md","pages/views/supply-dispatch-view.md"],"source":["frontend/src/views/WarnInfoView.vue"],"summary":"气象灾害预警信息录入页面，提供表单录入和列表展示"},"references":["pages/entities/warn-info","pages/apis/warn-info"],"related":["pages/views/coord-response-view","pages/views/supply-dispatch-view"],"source":["frontend/src/views/WarnInfoView.vue"],"type":"view"}};
